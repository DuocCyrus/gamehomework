<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>HẮC VÂN KIẾM — Vượt Ải Diệt Quái</title>
<meta name="description" content="Game hành động 2D chạy trên trình duyệt, viết bằng Canvas 2D + DOM + Event Handling thuần.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════
   HẮC VÂN KIẾM — giao diện (HUD, menu, cửa hàng, bảng cheat)
   ══════════════════════════════════════════════════════════════ */
:root{
  --ink:#eef3fb; --muted:#8d99ad;
  --hp:#f0413f; --hp2:#ff8a5b;
  --mp:#38bdf8; --mp2:#818cf8;
  --en:#fbbf24; --en2:#fde68a;
  --boss:#e11d48; --boss2:#f472b6;
  --edge:rgba(255,255,255,.10);
  --panel:rgba(8,11,19,.74);
  --jade:#4ade80; --ember:#ff7a3c; --amethyst:#a78bfa; --ice:#67e8f9;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:radial-gradient(130% 95% at 50% -10%,#161c30 0%,#080b14 55%,#03040a 100%);
  color:var(--ink);
  font-family:'Be Vietnam Pro',system-ui,'Segoe UI',sans-serif;
  display:grid;place-items:center;overflow:hidden;
  -webkit-user-select:none;user-select:none;touch-action:none;
  -webkit-tap-highlight-color:transparent;
}
#stage{
  position:relative;
  width:min(100vw,calc(100vh*16/9));
  aspect-ratio:16/9;
  container-type:inline-size;
  border-radius:12px;overflow:hidden;
  box-shadow:0 0 0 1px rgba(255,255,255,.07),0 40px 90px -25px #000,0 0 160px -60px #7c3aed;
}
canvas#game{display:block;width:100%;height:100%;background:#04050a}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none;font-size:clamp(9px,1.28cqw,17px)}
#hud .hidden{display:none!important}

.shard{background:var(--panel);border:1px solid var(--edge);backdrop-filter:blur(6px);
  clip-path:polygon(0 0,calc(100% - .85em) 0,100% .85em,100% 100%,.85em 100%,0 calc(100% - .85em));}

.hud-left{position:absolute;left:1.1em;top:1.1em;display:flex;gap:.7em;align-items:flex-start}
.portrait{position:relative;width:4.4em;height:4.4em;flex:0 0 auto;
  border:1px solid rgba(103,232,249,.45);background:#080d16;
  clip-path:polygon(50% 0,100% 26%,100% 74%,50% 100%,0 74%,0 26%);
  box-shadow:0 0 1.4em -.2em rgba(103,232,249,.5) inset}
.portrait canvas{width:100%;height:100%;display:block}
.portrait .lvl{position:absolute;left:50%;bottom:-.35em;transform:translateX(-50%);
  font-size:.62em;font-weight:800;letter-spacing:.08em;background:#0b1220;
  border:1px solid rgba(103,232,249,.5);padding:.05em .5em;color:var(--ice);white-space:nowrap}
.bars{display:flex;flex-direction:column;gap:.32em;width:17em;padding-top:.25em}
.bar{position:relative;height:1.15em;background:#0a0e18;border:1px solid var(--edge);overflow:hidden;
  clip-path:polygon(0 0,100% 0,calc(100% - .5em) 100%,0 100%)}
.bar.mp{height:.8em;width:85%}
.bar.en{height:.62em;width:70%}
.bar i{position:absolute;left:0;top:0;bottom:0;display:block;transition:width .12s linear}
.bar .ghost{background:rgba(255,255,255,.28);transition:width .55s cubic-bezier(.2,.8,.3,1) .18s}
.bar.hp .fill{background:linear-gradient(90deg,var(--hp),var(--hp2))}
.bar.mp .fill{background:linear-gradient(90deg,var(--mp),var(--mp2))}
.bar.en .fill{background:linear-gradient(90deg,var(--en),var(--en2))}
.bar.en.full .fill{animation:pulseGlow .8s infinite}
@keyframes pulseGlow{50%{filter:brightness(1.7) drop-shadow(0 0 .4em var(--en))}}
.bar b{position:absolute;left:.55em;top:50%;transform:translateY(-50%);font-size:.6em;
  font-weight:800;letter-spacing:.14em;color:rgba(255,255,255,.85);text-shadow:0 1px 2px #000}
.bar span{position:absolute;right:.9em;top:50%;transform:translateY(-50%);font-size:.6em;
  font-weight:600;color:rgba(255,255,255,.9);text-shadow:0 1px 2px #000}

.hud-top{position:absolute;left:50%;top:1.05em;transform:translateX(-50%);text-align:center}
#levelName{font-size:.86em;font-weight:800;letter-spacing:.3em;color:#cfd8e6;
  text-shadow:0 0 1.2em rgba(167,139,250,.8),0 2px 4px #000}
#waveDots{display:flex;gap:.42em;justify-content:center;margin-top:.5em}
#waveDots i{width:1.7em;height:.28em;background:rgba(255,255,255,.18);display:block;
  transform:skewX(-24deg);transition:.3s}
#waveDots i.on{background:var(--jade);box-shadow:0 0 .7em var(--jade)}
#waveDots i.cur{background:#fff;box-shadow:0 0 .9em #fff}

.hud-right{position:absolute;right:1.1em;top:1.1em;text-align:right;display:flex;flex-direction:column;gap:.35em}
.stat small{display:block;font-size:.56em;letter-spacing:.24em;color:var(--muted);font-weight:600}
.stat strong{font-size:1.5em;font-weight:800;letter-spacing:.03em;text-shadow:0 2px 6px #000}
.stat.combo{opacity:0;transform:translateY(-.3em);transition:.2s}
.stat.combo.show{opacity:1;transform:none}
.stat.combo strong{color:var(--en);text-shadow:0 0 .7em rgba(251,191,36,.9)}

#bossBar{position:absolute;left:50%;top:1em;transform:translateX(-50%);width:66%;text-align:center}
#bossBar .bname{font-size:.78em;font-weight:800;letter-spacing:.36em;color:#ffd7de;
  text-shadow:0 0 1.1em var(--boss),0 2px 4px #000;margin-bottom:.4em}
#bossBar .btrack{position:relative;height:1em;background:#12060b;border:1px solid rgba(244,63,94,.4);overflow:hidden;
  clip-path:polygon(1em 0,calc(100% - 1em) 0,100% 100%,0 100%)}
#bossBar .btrack i{position:absolute;left:0;top:0;bottom:0}
#bossBar .ghost{background:rgba(255,255,255,.3);transition:width .6s ease .2s}
#bossBar .fill{background:linear-gradient(90deg,#7f1d1d,var(--boss),var(--boss2));transition:width .12s linear}
#bossBar .phases{position:absolute;left:0;right:0;top:1.85em;display:flex;justify-content:center;gap:.4em}
#bossBar .phases i{width:.55em;height:.55em;background:#3b1020;border:1px solid rgba(244,63,94,.5);
  transform:rotate(45deg);transition:.3s}
#bossBar .phases i.on{background:var(--boss2);box-shadow:0 0 .8em var(--boss2)}

#skills{position:absolute;left:1.1em;bottom:1.1em;display:flex;gap:.5em}
.skill{position:relative;width:3em;height:3em;background:var(--panel);border:1px solid var(--edge);
  display:grid;place-items:center;overflow:hidden;
  clip-path:polygon(0 0,calc(100% - .6em) 0,100% .6em,100% 100%,.6em 100%,0 calc(100% - .6em))}
.skill .ic{font-size:1.25em;filter:drop-shadow(0 0 .3em rgba(103,232,249,.6))}
.skill .key{position:absolute;right:.2em;bottom:.05em;font-size:.52em;font-weight:800;
  letter-spacing:.05em;color:var(--muted)}
.skill .cd{position:absolute;inset:0;background:rgba(3,5,10,.78);transform-origin:bottom;transform:scaleY(0)}
.skill.ready{border-color:rgba(103,232,249,.5)}
.skill.locked{opacity:.35}

/* ---------- Overlay / Menus ---------- */
#overlay{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;
  font-size:clamp(9px,1.28cqw,17px)}
#overlay.on{pointer-events:auto;background:rgba(3,5,10,.72);backdrop-filter:blur(3px)}
#overlay .card{max-width:78%;max-height:92%;overflow-y:auto;overscroll-behavior:contain;
  text-align:center;padding:2.4em 3em;position:relative;
  background:linear-gradient(180deg,rgba(12,16,26,.94),rgba(6,9,16,.94));
  border:1px solid var(--edge);
  scrollbar-width:thin;scrollbar-color:rgba(103,232,249,.35) transparent;
  clip-path:polygon(0 0,calc(100% - 1.6em) 0,100% 1.6em,100% 100%,1.6em 100%,0 calc(100% - 1.6em));
  animation:rise .45s cubic-bezier(.2,.9,.25,1)}
@keyframes rise{from{opacity:0;transform:translateY(1.4em) scale(.97)}}
#overlay .eyebrow{font-size:.66em;letter-spacing:.5em;color:var(--muted);font-weight:600;margin-bottom:.8em}
#overlay h1{font-size:2.9em;font-weight:800;letter-spacing:.18em;line-height:1.05;
  background:linear-gradient(180deg,#fff,#8ea3c4);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 .1em .5em rgba(103,232,249,.35))}
#overlay h2{font-size:1.7em;font-weight:800;letter-spacing:.2em;margin-bottom:.5em}
#overlay p{font-size:.92em;line-height:1.75;color:#aab6c8;margin:1em auto 0;max-width:32em}
#overlay .lore{font-style:italic;color:#7f8ca1;border-left:2px solid rgba(167,139,250,.55);
  padding-left:1em;text-align:left;margin-top:1.4em}
#overlay .keys{display:flex;flex-wrap:wrap;gap:.55em;justify-content:center;margin-top:1.6em}
#overlay .keys div{font-size:.72em;color:#9fadc2;background:rgba(255,255,255,.04);
  border:1px solid var(--edge);padding:.4em .8em}
#overlay .keys kbd{font-family:inherit;font-weight:800;color:var(--ice);letter-spacing:.06em}
#overlay .row{display:flex;gap:.8em;justify-content:center;margin-top:1.8em;flex-wrap:wrap}
.btn{font-family:inherit;font-size:.85em;font-weight:800;letter-spacing:.2em;cursor:pointer;
  padding:.85em 2.1em;color:#04070d;background:linear-gradient(180deg,var(--ice),#22a5c0);border:0;
  clip-path:polygon(0 0,calc(100% - .8em) 0,100% .8em,100% 100%,.8em 100%,0 calc(100% - .8em));
  transition:transform .12s,filter .12s}
.btn:hover,.btn:focus-visible{transform:translateY(-2px);filter:brightness(1.15)}
.btn:focus-visible{outline:2px solid #fff;outline-offset:3px}
.btn.ghost{background:transparent;color:#c3cede;border:1px solid var(--edge)}
.btn.danger{background:linear-gradient(180deg,#fb7185,#be123c);color:#fff}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.4em;margin-top:1.8em}
.stats-grid div small{display:block;font-size:.58em;letter-spacing:.22em;color:var(--muted);font-weight:600}
.stats-grid div strong{font-size:1.6em;font-weight:800;color:var(--ice)}

/* Banner giữa màn */
#banner{position:absolute;left:0;right:0;top:34%;text-align:center;pointer-events:none;opacity:0;
  font-size:clamp(9px,1.28cqw,17px)}
#banner.play{animation:bannerIn 2.2s ease forwards}
@keyframes bannerIn{
  0%{opacity:0;transform:scale(1.25);letter-spacing:1em;filter:blur(.3em)}
  18%{opacity:1;transform:scale(1);letter-spacing:.34em;filter:blur(0)}
  75%{opacity:1}100%{opacity:0;transform:scale(.98)}}
#banner .t1{font-size:2.5em;font-weight:800;letter-spacing:.34em;
  text-shadow:0 0 1.5em var(--amethyst),0 .1em .3em #000}
#banner .t2{font-size:.78em;letter-spacing:.42em;color:var(--muted);margin-top:.6em;font-weight:600}

/* Touch controls */
#touch{position:absolute;inset:0;pointer-events:none;display:none;font-size:clamp(10px,1.6cqw,20px)}
#touch.on{display:block}
#touch button{position:absolute;pointer-events:auto;font-family:inherit;font-weight:800;
  background:rgba(12,17,28,.6);border:1px solid var(--edge);color:#d5dfee;
  width:3.4em;height:3.4em;border-radius:50%;font-size:1em;backdrop-filter:blur(4px)}
#touch button:active{background:rgba(103,232,249,.3)}
#tl{left:1.1em;bottom:3.6em}#tr{left:5.2em;bottom:3.6em}
#tj{right:9.6em;bottom:1.6em}#ta{right:5.4em;bottom:2.8em;width:4.4em;height:4.4em}
#td{right:5.9em;bottom:8em}#tm{right:1.2em;bottom:4.4em}#tu{right:1.4em;bottom:9em;border-color:var(--en)}
#tb{left:9.3em;bottom:1.4em;border-color:#8fd8ff;width:4em;height:4em}



/* ---------- Thanh khí thuẫn ---------- */
.bar.sh{height:.72em;width:78%}
.bar.sh .fill{background:linear-gradient(90deg,#3b82f6,#8fd8ff)}
.bar.sh.up .fill{filter:brightness(1.5) drop-shadow(0 0 .35em #8fd8ff)}
.bar.sh.broke{opacity:.4}
.bar.sh.broke .fill{background:#7f1d1d}

/* ---------- Ví vàng ---------- */
.stat.gold strong{color:var(--en);text-shadow:0 0 .6em rgba(251,191,36,.55)}
b.gold,strong.gold{color:var(--en)}

/* ---------- Bảng nâng cấp ---------- */
.uplist{display:grid;grid-template-columns:1fr 1fr;gap:.55em;margin-top:1.4em;text-align:left}
.upbtn{font-family:inherit;cursor:pointer;display:grid;
  grid-template-columns:auto 1fr auto;grid-template-rows:auto auto;gap:.1em .7em;align-items:center;
  padding:.7em .9em;background:rgba(255,255,255,.04);border:1px solid var(--edge);transition:.15s}
.upbtn:hover:not(.off){background:rgba(103,232,249,.12);border-color:rgba(103,232,249,.5);transform:translateY(-2px)}
.upbtn.off{opacity:.42;cursor:not-allowed}
.upbtn .ui{grid-row:1/3;font-size:1.5em;color:var(--ice)}
.upbtn .un{font-size:.8em;font-weight:800;letter-spacing:.1em}
.upbtn .uc{font-size:.72em;font-weight:800;color:var(--en);white-space:nowrap}
.upbtn .ud{grid-column:2/4;font-size:.65em;color:#9fadc2;line-height:1.5}
.up-pips{display:none}
.upbtn .un::after{content:''}
.upbtn .up-pips{display:flex;gap:.2em;grid-column:2/3;grid-row:1;justify-self:end;align-self:center}
.upbtn .up-pips i{width:.42em;height:.42em;background:rgba(255,255,255,.16);transform:rotate(45deg)}
.upbtn .up-pips i.on{background:var(--ice);box-shadow:0 0 .4em var(--ice)}
@media (max-width:700px){.uplist{grid-template-columns:1fr}}

/* ---------- Huy hiệu độ khó & cheat ---------- */
.difftag{display:inline-block;margin-bottom:.5em;font-size:.55em;font-weight:800;letter-spacing:.2em;
  color:var(--dc,#67e8f9);border:1px solid var(--dc,#67e8f9);padding:.25em .8em;background:rgba(6,10,18,.7);
  clip-path:polygon(0 0,calc(100% - .5em) 0,100% .5em,100% 100%,.5em 100%,0 calc(100% - .5em))}
.cheattag{position:absolute;right:1.1em;bottom:1.1em;font-size:.56em;font-weight:800;letter-spacing:.16em;
  color:#fca5a5;border:1px dashed rgba(248,113,113,.6);padding:.3em .8em;background:rgba(30,6,10,.6);display:none}
.cheattag.on{display:block}

/* ---------- Huy hiệu GOD MODE ---------- */
.godtag{position:absolute;right:1.1em;top:4.6em;display:none;align-items:center;gap:.5em;
  padding:.42em .9em;background:rgba(48,32,4,.82);border:1px solid var(--en);
  box-shadow:0 0 1.4em -.2em rgba(251,191,36,.55);
  clip-path:polygon(0 0,calc(100% - .6em) 0,100% .6em,100% 100%,.6em 100%,0 calc(100% - .6em));
  animation:godPulse 1.9s ease-in-out infinite}
.godtag.on{display:flex}
.godtag b{font-size:.95em;color:var(--en2);line-height:1}
.godtag span{font-size:.62em;font-weight:800;letter-spacing:.2em;color:var(--en2)}
.godtag u{text-decoration:none;font-size:.5em;font-weight:700;letter-spacing:.1em;color:#b08a2e}
@keyframes godPulse{50%{box-shadow:0 0 2.2em -.1em rgba(251,191,36,.85)}}

/* nút GOD MODE trong menu */
.btn.god{background:transparent;color:var(--en);border:1px solid rgba(251,191,36,.55)}
.btn.god.on{background:linear-gradient(180deg,var(--en2),var(--en));color:#2a1d02;border-color:transparent}
.opt.god{color:var(--en);border-color:rgba(251,191,36,.45)}
.opt.god:hover{color:var(--en2);border-color:var(--en)}
.opt.god.on{background:rgba(251,191,36,.16);color:var(--en2);border-color:var(--en)}

/* ---------- Chọn độ khó ---------- */
.difflist{display:grid;gap:.55em;margin-top:1.2em;text-align:left}
.diffbtn{font-family:inherit;cursor:pointer;display:grid;
  grid-template-columns:2.1em auto 1fr;gap:.2em .8em;align-items:baseline;
  padding:.8em 1.1em;background:rgba(255,255,255,.03);
  border:1px solid var(--edge);border-left:3px solid var(--dc);transition:.15s}
.diffbtn:hover,.diffbtn:focus-visible{background:rgba(255,255,255,.08);transform:translateX(4px);outline:none;
  border-color:var(--dc);border-left-color:var(--dc)}
.diffbtn .dnum{grid-row:1/3;align-self:center;justify-self:center;font-size:1.5em;font-weight:800;
  color:var(--dc);opacity:.4;line-height:1}
.diffbtn .dn{font-size:1em;font-weight:800;letter-spacing:.16em;color:var(--dc)}
.diffbtn .ds{font-size:.62em;letter-spacing:.24em;color:var(--muted);font-weight:600}
.diffbtn .dhp{grid-column:2/-1;font-size:.6em;letter-spacing:.14em;color:#6e7c91;font-weight:700}
.diffbtn .dmeters{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:.15em 1.3em;margin-top:.5em}
.diffbtn .dm{display:flex;align-items:center;gap:.5em}
.diffbtn .dm small{font-size:.56em;letter-spacing:.16em;color:#6e7c91;font-weight:700;min-width:6.6em}
.diffbtn .pips{display:flex;gap:.22em}
.diffbtn .pips i{width:.5em;height:.5em;background:rgba(255,255,255,.13);transform:rotate(45deg)}
.diffbtn .pips i.on{background:var(--dc);box-shadow:0 0 .45em var(--dc)}
.diffbtn .dd{grid-column:2/-1;font-size:.72em;line-height:1.6;color:#9fadc2;margin-top:.55em}
.diffbtn .dhz{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:.4em;margin-top:.6em}
.diffbtn .dhz i{font-style:normal;font-size:.58em;font-weight:800;letter-spacing:.12em;
  color:var(--hc);border:1px solid var(--hc);padding:.28em .7em;opacity:.85}

/* ---------- Lộ trình 3 ải ở màn hình chính ---------- */
.route{display:grid;grid-template-columns:repeat(3,1fr);gap:.55em;margin-top:1.5em;text-align:left}
.rt{padding:.75em .9em;background:rgba(255,255,255,.03);border:1px solid var(--edge);
  border-top:2px solid var(--tc);display:grid;gap:.3em}
.rt b{font-size:.58em;letter-spacing:.3em;color:var(--tc);font-weight:800}
.rt span{font-size:.76em;font-weight:600;color:#c3cede;line-height:1.35}
.rt i{font-style:normal;font-size:.56em;font-weight:800;letter-spacing:.1em;color:var(--hc);opacity:.8}
@media (max-width:640px){.route{grid-template-columns:1fr}}

/* ---------- Dòng gợi ý & hàng tuỳ chọn ---------- */
#overlay .hint{font-size:.68em;color:#78859a;margin-top:1em;line-height:1.6}
#overlay .hint kbd{font-family:inherit;font-weight:800;color:var(--ice)}
.optrow{display:flex;gap:.5em;justify-content:center;flex-wrap:wrap;margin-top:1.1em;align-items:center}
.opt{font-family:inherit;font-size:.6em;font-weight:800;letter-spacing:.16em;cursor:pointer;
  padding:.5em 1em;color:#9fadc2;background:rgba(255,255,255,.03);border:1px solid var(--edge);transition:.15s}
.opt:hover{color:var(--ice);border-color:rgba(103,232,249,.5)}
.opt.flat{cursor:default;border-color:transparent;background:none;color:#5f6d80;letter-spacing:.1em}
.opt.flat:hover{color:#5f6d80}

/* ---------- Bảng hướng dẫn ---------- */
.helpgrid{display:grid;grid-template-columns:1fr 1fr;gap:1.1em 1.8em;margin-top:1.4em;text-align:left}
.helpgrid h3{font-size:.6em;letter-spacing:.3em;color:var(--ice);font-weight:800;
  padding-bottom:.5em;margin-bottom:.6em;border-bottom:1px solid var(--edge)}
.kr{display:grid;grid-template-columns:8.2em 1fr;gap:.15em .8em;align-items:baseline;margin-bottom:.5em}
.kk{display:flex;gap:.25em;flex-wrap:wrap}
.kk kbd{font-family:inherit;font-size:.58em;font-weight:800;letter-spacing:.06em;color:var(--ice);
  background:rgba(103,232,249,.1);border:1px solid rgba(103,232,249,.3);padding:.25em .5em}
.kn{font-size:.74em;font-weight:700;color:#dbe4f0}
.kd{grid-column:2;font-size:.63em;color:#78859a;line-height:1.5}
.mini{font-size:.68em!important;line-height:1.7!important;color:#9fadc2!important;margin:.5em 0 0!important;max-width:none!important}
.mini b{color:var(--ice)}
@media (max-width:700px){.helpgrid{grid-template-columns:1fr}}

/* ---------- Khối giới thiệu bẫy ---------- */
.hzbox{margin-top:1.4em;text-align:left;border:1px solid rgba(244,63,94,.28);background:rgba(244,63,94,.05);padding:.9em 1.1em}
.hzhead{font-size:.58em;letter-spacing:.28em;color:#f43f5e;font-weight:800;margin-bottom:.7em}
.hzr{display:grid;grid-template-columns:1.8em 1fr;gap:.1em .7em;align-items:baseline;margin-bottom:.55em}
.hzr:last-child{margin-bottom:0}

  <script>
/* ─────── js/01-core.js ─────── */
/* ══════════════════════════════════════════════════════════════
   01-core.js  —  Tiện ích, nạp asset, âm thanh WebAudio, xử lý input
   Nạp theo thứ tự trong index.html; các file dùng chung phạm vi toàn cục.
   ══════════════════════════════════════════════════════════════ */
/* ─────────────── 0. TIỆN ÍCH ─────────────── */
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const pick = a => a[(Math.random() * a.length) | 0];
const sign = v => (v < 0 ? -1 : 1);
const aabb = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const approach = (v, t, s) => (v < t ? Math.min(v + s, t) : Math.max(v - s, t));

/* ───────── 1. ASSET LOADER (sprite-sheet từ internet, có fallback) ─────────
   Game mặc định VẼ TOÀN BỘ bằng Canvas path nên chạy được ngay, không cần mạng.
   Muốn dùng ảnh thật: bật ASSETS.enabled = true và điền URL sprite sheet.
   Nguồn miễn phí gợi ý: itch.io (Kenney, LuizMelo, Craftpix free), opengameart.org
   Sheet phải là lưới ngang đều nhau: frames ảnh xếp cạnh nhau trên 1 hàng.      */
const ASSETS = {
  enabled: false,
  sheets: {
    // ví dụ: hero_idle:{url:'https://.../Idle.png',frames:8,fps:10,anchorY:.86,scale:.55}
    hero_idle: { url: '', frames: 8, fps: 10, anchorY: .86, scale: .55 },
    hero_run:  { url: '', frames: 8, fps: 14, anchorY: .86, scale: .55 },
    boss_idle: { url: '', frames: 8, fps: 8,  anchorY: .92, scale: 1.1 }
  }
};
const IMG = Object.create(null);

function loadSheets() {
  if (!ASSETS.enabled) return;
  for (const [name, cfg] of Object.entries(ASSETS.sheets)) {
    if (!cfg.url) continue;
    const im = new Image();
    im.crossOrigin = 'anonymous';
    im.onload = () => { IMG[name] = im; };            // thành công → dùng ảnh
    im.onerror = () => { console.warn('Không tải được asset:', name); }; // lỗi → vẽ tay
    im.src = cfg.url;
  }
}
/** Vẽ 1 frame của sheet. Trả về false nếu chưa có ảnh → gọi hàm vẽ tay. */
function drawSheet(ctx, name, x, y, face, time) {
  const im = IMG[name]; if (!im) return false;
  const c = ASSETS.sheets[name];
  const fw = im.width / c.frames, fh = im.height;
  const f = Math.floor(time * c.fps) % c.frames;
  const w = fw * c.scale, h = fh * c.scale;
  ctx.save(); ctx.translate(x, y); ctx.scale(face, 1);
  ctx.drawImage(im, f * fw, 0, fw, fh, -w / 2, -h * c.anchorY, w, h);
  ctx.restore(); return true;
}

/* ───────── 2. ÂM THANH — tổng hợp bằng WebAudio, không cần file ───────── */
const Sfx = {
  ac: null, master: null, muted: false,
  init() {
    if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    this.ac = new AC();
    this.master = this.ac.createGain();
    this.master.gain.value = .5;
    this.master.connect(this.ac.destination);
  },
  tone(f1, f2, dur, type = 'square', vol = .18, delay = 0) {
    if (!this.ac || this.muted) return;
    const t = this.ac.currentTime + delay;
    const o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f1, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(1, f2), t + dur);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + .01);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(this.master); o.start(t); o.stop(t + dur + .02);
  },
  noise(dur, vol = .2, hp = 400, delay = 0) {
    if (!this.ac || this.muted) return;
    const t = this.ac.currentTime + delay;
    const n = (this.ac.sampleRate * dur) | 0;
    const buf = this.ac.createBuffer(1, n, this.ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = this.ac.createBufferSource(); src.buffer = buf;
    const f = this.ac.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = this.ac.createGain(); g.gain.value = vol;
    src.connect(f).connect(g).connect(this.master); src.start(t);
  },
  swing()  { this.noise(.14, .16, 1400); this.tone(700, 260, .12, 'sawtooth', .06); },
  hit()    { this.noise(.1, .28, 500); this.tone(180, 60, .12, 'square', .16); },
  crit()   { this.noise(.16, .3, 300); this.tone(320, 70, .2, 'sawtooth', .2); },
  hurt()   { this.tone(300, 90, .26, 'sawtooth', .2); this.noise(.16, .18, 200); },
  jump()   { this.tone(340, 700, .13, 'sine', .13); },
  dash()   { this.noise(.2, .16, 900); this.tone(900, 220, .16, 'sine', .08); },
  magic()  { this.tone(880, 1500, .18, 'sine', .13); this.tone(440, 900, .22, 'triangle', .07, .03); },
  boom()   { this.noise(.5, .34, 120); this.tone(120, 34, .5, 'sawtooth', .22); },
  pickup() { this.tone(660, 990, .1, 'triangle', .16); this.tone(990, 1320, .12, 'triangle', .12, .08); },
  ult()    { this.tone(160, 1400, .5, 'sawtooth', .2); this.noise(.6, .3, 200, .1); },
  roar()   { this.tone(150, 48, .9, 'sawtooth', .26); this.noise(.9, .22, 90); },
  win()    { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, f, .3, 'triangle', .16, i * .12)); },
  lose()   { [392, 330, 262, 196].forEach((f, i) => this.tone(f, f * .96, .4, 'sawtooth', .16, i * .16)); }
};

/* ───────── 2B. NHẠC NỀN — mỗi ải một chủ đề riêng, tổng hợp trực tiếp ─────────
   Không nạp file nhạc nào: mọi nốt đều do WebAudio dựng tại chỗ, đúng tinh thần
   "không framework, không thư viện, không file ảnh/âm thanh" của cả dự án.
   Mỗi bản nhạc là một mảng bước 16 phân; bộ lập lịch nhìn trước 120 ms nên
   không lệ thuộc vào tốc độ khung hình.                                        */

/* Cao độ: tên nốt → tần số (A4 = 440 Hz) */
const NOTE = (() => {
  const base = { C: -9, D: -7, E: -5, F: -4, G: -2, A: 0, B: 2 };
  const m = {};
  for (const k in base)
    for (let oct = 1; oct <= 6; oct++) {
      m[k + oct] = 440 * Math.pow(2, (base[k] + (oct - 4) * 12) / 12);
      m[k + '#' + oct] = 440 * Math.pow(2, (base[k] + 1 + (oct - 4) * 12) / 12);
    }
  return m;
})();
const N = n => NOTE[n] || 0;

/* Ký hiệu: mỗi hàng là 16 bước, '.' = nghỉ.
   bass = nền trầm · lead = giai điệu · drum = k(kick) s(snare) h(hat) g(gong) */
const TRACKS = {
  /* MÀN HÌNH CHÍNH — chậm, thưa, huyền bí */
  menu: {
    bpm: 62, wave: 'sine', leadWave: 'triangle', gain: .5,
    bass: ['A2', '.', '.', '.', '.', '.', '.', '.', 'F2', '.', '.', '.', '.', '.', '.', '.'],
    lead: ['.', '.', 'A4', '.', '.', 'C5', '.', '.', '.', 'E5', '.', '.', 'D5', '.', '.', '.'],
    drum: ['.', '.', '.', '.', '.', '.', '.', '.', 'g', '.', '.', '.', '.', '.', '.', '.'],
    padChord: ['A2', 'E3', 'C4'], padGain: .05
  },
  /* ẢI I · RỪNG TỬ KHÍ — âm hưởng ngũ cung, sáo gỗ, rất thoáng */
  forest: {
    bpm: 76, wave: 'triangle', leadWave: 'sine', gain: .46,
    bass: ['D2', '.', '.', '.', 'D2', '.', '.', '.', 'A2', '.', '.', '.', 'A2', '.', '.', '.'],
    lead: ['D4', '.', 'F4', '.', 'A4', '.', '.', 'G4', 'F4', '.', '.', 'D4', '.', 'C4', '.', '.'],
    drum: ['.', '.', '.', '.', 'h', '.', '.', '.', '.', '.', '.', '.', 'h', '.', 'h', '.'],
    padChord: ['D2', 'A2', 'F3'], padGain: .045
  },
  /* ẢI II · HANG NHAM THẠCH — trống nặng, bè trầm dồn dập */
  cave: {
    bpm: 98, wave: 'sawtooth', leadWave: 'square', gain: .42,
    bass: ['E2', '.', 'E2', '.', 'G2', '.', 'E2', '.', 'A2', '.', 'A2', '.', 'G2', '.', 'F2', '.'],
    lead: ['.', '.', '.', 'E4', '.', '.', 'G4', '.', '.', '.', 'A4', '.', '.', 'G4', '.', 'E4'],
    drum: ['k', '.', '.', 'h', 's', '.', 'h', '.', 'k', '.', 'k', 'h', 's', '.', 'h', 'h'],
    padChord: ['E2', 'B2', 'G3'], padGain: .05
  },
  /* ẢI III · ĐIỆN HẮC ÁM — hành khúc, hợp âm thứ hoà thanh, uy nghi */
  palace: {
    bpm: 104, wave: 'sawtooth', leadWave: 'sawtooth', gain: .44,
    bass: ['C2', '.', 'C2', 'C2', 'G#2', '.', 'G#2', '.', 'A#2', '.', 'A#2', 'A#2', 'G2', '.', 'G2', '.'],
    lead: ['C5', '.', 'D#5', '.', 'G5', '.', 'F5', 'D#5', 'D5', '.', 'C5', '.', 'G4', '.', 'A#4', '.'],
    drum: ['k', '.', 'h', '.', 's', '.', 'h', 'h', 'k', 'k', 'h', '.', 's', '.', 'h', 'h'],
    padChord: ['C2', 'G2', 'D#3'], padGain: .06
  },
  /* HẮC LONG VƯƠNG — nhanh, dày, dồn tới cùng */
  boss: {
    bpm: 138, wave: 'sawtooth', leadWave: 'square', gain: .48,
    bass: ['C2', 'C2', '.', 'C2', 'C2', '.', 'C2', 'C2', 'A#1', 'A#1', '.', 'A#1', 'G#1', '.', 'G#1', 'G#1'],
    lead: ['C5', 'G5', 'D#5', 'C5', 'G#5', 'G5', 'D#5', 'C5', 'A#4', 'F5', 'D5', 'A#4', 'G4', 'D5', 'B4', 'G4'],
    drum: ['k', 'h', 's', 'h', 'k', 'h', 's', 'h', 'k', 'h', 's', 'h', 'k', 'k', 's', 's'],
    padChord: ['C2', 'G2', 'D#3'], padGain: .07
  },
  /* CHIẾN THẮNG — vang, mở, chỉ chạy khi kết ván */
  victory: {
    bpm: 84, wave: 'triangle', leadWave: 'triangle', gain: .5,
    bass: ['C2', '.', '.', '.', 'G2', '.', '.', '.', 'A2', '.', '.', '.', 'F2', '.', '.', '.'],
    lead: ['C5', '.', 'E5', '.', 'G5', '.', '.', 'C6', '.', 'B5', '.', 'G5', 'E5', '.', '.', '.'],
    drum: ['g', '.', '.', '.', '.', '.', '.', '.', 'g', '.', '.', '.', '.', '.', '.', '.'],
    padChord: ['C3', 'G3', 'E4'], padGain: .06
  }
};

const Music = {
  enabled: true, name: null, track: null,
  bus: null, padGain: null, padOsc: [], subOsc: null,
  step: 0, nextT: 0, timer: null, tense: false,

  init() {
    Sfx.init();
    if (!Sfx.ac || this.bus) return;
    this.bus = Sfx.ac.createGain();
    this.bus.gain.value = 0;
    const lp = Sfx.ac.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 5200;
    this.bus.connect(lp).connect(Sfx.master);
    this.lp = lp;
  },

  /** Đổi bản nhạc; gọi lại cùng tên thì bỏ qua để nhạc không giật */
  play(name) {
    if (!TRACKS[name]) return;
    this.init();
    if (!Sfx.ac) return;
    if (this.name === name && this.timer) { this.fade(this.enabled && !Sfx.muted ? 1 : 0); return; }
    this.stopPad();
    this.name = name; this.track = TRACKS[name];
    this.step = 0; this.nextT = Sfx.ac.currentTime + .06;
    if (!this.timer) this.timer = setInterval(() => { try { this.tick(); } catch (e) { /* nhạc hỏng không được làm chết game */ } }, 25);
    this.startPad();
    this.fade(this.enabled && !Sfx.muted ? 1 : 0);
  },

  fade(v, dur = .8) {
    if (!this.bus || !Sfx.ac) return;
    const g = this.bus.gain, t = Sfx.ac.currentTime;
    g.cancelScheduledValues(t);
    g.setValueAtTime(Math.max(.0001, g.value), t);
    g.linearRampToValueAtTime(v * (this.track ? this.track.gain : .5), t + dur);
  },

  stop() { this.fade(0, .5); },
  setEnabled(on) { this.enabled = on; this.fade(on && !Sfx.muted ? 1 : 0, .4); if (on && !this.timer && this.name) this.play(this.name); },
  /** Ác Mộng: thêm một tầng trầm rền phía dưới cho nặng không khí */
  setTense(on) {
    this.tense = on;
    if (!Sfx.ac || !this.bus) return;
    if (on && !this.subOsc) {
      const o = Sfx.ac.createOscillator(), g = Sfx.ac.createGain();
      o.type = 'sine'; o.frequency.value = 41.2;                 // E1
      g.gain.value = .09;
      o.connect(g).connect(this.bus); o.start();
      this.subOsc = { o, g };
    } else if (!on && this.subOsc) {
      try { this.subOsc.o.stop(); } catch (e) { /* đã dừng */ }
      this.subOsc = null;
    }
  },

  /* nền hợp âm giữ liên tục, tạo bề dày cho từng ải */
  startPad() {
    if (!Sfx.ac || !this.track) return;
    const t = Sfx.ac.currentTime;
    this.padGain = Sfx.ac.createGain();
    this.padGain.gain.setValueAtTime(0, t);
    this.padGain.gain.linearRampToValueAtTime(this.track.padGain, t + 1.6);
    this.padGain.connect(this.bus);
    for (const nm of this.track.padChord) {
      const o = Sfx.ac.createOscillator(), g = Sfx.ac.createGain();
      o.type = 'sawtooth'; o.frequency.value = N(nm);
      o.detune.value = rand(-7, 7);
      g.gain.value = .34;
      o.connect(g).connect(this.padGain); o.start(t);
      this.padOsc.push(o);
    }
  },
  stopPad() {
    for (const o of this.padOsc) { try { o.stop(); } catch (e) { /* đã dừng */ } }
    this.padOsc = [];
    if (this.padGain) { try { this.padGain.disconnect(); } catch (e) { /* đã ngắt */ } this.padGain = null; }
  },

  /* bộ lập lịch nhìn trước — không phụ thuộc requestAnimationFrame */
  tick() {
    if (!Sfx.ac || !this.track) return;
    const T = this.track, spb = 60 / T.bpm / 4;               // một bước = nốt móc kép
    while (this.nextT < Sfx.ac.currentTime + .12) {
      this.emit(this.step % 16, this.nextT, spb);
      this.step++; this.nextT += spb;
    }
  },

  emit(i, t, spb) {
    const T = this.track, ac = Sfx.ac;
    if (Sfx.muted || !this.enabled) return;
    const b = T.bass[i]; if (b && b !== '.') this.voice(N(b), t, spb * 3.4, T.wave, .17);
    const l = T.lead[i]; if (l && l !== '.') this.voice(N(l), t, spb * 2.6, T.leadWave, .085);
    const d = T.drum[i];
    if (d === 'k') { this.voice(64, t, .16, 'sine', .3, 34); this.hit(t, .05, .3, 90); }
    else if (d === 's') this.hit(t, .13, .16, 1400);
    else if (d === 'h') this.hit(t, .045, .05, 6500);
    else if (d === 'g') { this.voice(96, t, 1.6, 'sine', .16, 58); this.hit(t, .7, .07, 300); }
  },

  /** một nốt: dao động + bao biên độ, có thể trượt cao độ (dùng cho trống trầm) */
  voice(f, t, dur, type, vol, glide) {
    const ac = Sfx.ac, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (glide) o.frequency.exponentialRampToValueAtTime(glide, t + dur * .85);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + .012);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(this.bus); o.start(t); o.stop(t + dur + .03);
  },
  /** tiếng gõ: nhiễu trắng lọc thông cao */
  hit(t, dur, vol, hp) {
    const ac = Sfx.ac, n = (ac.sampleRate * dur) | 0;
    if (n < 2) return;
    const buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
    for (let k = 0; k < n; k++) d[k] = (Math.random() * 2 - 1) * Math.pow(1 - k / n, 2);
    const src = ac.createBufferSource(); src.buffer = buf;
    const f = ac.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ac.createGain(); g.gain.value = vol;
    src.connect(f).connect(g).connect(this.bus); src.start(t);
  }
};

/** Tắt / bật toàn bộ âm thanh, kéo theo cả nhạc nền */
function toggleMute() {
  Sfx.muted = !Sfx.muted;
  Music.fade(Sfx.muted || !Music.enabled ? 0 : 1, .3);
}

/* ───────── 3. INPUT — Ch.15 Handling Events ───────── */
const Input = {
  held: new Set(), fresh: new Set(),
  mouse: { x: 0, y: 0, wx: 0, wy: 0, down: false, right: false, fresh: false },
  pad: { left: 0, right: 0, jump: 0, atk: 0, dash: 0, magic: 0, ult: 0, block: 0 },
  lock: false,
  down(...c) { return c.some(k => this.held.has(k)); },
  hit(...c)  { return c.some(k => this.fresh.has(k)); },
  endFrame() { this.fresh.clear(); this.mouse.fresh = false; for (const k in this.pad) if (this.pad[k] === 2) this.pad[k] = 1; }
};
const BLOCK = new Set(['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'KeyW', 'KeyA', 'KeyS', 'KeyD']);

addEventListener('keydown', e => {
  if (Input.lock) return;
  if (BLOCK.has(e.code)) e.preventDefault();
  if (e.repeat) return;
  Input.held.add(e.code); Input.fresh.add(e.code);
  Sfx.init();
}, { passive: false });
addEventListener('keyup', e => { if (!Input.lock) Input.held.delete(e.code); });
addEventListener('blur', () => Input.held.clear());

/* ───────── 4. CAMERA ───────── */
const VW = 960, VH = 540, GROUND = 470;
const cam = {
  x: 0, sx: 0, sy: 0, shake: 0, flash: 0, flashCol: '#fff',
  follow(t, w, dt) {
    const want = clamp(t.x - VW / 2 + t.vx * .25, 0, Math.max(0, w - VW));
    this.x = lerp(this.x, want, 1 - Math.pow(.001, dt));
    if (this.shake > 0) {
      this.shake = Math.max(0, this.shake - dt * 26);
      this.sx = rand(-1, 1) * this.shake; this.sy = rand(-1, 1) * this.shake;
    } else { this.sx = this.sy = 0; }
    this.flash = Math.max(0, this.flash - dt * 3.4);
  },
  kick(v) { this.shake = Math.min(26, this.shake + v); },
  bang(c, v) { this.flashCol = c; this.flash = Math.max(this.flash, v); }
};

/* ───────── 5. HẠT & CHỮ BAY ───────── */
const FX = [], TXT = [];
function spark(x, y, n, col, spd = 260, opt = {}) {
  for (let i = 0; i < n; i++) {
    const a = opt.dir != null ? opt.dir + rand(-opt.spread || -.9, opt.spread || .9) : rand(0, TAU);
    const s = rand(spd * .35, spd);
    FX.push({ k: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - (opt.up || 0),
      life: rand(.25, .6), max: .6, r: rand(1.4, 3.4), col, grav: opt.grav ?? 700 });
  }
}
function puff(x, y, n, col, r = 18) {
  for (let i = 0; i < n; i++) FX.push({ k: 'smoke', x: x + rand(-8, 8), y: y + rand(-8, 8),
    vx: rand(-40, 40), vy: rand(-70, -14), life: rand(.4, .9), max: .9, r: rand(r * .4, r), col, grav: -22 });
}
function ring(x, y, col, r0, r1, life = .35, lw = 4) {
  FX.push({ k: 'ring', x, y, r: r0, r1, life, max: life, col, lw });
}
function shard(x, y, n, col) {
  for (let i = 0; i < n; i++) FX.push({ k: 'shard', x, y, vx: rand(-220, 220), vy: rand(-320, -60),
    life: rand(.5, 1), max: 1, r: rand(3, 7), col, grav: 900, rot: rand(0, TAU), spin: rand(-14, 14) });
}
function floatTxt(x, y, t, col, big = false) { TXT.push({ x, y, t, col, life: .9, max: .9, big }); }

function stepFX(dt) {
  for (let i = FX.length - 1; i >= 0; i--) {
    const p = FX[i]; p.life -= dt;
    if (p.life <= 0) { FX.splice(i, 1); continue; }
    if (p.k === 'ring') { p.r = lerp(p.r1, p.r, p.life / p.max); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += (p.grav || 0) * dt; p.vx *= .985;
    if (p.rot != null) p.rot += p.spin * dt;
  }
  for (let i = TXT.length - 1; i >= 0; i--) {
    const t = TXT[i]; t.life -= dt; t.y -= dt * 46; if (t.life <= 0) TXT.splice(i, 1);
  }
}
function drawFX(ctx) {
  for (const p of FX) {
    const a = clamp(p.life / p.max, 0, 1);
    ctx.globalAlpha = a;
    if (p.k === 'ring') {
      ctx.strokeStyle = p.col; ctx.lineWidth = p.lw * a; ctx.beginPath();
      ctx.arc(p.x, p.y, Math.max(.5, p.r), 0, TAU); ctx.stroke();
    } else if (p.k === 'smoke') {
      ctx.fillStyle = p.col; ctx.globalAlpha = a * .42; ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * (2 - a), 0, TAU); ctx.fill();
    } else if (p.k === 'shard') {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.col; ctx.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * .6); ctx.restore();
    } else {
      ctx.fillStyle = p.col; ctx.shadowBlur = 8; ctx.shadowColor = p.col;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * a, 0, TAU); ctx.fill(); ctx.shadowBlur = 0;
    }
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center';
  for (const t of TXT) {
    const a = clamp(t.life / t.max, 0, 1);
    ctx.globalAlpha = a; ctx.font = (t.big ? '800 30px ' : '800 20px ') + "'Be Vietnam Pro',sans-serif";
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.75)'; ctx.strokeText(t.t, t.x, t.y);
    ctx.fillStyle = t.col; ctx.fillText(t.t, t.x, t.y);
  }
  ctx.globalAlpha = 1; ctx.textAlign = 'left';
}

/* ───────── 7. NỀN PARALLAX (Canvas path, không dùng ảnh) ───────── */
const STARS = Array.from({ length: 110 }, () => ({ x: rand(0, 3000), y: rand(0, 320), r: rand(.6, 1.9), p: rand(0, TAU) }));
const AMBI = Array.from({ length: 46 }, () => ({ x: rand(0, 2600), y: rand(60, GROUND), s: rand(.2, .7), p: rand(0, TAU) }));

function hill(ctx, camX, par, yBase, amp, step, col, seed) {
  const off = camX * par;
  ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(-60, VH);
  for (let x = -60; x <= VW + 60; x += step) {
    const wx = x + off;
    const y = yBase - (Math.sin(wx * .0035 + seed) * amp + Math.sin(wx * .0011 + seed * 2) * amp * .8);
    ctx.lineTo(x, y);
  }
  ctx.lineTo(VW + 60, VH); ctx.closePath(); ctx.fill();
}

function drawBackground(ctx, th, camX, t) {
  const T = THEMES[th];
  const g = ctx.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0, T.sky[0]); g.addColorStop(.55, T.sky[1]); g.addColorStop(1, T.sky[2]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);

  if (th !== 'cave') {                                   // sao + mặt trăng / cổng không gian
    ctx.fillStyle = '#fff';
    for (const s of STARS) {
      const x = ((s.x - camX * .05) % 3000 + 3000) % 3000 - 40;
      if (x < -10 || x > VW + 10) continue;
      ctx.globalAlpha = .25 + Math.abs(Math.sin(t * 1.4 + s.p)) * .55;
      ctx.beginPath(); ctx.arc(x, s.y, s.r, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
    const mx = 740 - camX * .04, my = 108, mr = th === 'palace' ? 74 : 54;
    const mg = ctx.createRadialGradient(mx, my, 0, mx, my, mr * 3.4);
    mg.addColorStop(0, th === 'palace' ? 'rgba(167,139,250,.5)' : 'rgba(200,255,225,.34)');
    mg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = mg; ctx.beginPath(); ctx.arc(mx, my, mr * 3.4, 0, TAU); ctx.fill();
    ctx.fillStyle = th === 'palace' ? '#d8ccff' : '#e6fff3';
    ctx.beginPath(); ctx.arc(mx, my, mr, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.14)';
    ctx.beginPath(); ctx.arc(mx - mr * .3, my - mr * .25, mr * .2, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(mx + mr * .25, my + mr * .3, mr * .14, 0, TAU); ctx.fill();
  } else {                                               // hang: quầng dung nham
    const lg = ctx.createRadialGradient(VW / 2, VH + 40, 0, VW / 2, VH + 40, 560);
    lg.addColorStop(0, 'rgba(255,90,20,.4)'); lg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = lg; ctx.fillRect(0, 0, VW, VH);
  }

  hill(ctx, camX, .10, 400, 46, 26, T.far, 1.3);
  hill(ctx, camX, .24, 432, 34, 20, T.mid, 4.1);

  // Lớp cảnh vật đặc trưng
  const off2 = camX * .34;
  if (th === 'forest') {
    for (let i = 0; i < 22; i++) {
      const wx = i * 168 + 40, x = wx - off2; if (x < -110 || x > VW + 110) continue;
      const h = 168 + (i % 4) * 44, sway = Math.sin(t * .7 + i) * 4;
      ctx.fillStyle = '#071a12';
      ctx.beginPath(); ctx.moveTo(x - 9, GROUND); ctx.lineTo(x - 4 + sway, GROUND - h);
      ctx.lineTo(x + 4 + sway, GROUND - h); ctx.lineTo(x + 9, GROUND); ctx.fill();
      for (let b = 0; b < 3; b++) {
        const by = GROUND - h + 22 + b * 34, r = 52 - b * 9;
        ctx.beginPath(); ctx.ellipse(x + sway, by, r, r * .42, 0, 0, TAU); ctx.fill();
      }
    }
  } else if (th === 'cave') {
    for (let i = 0; i < 26; i++) {
      const wx = i * 142 + 30, x = wx - off2; if (x < -80 || x > VW + 80) continue;
      const h = 90 + ((i * 37) % 110);
      ctx.fillStyle = '#170907';
      ctx.beginPath(); ctx.moveTo(x - 26, 0); ctx.lineTo(x, h); ctx.lineTo(x + 26, 0); ctx.fill();
      const h2 = 60 + ((i * 53) % 90);
      ctx.beginPath(); ctx.moveTo(x + 60 - 22, GROUND); ctx.lineTo(x + 60, GROUND - h2); ctx.lineTo(x + 60 + 22, GROUND); ctx.fill();
    }
  } else {
    for (let i = 0; i < 14; i++) {
      const wx = i * 240 + 60, x = wx - off2; if (x < -110 || x > VW + 110) continue;
      const h = 250 + (i % 3) * 60;
      ctx.fillStyle = '#0e0a1c';
      ctx.fillRect(x - 26, GROUND - h, 52, h);
      ctx.fillStyle = '#161033';
      ctx.fillRect(x - 34, GROUND - h - 16, 68, 16);
      ctx.fillRect(x - 32, GROUND - 22, 64, 22);
      ctx.strokeStyle = 'rgba(167,139,250,.22)'; ctx.lineWidth = 2;
      for (let k = 0; k < 4; k++) { ctx.beginPath(); ctx.moveTo(x - 18, GROUND - h + 40 + k * 50); ctx.lineTo(x + 18, GROUND - h + 44 + k * 50); ctx.stroke(); }
    }
    for (let i = 0; i < 10; i++) {          // rune bay
      const wx = i * 260 + 120, x = wx - camX * .5, y = 140 + Math.sin(t * .8 + i) * 26;
      if (x < -30 || x > VW + 30) continue;
      ctx.save(); ctx.translate(x, y); ctx.rotate(t * .5 + i);
      ctx.strokeStyle = 'rgba(232,121,249,.35)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-11, -11); ctx.lineTo(11, 11); ctx.moveTo(11, -11); ctx.lineTo(-11, 11);
      ctx.arc(0, 0, 15, 0, TAU); ctx.stroke(); ctx.restore();
    }
  }

  hill(ctx, camX, .5, 466, 16, 14, T.near, 7.7);

  // hạt môi trường: đom đóm / tàn lửa / bụi phép
  const pcol = th === 'forest' ? 'rgba(160,255,190,' : th === 'cave' ? 'rgba(255,170,80,' : 'rgba(200,170,255,';
  for (const a of AMBI) {
    const x = ((a.x - camX * .6) % 2600 + 2600) % 2600 - 60;
    if (x < -10 || x > VW + 10) continue;
    const y = th === 'cave' ? ((a.y - t * 40 * a.s) % GROUND + GROUND) % GROUND : a.y + Math.sin(t * a.s * 2 + a.p) * 22;
    ctx.fillStyle = pcol + (.25 + Math.abs(Math.sin(t * 2 + a.p)) * .55) + ')';
    ctx.beginPath(); ctx.arc(x, y, 1.6 + a.s * 1.6, 0, TAU); ctx.fill();
  }
}

let NIGHTMARE = false;
/* Ải nào đang bật hiểm hoạ gì — quyết định luôn cả tông màu địa hình */
let HAZARD_KIND = null;
/* Mỗi loại bẫy nhuộm mặt đất một tông riêng, để ba ải Ác Mộng không nhìn giống nhau */
const HZ_TINT = {
  spike:  { ground: ['#232c2a', '#0a1010'], accent: '#9fe8c0', crack: 'rgba(190,235,215,.34)', veil: 'rgba(70,120,110,.05)' },
  meteor: { ground: ['#3a2418', '#150a06'], accent: '#ff9a4a', crack: 'rgba(255,150,60,.5)',  veil: 'rgba(255,90,30,.05)' },
  lava:   { ground: ['#2e1712', '#120705'], accent: '#ff5a1f', crack: 'rgba(255,110,30,.5)',  veil: 'rgba(255,60,20,.055)' }
};
const hzTint = () => (NIGHTMARE && HZ_TINT[HAZARD_KIND]) || null;

function drawGround(ctx, th, camX, w) {
  const tint = hzTint();
  const T = tint ? { ...THEMES[th], ground: tint.ground, accent: tint.accent } : THEMES[th];
  const g = ctx.createLinearGradient(0, GROUND, 0, VH);
  g.addColorStop(0, T.ground[0]); g.addColorStop(1, T.ground[1]);
  ctx.fillStyle = g; ctx.fillRect(0, GROUND, VW, VH - GROUND);
  ctx.strokeStyle = T.accent; ctx.globalAlpha = .35; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, GROUND + 1); ctx.lineTo(VW, GROUND + 1); ctx.stroke(); ctx.globalAlpha = 1;
  const step = 64, start = Math.floor(camX / step) * step;
  ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 2;
  for (let x = start; x < camX + VW + step; x += step) {
    const sx = x - camX;
    ctx.beginPath(); ctx.moveTo(sx, GROUND + 6); ctx.lineTo(sx - 8, VH); ctx.stroke();
    if (th === 'cave' || tint) {
      ctx.strokeStyle = tint ? tint.crack : 'rgba(255,110,30,.5)'; ctx.beginPath();
      ctx.moveTo(sx + 18, GROUND + 14); ctx.lineTo(sx + 34, GROUND + 30); ctx.lineTo(sx + 24, VH); ctx.stroke();
      ctx.strokeStyle = 'rgba(0,0,0,.35)';
    }
  }
  if (th === 'forest' && !tint) {
    ctx.fillStyle = '#2c5c3b';
    for (let x = start; x < camX + VW + step; x += 22) {
      const sx = x - camX, h = 8 + ((x * 7) % 11);
      ctx.beginPath(); ctx.moveTo(sx, GROUND); ctx.lineTo(sx + 3, GROUND - h); ctx.lineTo(sx + 6, GROUND); ctx.fill();
    }
  }
}

function drawPlatform(ctx, th, p) {
  const tint = hzTint();
  const T = tint ? { ground: tint.ground, accent: tint.accent } : THEMES[th];
  const [x, y, w] = p, h = 20;
  ctx.fillStyle = T.ground[1]; ctx.fillRect(x, y, w, h + 12);
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, T.ground[0]); g.addColorStop(1, T.ground[1]);
  ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = T.accent; ctx.globalAlpha = .55; ctx.fillRect(x, y, w, 2.5); ctx.globalAlpha = 1;
  ctx.fillStyle = 'rgba(0,0,0,.4)';
  for (let i = 8; i < w - 8; i += 26) ctx.fillRect(x + i, y + h, 5, 10 + (i % 3) * 4);
  if (tint) {
    ctx.strokeStyle = tint.crack; ctx.lineWidth = 1.6;
    for (let i = 14; i < w - 14; i += 34) {
      ctx.beginPath(); ctx.moveTo(x + i, y + 4); ctx.lineTo(x + i + 8, y + 12); ctx.lineTo(x + i + 2, y + h); ctx.stroke();
    }
  }
}

/* ═══ 8. NGHỆ THUẬT — mọi sprite vẽ bằng path, gradient, glow ═══ */

function capsule(ctx, x1, y1, x2, y2, r, fill, stroke) {
  const a = Math.atan2(y2 - y1, x2 - x1);
  ctx.beginPath();
  ctx.arc(x1, y1, r, a + Math.PI / 2, a - Math.PI / 2);
  ctx.arc(x2, y2, r, a - Math.PI / 2, a + Math.PI / 2);
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.lineWidth = 1.6; ctx.strokeStyle = stroke; ctx.stroke(); }
}
function glowDot(ctx, x, y, r, col) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
}
function shadowBlob(ctx, x, y, w, a = .38) {
  ctx.fillStyle = 'rgba(0,0,0,' + a + ')';
  ctx.beginPath(); ctx.ellipse(x, y, w, w * .26, 0, 0, TAU); ctx.fill();
}

/* ---------- 8.3 BOSS: HẮC LONG VƯƠNG ---------- */
const PHASE_COL = ['#ff4d4d', '#ff9d3d', '#e879f9'];
function drawBoss(ctx, b) {
  const t = b.animT, flap = Math.sin(t * 2.6), core = PHASE_COL[b.phase];
  shadowBlob(ctx, b.x, GROUND + 2, 62, .42);
  ctx.save(); ctx.translate(b.x, b.y); ctx.scale(b.face * b.sc, b.sc);
  if (b.hurtT > 0) ctx.globalAlpha = .6 + Math.abs(Math.sin(b.hurtT * 36)) * .4;
  if (b.invT > 0) { ctx.shadowBlur = 26; ctx.shadowColor = core; }

  glowDot(ctx, 0, -90, 150, 'rgba(225,29,72,' + (.14 + b.phase * .05) + ')');

  /* đuôi gai */
  ctx.strokeStyle = '#241019'; ctx.lineWidth = 13; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-14, -40);
  ctx.quadraticCurveTo(-70, -30 + flap * 10, -104, -66 + flap * 22); ctx.stroke();
  ctx.lineWidth = 6; ctx.strokeStyle = '#3d1a26';
  ctx.beginPath(); ctx.moveTo(-104, -66 + flap * 22); ctx.lineTo(-124, -78 + flap * 26); ctx.stroke();
  ctx.lineCap = 'butt';
  ctx.fillStyle = '#5b1f2e';
  for (let i = 1; i <= 4; i++) {
    const u = i / 5, x = lerp(-14, -104, u), y = lerp(-40, -66 + flap * 22, u) - 8;
    ctx.beginPath(); ctx.moveTo(x - 6, y + 6); ctx.lineTo(x, y - 12); ctx.lineTo(x + 6, y + 6); ctx.fill();
  }

  /* cánh màng khổng lồ */
  const wingG = ctx.createLinearGradient(0, -180, 0, -20);
  wingG.addColorStop(0, '#4a0f22'); wingG.addColorStop(1, '#180509');
  for (const s of [-1, 1]) {
    const o = s < 0 ? 1 : .82, fl = flap * (s < 0 ? 1 : .85);
    ctx.save(); ctx.globalAlpha = (b.hurtT > 0 ? .6 : 1) * o;
    ctx.beginPath();
    ctx.moveTo(0, -118);
    ctx.quadraticCurveTo(s * 60, -190 - fl * 26, s * 132, -156 - fl * 34);
    ctx.quadraticCurveTo(s * 96, -132 - fl * 12, s * 116, -96 - fl * 20);
    ctx.quadraticCurveTo(s * 82, -104 - fl * 8, s * 92, -56 - fl * 12);
    ctx.quadraticCurveTo(s * 58, -78, s * 60, -34 - fl * 6);
    ctx.quadraticCurveTo(s * 30, -68, 0, -84);
    ctx.closePath(); ctx.fillStyle = wingG; ctx.fill();
    ctx.strokeStyle = 'rgba(244,63,94,.4)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.strokeStyle = 'rgba(120,30,50,.9)'; ctx.lineWidth = 3.4;
    ctx.beginPath(); ctx.moveTo(0, -112); ctx.quadraticCurveTo(s * 66, -172 - fl * 22, s * 130, -154 - fl * 32); ctx.stroke();
    ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(s * 8, -108); ctx.lineTo(s * 114, -98 - fl * 20); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(s * 8, -100); ctx.lineTo(s * 90, -58 - fl * 12); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(s * 8, -92); ctx.lineTo(s * 58, -36 - fl * 6); ctx.stroke();
    ctx.restore();
  }

  /* chân */
  const stomp = b.state === 'slam' ? clamp(1 - b.stateT / .5, 0, 1) : 0;
  for (const s of [-1, 1]) {
    ctx.fillStyle = s < 0 ? '#25101a' : '#331723';
    ctx.beginPath();
    ctx.moveTo(s * 12, -60); ctx.lineTo(s * 34, -34); ctx.lineTo(s * 26, -2 - stomp * 4);
    ctx.lineTo(s * 4, -2); ctx.lineTo(s * 6, -34); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#12060a'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#e7dccb';
    for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(s * (8 + i * 8), -2); ctx.lineTo(s * (12 + i * 8), 6); ctx.lineTo(s * (4 + i * 8), 4); ctx.fill(); }
  }

  /* thân giáp + lõi yếu điểm */
  ctx.beginPath();
  ctx.moveTo(-40, -62); ctx.lineTo(-46, -118); ctx.lineTo(-22, -142);
  ctx.lineTo(24, -142); ctx.lineTo(48, -116); ctx.lineTo(42, -60);
  ctx.quadraticCurveTo(0, -44, -40, -62); ctx.closePath();
  const tg = ctx.createLinearGradient(-46, -142, 48, -50);
  tg.addColorStop(0, '#4a1626'); tg.addColorStop(.5, '#2a0d16'); tg.addColorStop(1, '#150609');
  ctx.fillStyle = tg; ctx.fill();
  ctx.strokeStyle = '#0d0407'; ctx.lineWidth = 2.4; ctx.stroke();
  ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.lineWidth = 3;
  for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.moveTo(-38 + i * 2, -70 - i * 16); ctx.lineTo(40 - i * 2, -74 - i * 16); ctx.stroke(); }
  const cr = 17 + Math.sin(t * 4) * 2.6;
  glowDot(ctx, 2, -100, 54, ['rgba(255,77,77,.5)', 'rgba(255,157,61,.5)', 'rgba(232,121,249,.5)'][b.phase]);
  ctx.fillStyle = core; ctx.shadowBlur = 30; ctx.shadowColor = core;
  ctx.beginPath(); ctx.arc(2, -100, cr, 0, TAU); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(2, -100, cr * .45, 0, TAU); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = core; ctx.lineWidth = 2; ctx.globalAlpha = .7;
  ctx.beginPath(); ctx.arc(2, -100, cr + 10 + Math.sin(t * 3) * 4, t, t + 2.2); ctx.stroke();
  ctx.beginPath(); ctx.arc(2, -100, cr + 16, -t, -t + 1.5); ctx.stroke(); ctx.globalAlpha = 1;

  /* hai cánh tay vuốt */
  let armA = -.35;
  if (b.state === 'tele') armA = lerp(-.35, -2.3, clamp(1 - b.stateT / b.stateMax, 0, 1));
  if (b.state === 'claw') armA = lerp(-2.3, .6, clamp(1 - b.stateT / b.stateMax, 0, 1));
  for (const s of [-1, 1]) {
    const a = s > 0 ? armA : armA * .35 - .2;
    const sx = s * 40, sy = -120;
    const ex = sx + Math.cos(a) * 46 * s, ey = sy + Math.sin(a) * 46 + 30;
    capsule(ctx, sx, sy, ex, ey, 12, s > 0 ? '#3a1220' : '#280c15', '#12060a');
    const fx = ex + Math.cos(a) * 30 * s, fy = ey + Math.sin(a) * 30 + 14;
    capsule(ctx, ex, ey, fx, fy, 9, s > 0 ? '#4a1626' : '#2f0f1a', '#12060a');
    ctx.fillStyle = '#efe6d4';
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath(); ctx.moveTo(fx, fy);
      ctx.lineTo(fx + s * (16 + i * 3), fy + 10 + i * 9);
      ctx.lineTo(fx + s * 6, fy + 8 + i * 6); ctx.fill();
    }
  }

  /* đầu rồng */
  const jaw = b.state === 'fire' ? clamp(1 - b.stateT / b.stateMax, 0, 1) * .55 : (b.state === 'roar' ? .6 : .06);
  ctx.save(); ctx.translate(6, -156);
  ctx.beginPath();                                                   // sọ
  ctx.moveTo(-26, 6); ctx.quadraticCurveTo(-24, -22, 0, -26);
  ctx.quadraticCurveTo(26, -26, 42, -8); ctx.quadraticCurveTo(50, -2, 44, 4);
  ctx.lineTo(6, 10); ctx.quadraticCurveTo(-14, 14, -26, 6); ctx.closePath();
  const hg = ctx.createLinearGradient(-26, -26, 44, 10);
  hg.addColorStop(0, '#54182b'); hg.addColorStop(1, '#1e0810');
  ctx.fillStyle = hg; ctx.fill(); ctx.strokeStyle = '#0d0407'; ctx.lineWidth = 2; ctx.stroke();
  ctx.save(); ctx.translate(-4, 8); ctx.rotate(jaw);                 // hàm dưới
  ctx.beginPath(); ctx.moveTo(0, -2); ctx.lineTo(46, -2); ctx.quadraticCurveTo(42, 12, 4, 10); ctx.closePath();
  ctx.fillStyle = '#2c0d17'; ctx.fill(); ctx.strokeStyle = '#0d0407'; ctx.stroke();
  ctx.fillStyle = '#efe6d4';
  for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.moveTo(6 + i * 7, -2); ctx.lineTo(9 + i * 7, -9); ctx.lineTo(12 + i * 7, -2); ctx.fill(); }
  ctx.restore();
  ctx.fillStyle = '#efe6d4';                                          // răng trên
  for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.moveTo(6 + i * 7, 7); ctx.lineTo(9 + i * 7, 15); ctx.lineTo(12 + i * 7, 7); ctx.fill(); }
  if (jaw > .2) { glowDot(ctx, 40, 6, 30 * jaw, 'rgba(255,140,40,.75)'); }
  const ec = b.invT > 0 ? '#ffffff' : core;                           // mắt
  ctx.fillStyle = ec; ctx.shadowBlur = 20; ctx.shadowColor = ec;
  ctx.beginPath(); ctx.moveTo(6, -8); ctx.lineTo(24, -12); ctx.lineTo(22, -2); ctx.closePath(); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#0b0409';
  ctx.beginPath(); ctx.moveTo(12, -8); ctx.lineTo(20, -10); ctx.lineTo(19, -4); ctx.closePath(); ctx.fill();
  const HC = '#c8bda6';                                                // vương miện sừng
  ctx.fillStyle = HC;
  const horns = [[-4, -26, -22, -74, -2, -44], [10, -28, 14, -80, 24, -46], [24, -22, 48, -60, 34, -34], [-18, -18, -48, -50, -26, -30]];
  for (const [x1, y1, x2, y2, x3, y3] of horns) {
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.quadraticCurveTo((x1 + x2) / 2 - 6, (y1 + y2) / 2, x2, y2);
    ctx.quadraticCurveTo(x3 + 4, (y2 + y3) / 2, x3, y3); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#6b6252'; ctx.lineWidth = 1.2; ctx.stroke();
  }
  ctx.restore();
  ctx.restore(); ctx.globalAlpha = 1;
}

/* ---------- 8.4 ĐẠN ---------- */
function drawShot(ctx, s) {
  const t = s.age;
  if (s.kind === 'bolt') {
    glowDot(ctx, s.x, s.y, 22, 'rgba(103,232,249,.6)');
    ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(Math.atan2(s.vy, s.vx));
    ctx.fillStyle = '#eaffff';
    ctx.beginPath(); ctx.moveTo(16, 0); ctx.lineTo(-8, -6); ctx.lineTo(-16, 0); ctx.lineTo(-8, 6); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#67e8f9'; ctx.lineWidth = 2; ctx.stroke(); ctx.restore();
  } else if (s.kind === 'orb') {
    glowDot(ctx, s.x, s.y, 24, 'rgba(232,121,249,.6)');
    ctx.fillStyle = '#1a0526'; ctx.beginPath(); ctx.arc(s.x, s.y, 8, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#f0abfc'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(s.x, s.y, 8 + Math.sin(t * 14) * 2, 0, TAU); ctx.stroke();
  } else if (s.kind === 'fire') {
    glowDot(ctx, s.x, s.y, 30, 'rgba(255,120,30,.7)');
    ctx.fillStyle = '#ffe08a'; ctx.beginPath(); ctx.arc(s.x, s.y, 7 + Math.sin(t * 24) * 1.6, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,90,20,.65)'; ctx.beginPath(); ctx.arc(s.x - s.vx * .012, s.y - s.vy * .012, 11, 0, TAU); ctx.fill();
  } else if (s.kind === 'shock') {
    ctx.save(); ctx.translate(s.x, s.y);
    ctx.fillStyle = 'rgba(255,150,60,.85)';
    ctx.beginPath(); ctx.moveTo(-16, 0); ctx.lineTo(-6, -26 - Math.sin(t * 22) * 5); ctx.lineTo(4, -8);
    ctx.lineTo(14, -30); ctx.lineTo(18, 0); ctx.closePath(); ctx.fill();
    ctx.restore();
  } else if (s.kind === 'arrow') {
    ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(Math.atan2(s.vy, s.vx));
    glowDot(ctx, 0, 0, 16, 'rgba(125,255,212,.55)');
    ctx.strokeStyle = 'rgba(125,255,212,.45)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-30, 0); ctx.lineTo(-12, 0); ctx.stroke();
    ctx.fillStyle = '#3f2f1c'; ctx.fillRect(-14, -1.2, 22, 2.4);
    ctx.fillStyle = '#d9f7ec';
    ctx.beginPath(); ctx.moveTo(16, 0); ctx.lineTo(6, -4.4); ctx.lineTo(8, 0); ctx.lineTo(6, 4.4); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#7dffd4';
    ctx.beginPath(); ctx.moveTo(-14, 0); ctx.lineTo(-21, -4); ctx.lineTo(-18, 0); ctx.lineTo(-21, 4); ctx.closePath(); ctx.fill();
    ctx.restore();
  } else if (s.kind === 'rock') {
    ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(t * 5);
    ctx.fillStyle = '#4a4034';
    ctx.beginPath(); ctx.moveTo(-13, -8); ctx.lineTo(4, -14); ctx.lineTo(14, 0); ctx.lineTo(2, 13); ctx.lineTo(-12, 7); ctx.closePath();
    ctx.fill(); ctx.strokeStyle = '#ff7a3c'; ctx.lineWidth = 1.6; ctx.stroke(); ctx.restore();
  }
}

/* ══════════════════════════════════════════════════════════════
   04-art-hero.js  —  Vẽ kiếm sĩ phong cách kiếm hiệp và khí thuẫn
   Nạp theo thứ tự trong index.html; các file dùng chung phạm vi toàn cục.

/* ═══ 8B. KIẾM SĨ PHONG CÁCH KIẾM HIỆP ═══ */
const HERO_PAL = {
  robe: '#eef3fa', robe2: '#b3c2d8', robe3: '#8b9bb5',
  trim: '#1d2b4c', inner: '#27365a',
  sash: '#c0392b', sash2: '#8c2018',
  gold: '#e3ba52', gold2: '#96762a',
  hair: '#12141e', hair2: '#262a3a',
  skin: '#f4d5b0', skin2: '#dcaf83',
  pants: '#1c2436', boot: '#2f394f'
};

function rrect(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
}

/* Ống tay áo rộng kiểu Hán phục: loe dần rồi rủ xuống */
function sleeve(ctx, x1, y1, x2, y2, r1, r2, droop, col1, col2) {
  const a = Math.atan2(y2 - y1, x2 - x1);
  const nx = -Math.sin(a), ny = Math.cos(a);
  const g = ctx.createLinearGradient(x1, y1 - r1, x2, y2 + r2);
  g.addColorStop(0, col1); g.addColorStop(1, col2);
  ctx.beginPath();
  ctx.moveTo(x1 + nx * r1, y1 + ny * r1);
  ctx.lineTo(x2 + nx * r2, y2 + ny * r2);
  ctx.quadraticCurveTo(x2 + nx * r2 * .6, y2 + ny * r2 + droop, x2 - nx * r2 * .9, y2 - ny * r2 + droop * .35);
  ctx.lineTo(x1 - nx * r1, y1 - ny * r1);
  ctx.closePath();
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = 'rgba(29,43,76,.55)'; ctx.lineWidth = 1.1; ctx.stroke();
  ctx.strokeStyle = HERO_PAL.trim; ctx.lineWidth = 2.2;      // viền cửa tay
  ctx.beginPath();
  ctx.moveTo(x2 + nx * r2, y2 + ny * r2);
  ctx.quadraticCurveTo(x2 + nx * r2 * .6, y2 + ny * r2 + droop, x2 - nx * r2 * .9, y2 - ny * r2 + droop * .35);
  ctx.stroke();
}

/* Kiếm thẳng (jian) — hộ thủ cánh chim, chuôi quấn dây, tua kiếm đỏ */
function drawJian(ctx, len, t, chi) {
  const g = ctx.createLinearGradient(0, -3.4, len, 3.4);
  g.addColorStop(0, '#b9cadd'); g.addColorStop(.42, '#ffffff'); g.addColorStop(1, '#a8e6f5');
  ctx.beginPath();
  ctx.moveTo(7, -3.3); ctx.lineTo(len - 13, -2.7); ctx.lineTo(len, 0);
  ctx.lineTo(len - 13, 2.7); ctx.lineTo(7, 3.3); ctx.closePath();
  ctx.fillStyle = g;
  ctx.shadowBlur = chi ? 20 : 9; ctx.shadowColor = chi ? 'rgba(140,240,255,.95)' : 'rgba(150,215,240,.7)';
  ctx.fill(); ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(60,100,132,.5)'; ctx.lineWidth = .9;   // sống kiếm
  ctx.beginPath(); ctx.moveTo(9, 0); ctx.lineTo(len - 7, 0); ctx.stroke();
  ctx.fillStyle = HERO_PAL.gold;                                  // hộ thủ
  ctx.beginPath();
  ctx.moveTo(3, -8); ctx.quadraticCurveTo(10, -6.5, 7.5, 0);
  ctx.quadraticCurveTo(10, 6.5, 3, 8); ctx.quadraticCurveTo(-.5, 0, 3, -8);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = HERO_PAL.gold2; ctx.lineWidth = .9; ctx.stroke();
  ctx.fillStyle = '#241610';                                      // chuôi
  rrect(ctx, -17, -3, 20, 6, 2); ctx.fill();
  ctx.strokeStyle = '#6d4c2c'; ctx.lineWidth = 1;
  for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.moveTo(-15.5 + i * 4.6, -3); ctx.lineTo(-12.5 + i * 4.6, 3); ctx.stroke(); }
  ctx.fillStyle = HERO_PAL.gold;                                  // đốc kiếm
  ctx.beginPath(); ctx.arc(-18, 0, 3.6, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#d0403f'; ctx.lineWidth = 1.7; ctx.lineCap = 'round';
  for (let i = -1; i <= 1; i++) {                                 // tua kiếm
    ctx.beginPath(); ctx.moveTo(-20, 0);
    ctx.quadraticCurveTo(-27 + Math.sin(t * 5 + i) * 3, 7 + i * 2.4, -30 + Math.sin(t * 4 + i) * 4.5, 16 + i * 3.2);
    ctx.stroke();
  }
  ctx.lineCap = 'butt';
}

function drawHero(ctx, p) {
  const t = p.animT;
  const run = p.onGround && Math.abs(p.vx) > 24;
  shadowBlob(ctx, p.x, p.y + 2, 20 - (p.onGround ? 0 : 6), p.onGround ? .4 : .18);
  if (ASSETS.enabled && drawSheet(ctx, run ? 'hero_run' : 'hero_idle', p.x, p.y, p.face, t)) return;

  const P = HERO_PAL;
  const bob = run ? Math.abs(Math.sin(t * 12)) * 2.6 : Math.sin(t * 2) * 1.6;
  const HIP = -32, SASH = -36, CHEST = -48, SHO = -53, NECK = -60, HD = -70;
  const flow = Math.sin(t * 3.6) * 2.4 + clamp(-p.vx * .022, -9, 9);   // vải bay theo gió

  ctx.save();
  ctx.translate(p.x, p.y - bob);
  ctx.scale(p.face, 1);
  if (p.hurtT > 0) ctx.globalAlpha = .45 + Math.abs(Math.sin(p.hurtT * 40)) * .55;
  if (p.energy >= 100) glowDot(ctx, 0, -36, 56, 'rgba(251,191,36,.20)');

  /* ── 1. tóc dài & dải khăn bay phía sau ── */
  ctx.strokeStyle = P.hair; ctx.lineWidth = 7; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-4, HD + 4);
  ctx.quadraticCurveTo(-16 - flow, HD + 16, -20 - flow * 1.4, CHEST + 4); ctx.stroke();
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(-4, HD + 6);
  ctx.quadraticCurveTo(-20 - flow, HD + 22, -26 - flow * 1.6, CHEST + 12); ctx.stroke();
  ctx.strokeStyle = 'rgba(200,60,60,.9)'; ctx.lineWidth = 2.6;
  for (const o of [0, 5]) {
    ctx.beginPath(); ctx.moveTo(-7, HD - 3 + o * .3);
    ctx.quadraticCurveTo(-22 - flow, HD + 4 + o + Math.sin(t * 6) * 4, -36 - flow * 1.8, HD + 18 + o + Math.sin(t * 5) * 6);
    ctx.stroke();
  }
  ctx.lineCap = 'butt';

  /* ── 2. bao kiếm đeo hông sau ── */
  ctx.save(); ctx.translate(-8, HIP - 2); ctx.rotate(.42);
  ctx.fillStyle = '#1a2233'; rrect(ctx, -30, -4, 42, 8, 4); ctx.fill();
  ctx.strokeStyle = '#0c111c'; ctx.lineWidth = 1.2; ctx.stroke();
  ctx.fillStyle = P.gold2; ctx.fillRect(4, -4.5, 5, 9); ctx.fillRect(-22, -4.5, 4, 9);
  ctx.restore();

  /* ── 3. tay sau (ống tay rộng) ── */
  const ba = run ? -.9 + Math.sin(t * 12) * .75 : -1.75 + Math.sin(t * 2) * .07;
  const bex = -5 + Math.cos(ba) * 11, bey = SHO + 5 + Math.sin(ba) * 11;
  const bhx = -5 + Math.cos(ba) * 21, bhy = SHO + 5 + Math.sin(ba) * 21;
  sleeve(ctx, -5, SHO + 3, bex, bey, 6.5, 8.5, 5, P.robe3, P.robe2);
  capsule(ctx, bex, bey, bhx, bhy, 3.4, P.skin2);
  if (!run) {                                       // thế "kiếm quyết" hai ngón chỉ thiên
    ctx.fillStyle = P.skin2;
    ctx.beginPath(); ctx.ellipse(bhx, bhy, 4.4, 4, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = P.skin;
    rrect(ctx, bhx - 3.4, bhy - 11, 2.9, 11, 1.4); ctx.fill();
    rrect(ctx, bhx + .3, bhy - 12.5, 2.9, 12.5, 1.4); ctx.fill();
  } else { ctx.fillStyle = P.skin2; ctx.beginPath(); ctx.arc(bhx, bhy, 4.2, 0, TAU); ctx.fill(); }

  /* ── 4. chân + giày ── */
  let f1x = 0, f1y = 0, f2x = 0, f2y = 0;
  if (run) {
    const ph = t * 12;
    f1x = Math.sin(ph) * 12; f1y = -Math.max(0, Math.sin(ph)) * 8;
    f2x = Math.sin(ph + Math.PI) * 12; f2y = -Math.max(0, Math.sin(ph + Math.PI)) * 8;
  } else if (!p.onGround) { f1x = 8; f1y = -9; f2x = -7; f2y = -3; }
  capsule(ctx, -3, HIP + 4, -3 + f2x, f2y - 4, 4.4, P.pants);
  ctx.fillStyle = '#232b3d'; rrect(ctx, -3 + f2x - 6, f2y - 5, 13, 5.5, 2); ctx.fill();
  capsule(ctx, 3, HIP + 4, 3 + f1x, f1y - 4, 4.8, P.pants);
  ctx.fillStyle = P.boot; rrect(ctx, 3 + f1x - 6, f1y - 5, 14, 5.5, 2); ctx.fill();
  ctx.fillStyle = P.gold2; ctx.fillRect(3 + f1x - 5, f1y - 5.5, 12, 1.6);

  /* ── 5. vạt áo dưới (xẻ tà, bay theo gió) ── */
  const skirtG = ctx.createLinearGradient(0, HIP - 6, 0, -2);
  skirtG.addColorStop(0, P.robe); skirtG.addColorStop(1, P.robe2);
  ctx.beginPath();
  ctx.moveTo(-12, HIP - 6); ctx.lineTo(12, HIP - 6);
  ctx.quadraticCurveTo(17, HIP + 12, 15 + flow * .7, -6);
  ctx.quadraticCurveTo(7, -11, 1, -7);
  ctx.quadraticCurveTo(-7, -12, -16 - flow, -5);
  ctx.quadraticCurveTo(-17, HIP + 12, -12, HIP - 6);
  ctx.closePath(); ctx.fillStyle = skirtG; ctx.fill();
  ctx.strokeStyle = 'rgba(29,43,76,.4)'; ctx.lineWidth = 1.1; ctx.stroke();
  ctx.strokeStyle = P.trim; ctx.lineWidth = 2.4;             // viền gấu áo
  ctx.beginPath(); ctx.moveTo(15 + flow * .7, -6);
  ctx.quadraticCurveTo(7, -11, 1, -7); ctx.quadraticCurveTo(-7, -12, -16 - flow, -5); ctx.stroke();

  /* ── 6. thân áo + cổ giao lĩnh ── */
  const bodyG = ctx.createLinearGradient(-12, SHO, 13, SASH);
  bodyG.addColorStop(0, P.robe2); bodyG.addColorStop(.45, P.robe); bodyG.addColorStop(1, P.robe2);
  ctx.beginPath();
  ctx.moveTo(-12, SHO + 1); ctx.quadraticCurveTo(0, SHO - 3, 12, SHO + 1);
  ctx.lineTo(13, SASH + 2); ctx.lineTo(-13, SASH + 2); ctx.closePath();
  ctx.fillStyle = bodyG; ctx.fill();
  ctx.strokeStyle = 'rgba(29,43,76,.45)'; ctx.lineWidth = 1.1; ctx.stroke();
  ctx.fillStyle = P.inner;                                    // áo lót trong
  ctx.beginPath(); ctx.moveTo(-7, NECK + 2); ctx.lineTo(7, NECK + 2);
  ctx.lineTo(3, CHEST + 8); ctx.lineTo(-4, CHEST + 6); ctx.closePath(); ctx.fill();
  ctx.beginPath();                                            // vạt phải đè lên vạt trái
  ctx.moveTo(-9, NECK + 1); ctx.lineTo(3, NECK + 4);
  ctx.lineTo(11, SASH + 2); ctx.lineTo(-13, SASH + 2); ctx.closePath();
  ctx.fillStyle = P.robe; ctx.fill();
  ctx.strokeStyle = P.trim; ctx.lineWidth = 2.6;
  ctx.beginPath(); ctx.moveTo(-9, NECK + 1); ctx.lineTo(3, NECK + 4); ctx.lineTo(11, SASH + 1); ctx.stroke();

  /* ── 7. đai lưng đỏ + ngọc bội ── */
  ctx.fillStyle = P.sash; rrect(ctx, -13, SASH, 26, 7, 2); ctx.fill();
  ctx.fillStyle = P.sash2; ctx.fillRect(-13, SASH + 5, 26, 2);
  ctx.fillStyle = P.gold; rrect(ctx, -3, SASH - .5, 8, 8, 2); ctx.fill();
  ctx.fillStyle = '#7fe3d2'; ctx.beginPath(); ctx.arc(1, SASH + 3.5, 2.2, 0, TAU); ctx.fill();
  ctx.strokeStyle = P.sash; ctx.lineWidth = 3; ctx.lineCap = 'round';   // dải đai rủ
  ctx.beginPath(); ctx.moveTo(-9, SASH + 6);
  ctx.quadraticCurveTo(-13 - flow * .5, HIP + 14, -11 - flow, HIP + 26); ctx.stroke();
  ctx.lineCap = 'butt';

  /* ── 8. đầu: tóc, mặt nghiêng, búi tóc, trâm cài ── */
  ctx.fillStyle = P.hair;                                       // khối tóc sau
  ctx.beginPath(); ctx.ellipse(-2, HD + 1, 9.5, 10, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = P.skin;                                       // mặt nhìn nghiêng
  ctx.beginPath();
  ctx.moveTo(-5, HD - 8);
  ctx.quadraticCurveTo(7, HD - 9.5, 8.6, HD - 1);
  ctx.quadraticCurveTo(10.4, HD + 1.6, 7.4, HD + 3.4);
  ctx.quadraticCurveTo(8.6, HD + 6.4, 4.6, HD + 8.6);
  ctx.quadraticCurveTo(-1, HD + 11, -5, HD + 6);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = P.skin2;
  ctx.beginPath(); ctx.ellipse(2, HD + 6.6, 3.4, 1.6, .12, 0, TAU); ctx.fill();
  ctx.fillStyle = P.hair;                                       // tóc mái
  ctx.beginPath();
  ctx.moveTo(-7, HD - 2); ctx.quadraticCurveTo(-6, HD - 12, 3, HD - 11);
  ctx.quadraticCurveTo(9, HD - 10, 8.8, HD - 3.6);
  ctx.quadraticCurveTo(5, HD - 7.4, 0, HD - 6);
  ctx.quadraticCurveTo(-3, HD - 4.4, -4, HD + 1);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#2b2016'; ctx.lineWidth = 1.6;             // lông mày cương nghị
  ctx.beginPath(); ctx.moveTo(1.4, HD - 3.4); ctx.lineTo(7, HD - 2); ctx.stroke();
  ctx.fillStyle = '#141821';                                    // mắt
  ctx.beginPath(); ctx.moveTo(2.4, HD + .4); ctx.quadraticCurveTo(5, HD - 1.4, 7.4, HD + .6);
  ctx.quadraticCurveTo(5, HD + 2, 2.4, HD + .4); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#8fe9ff'; ctx.beginPath(); ctx.arc(5.4, HD + .4, 1.1, 0, TAU); ctx.fill();
  ctx.fillStyle = P.hair;                                       // búi tóc
  ctx.beginPath(); ctx.ellipse(-1, HD - 12, 6, 5, -.2, 0, TAU); ctx.fill();
  ctx.strokeStyle = P.gold; ctx.lineWidth = 2;                  // trâm cài
  ctx.beginPath(); ctx.moveTo(-8, HD - 14); ctx.lineTo(6, HD - 10); ctx.stroke();
  ctx.fillStyle = P.gold; ctx.beginPath(); ctx.arc(6.6, HD - 9.8, 2.1, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 2.6;             // khăn trán
  ctx.beginPath(); ctx.moveTo(-8, HD - 5); ctx.quadraticCurveTo(0, HD - 8, 8.6, HD - 4.4); ctx.stroke();

  /* ── 9. TAY TRƯỚC CẦM KIẾM (vai → khuỷu → bàn tay → chuôi) ── */
  let ang = -.2 + Math.sin(t * 2) * .06;
  let chi = false;
  if (p.atkT > 0) {
    const u = 1 - p.atkT / p.atkDur;
    const seq = [[-2.15, .95], [1.05, -2.05], [-2.45, 1.35]][p.combo % 3];
    const e = u < .5 ? Math.pow(u / .5, .5) : 1;
    ang = lerp(seq[0], seq[1], e);
    chi = true;
    const a0 = seq[0], r0 = 30, r1 = 78;                        // kiếm khí hình lưỡi liềm
    const gr = ctx.createRadialGradient(5, SHO + 5, r0, 5, SHO + 5, r1);
    gr.addColorStop(0, 'rgba(140,240,255,0)');
    gr.addColorStop(.55, 'rgba(190,250,255,' + (.6 * (1 - u)) + ')');
    gr.addColorStop(.9, 'rgba(255,255,255,' + (.35 * (1 - u)) + ')');
    gr.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = gr;
    ctx.beginPath();
    ctx.arc(5, SHO + 5, r1, Math.min(a0, ang), Math.max(a0, ang));
    ctx.arc(5, SHO + 5, r0, Math.max(a0, ang), Math.min(a0, ang), true);
    ctx.closePath(); ctx.fill();
  } else if (p.magicT > 0) { ang = -1.05; chi = true; }

  const sx0 = 5, sy0 = SHO + 3, armLen = 25;
  const hx = sx0 + Math.cos(ang) * armLen, hy = sy0 + Math.sin(ang) * armLen;
  const mx = (sx0 + hx) / 2, my = (sy0 + hy) / 2;
  const nlx = -(hy - sy0), nly = hx - sx0, nl = Math.hypot(nlx, nly) || 1;
  const ex = mx + (nlx / nl) * 4.5, ey = my + (nly / nl) * 4.5 + 2.5;
  sleeve(ctx, sx0, sy0, ex, ey, 7, 9, 6, P.robe, P.robe2);      // ống tay áo
  capsule(ctx, ex, ey, hx, hy, 3.6, P.skin, 'rgba(150,110,80,.45)');  // cẳng tay trần

  ctx.save(); ctx.translate(hx, hy); ctx.rotate(ang);
  ctx.fillStyle = P.skin2;                                       // lòng bàn tay (sau chuôi)
  ctx.beginPath(); ctx.ellipse(-6, .5, 7, 5.8, 0, 0, TAU); ctx.fill();
  drawJian(ctx, 52, t, chi);
  ctx.fillStyle = P.skin;                                        // 4 ngón nắm ngang chuôi
  for (let i = 0; i < 4; i++) { rrect(ctx, -13.5 + i * 3.7, -5.6, 3.1, 11.2, 1.5); ctx.fill(); }
  ctx.strokeStyle = 'rgba(150,110,80,.5)'; ctx.lineWidth = .8;
  for (let i = 0; i < 4; i++) { rrect(ctx, -13.5 + i * 3.7, -5.6, 3.1, 11.2, 1.5); ctx.stroke(); }
  ctx.fillStyle = P.skin2;                                       // ngón cái vắt qua
  ctx.beginPath(); ctx.ellipse(-7, 4.2, 5, 2.7, -.35, 0, TAU); ctx.fill();
  ctx.restore();

  ctx.restore();
  ctx.globalAlpha = 1;
}

/* ── Khí thuẫn bát quái: chắn trước mặt, nứt dần khi sắp vỡ ── */
function drawShield(ctx, p) {
  const t = p.animT;
  const perfect = p.parryT > 0;
  const ratio = clamp(p.sh / p.maxSh, 0, 1);
  const R = 30, cx = p.x + p.face * 24, cy = p.y - 34;
  const col = perfect ? '#ffffff' : ratio > .35 ? '#8fd8ff' : '#ff9d6b';
  const glow = perfect ? 'rgba(255,255,255,.75)' : ratio > .35 ? 'rgba(120,200,255,.5)' : 'rgba(255,140,80,.55)';

  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(p.face, 1);
  const pop = perfect ? 1.35 : 1;
  ctx.scale(pop, pop);
  glowDot(ctx, 0, 0, R * 1.9, glow);

  const g = ctx.createLinearGradient(-R, -R, R, R);      // mặt khiên bát giác
  g.addColorStop(0, 'rgba(150,220,255,.30)');
  g.addColorStop(.5, 'rgba(90,170,235,.16)');
  g.addColorStop(1, 'rgba(150,220,255,.30)');
  ctx.beginPath();
  for (let i = 0; i < 8; i++) {
    const a = i * TAU / 8 - Math.PI / 8;
    const rr = R * (i % 2 ? .92 : 1) * (1 + Math.sin(t * 6 + i) * .015);
    i ? ctx.lineTo(Math.cos(a) * rr * .62, Math.sin(a) * rr) : ctx.moveTo(Math.cos(a) * rr * .62, Math.sin(a) * rr);
  }
  ctx.closePath();
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = col; ctx.lineWidth = perfect ? 3.4 : 2; ctx.stroke();

  ctx.save(); ctx.rotate(t * 1.3);                        // vòng rune xoay
  ctx.strokeStyle = col; ctx.globalAlpha = .55; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.ellipse(0, 0, R * .4, R * .66, 0, 0, TAU); ctx.stroke();
  for (let i = 0; i < 6; i++) {
    const a = i * TAU / 6;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * R * .26, Math.sin(a) * R * .42);
    ctx.lineTo(Math.cos(a) * R * .46, Math.sin(a) * R * .74);
    ctx.stroke();
  }
  ctx.restore();

  if (ratio < .55) {                                      // vết nứt khi khiên yếu
    ctx.globalAlpha = (1 - ratio / .55) * .85;
    ctx.strokeStyle = '#ffd8b0'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-4, -R * .8); ctx.lineTo(3, -R * .2); ctx.lineTo(-5, R * .3); ctx.lineTo(2, R * .8); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-12, -R * .3); ctx.lineTo(0, 0); ctx.lineTo(12, R * .25); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  if (perfect) {                                          // chớp sáng khi đỡ hoàn hảo
    ctx.save(); ctx.globalAlpha = p.parryT / .35;
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(cx, cy, R * (1 + (1 - p.parryT / .35) * 1.6), 0, TAU); ctx.stroke();
    ctx.restore();
  }
}
