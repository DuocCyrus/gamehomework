/* ═══ 8F. QUÁI — mỗi con một bản sắc riêng ═══ */

/* ── Nhớt Độc: bọc nhớt độc đã nuốt chửng một cái sọ ── */
function drawSlime(ctx, e) {
  const t = e.animT, sq = e.onGround ? 1 + Math.sin(t * 8) * .1 : .82;
  shadowBlob(ctx, e.x, e.y + 2, 22);
  ctx.save(); ctx.translate(e.x, e.y);
  if (e.hurtT > 0) ctx.globalAlpha = .55 + Math.abs(Math.sin(e.hurtT * 40)) * .45;
  const w = 25 * (2 - sq), h = 21 * sq;

  for (let i = 0; i < 3; i++) {                       // hơi độc bốc lên
    const a = t * 1.6 + i * 2.1;
    ctx.fillStyle = 'rgba(120,220,140,' + (.05 + Math.abs(Math.sin(a)) * .07) + ')';
    ctx.beginPath(); ctx.arc(Math.sin(a) * 12, -h * 2.4 - (t * 12 + i * 9) % 22, 7 + i * 2, 0, TAU); ctx.fill();
  }
  const g = ctx.createRadialGradient(-7, -h * 1.4, 2, 0, -h * .6, w * 1.5);
  g.addColorStop(0, 'rgba(205,255,190,.95)'); g.addColorStop(.5, 'rgba(94,214,120,.82)');
  g.addColorStop(1, 'rgba(16,72,46,.92)');
  ctx.beginPath();
  ctx.moveTo(-w, 0);
  ctx.bezierCurveTo(-w, -h * 2.1, w, -h * 2.1, w, 0);
  ctx.quadraticCurveTo(w * .5, 5, 0, 4); ctx.quadraticCurveTo(-w * .5, 5, -w, 0);
  ctx.closePath(); ctx.fillStyle = g; ctx.fill();

  ctx.save(); ctx.clip();                              // sọ người bị nuốt bên trong
  ctx.globalAlpha = .5; ctx.fillStyle = '#e8e2d0';
  ctx.beginPath(); ctx.ellipse(1, -h * .95 + Math.sin(t * 1.7) * 2, 8, 7.4, Math.sin(t) * .18, 0, TAU); ctx.fill();
  ctx.fillRect(-3, -h * .95 + 5, 9, 5);
  ctx.globalAlpha = .8; ctx.fillStyle = '#12331f';
  ctx.beginPath(); ctx.arc(-2, -h * .98, 2.1, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(4, -h * .98, 2.1, 0, TAU); ctx.fill();
  ctx.globalAlpha = .45; ctx.fillStyle = '#a8f0c0';    // bọt khí
  for (let i = 0; i < 5; i++) {
    const bx = Math.sin(t * 1.3 + i * 2) * (w * .55);
    const by = -((t * 16 + i * 13) % (h * 1.9));
    ctx.beginPath(); ctx.arc(bx, by, 1.6 + (i % 3), 0, TAU); ctx.fill();
  }
  ctx.restore();

  ctx.strokeStyle = 'rgba(24,102,66,.95)'; ctx.lineWidth = 1.8; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.5)';
  ctx.beginPath(); ctx.ellipse(-9, -h * 1.3, 5.4, 3.4, -.5, 0, TAU); ctx.fill();
  for (let i = -1; i <= 1; i += 2) {                   // nhớt nhỏ giọt
    const d = (t * 30 + (i + 1) * 17) % 26;
    ctx.fillStyle = 'rgba(94,214,120,.75)';
    ctx.beginPath(); ctx.ellipse(i * w * .55, d * .35, 2.4, 3.6 + d * .1, 0, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = '#04140c';
  ctx.beginPath(); ctx.ellipse(-7 * e.face, -h * 1.5, 3.6, 4.4, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(6 * e.face, -h * 1.5, 3.1, 3.9, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#eaffef';
  ctx.beginPath(); ctx.arc(-7 * e.face + e.face, -h * 1.6, 1.2, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(6 * e.face + e.face, -h * 1.6, 1.1, 0, TAU); ctx.fill();
  ctx.restore(); ctx.globalAlpha = 1;
}

/* ── Oán Linh: hồn ma đeo mặt nạ sứ nứt, thân tan thành khói, xích gãy ── */
function drawWraith(ctx, e) {
  const t = e.animT, hot = e.charge > 0;
  ctx.save(); ctx.translate(e.x, e.y - 24);
  if (e.hurtT > 0) ctx.globalAlpha = .5 + Math.abs(Math.sin(e.hurtT * 40)) * .5;
  ctx.scale(e.face, 1);
  glowDot(ctx, 0, 0, 40, hot ? 'rgba(255,70,70,.42)' : 'rgba(150,130,235,.26)');

  ctx.strokeStyle = 'rgba(120,110,150,.55)'; ctx.lineWidth = 2;   // xích gãy lơ lửng
  for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(s * 12, 4);
    ctx.quadraticCurveTo(s * 26, 12 + Math.sin(t * 3 + s) * 5, s * 22, 26 + Math.sin(t * 2 + s) * 6);
    ctx.stroke();
    ctx.fillStyle = 'rgba(140,130,170,.6)';
    for (let i = 1; i <= 3; i++) {
      const u = i / 4;
      ctx.beginPath(); ctx.ellipse(s * lerp(12, 22, u), lerp(4, 26, u) + Math.sin(t * 3 + i) * 3, 2.6, 1.8, 0, 0, TAU); ctx.fill();
    }
  }
  const bg = ctx.createLinearGradient(0, -26, 0, 34);              // áo liệm rách tan thành khói
  bg.addColorStop(0, hot ? '#5a2440' : '#33285e');
  bg.addColorStop(.55, hot ? '#3a1428' : '#1f1840');
  bg.addColorStop(1, 'rgba(12,8,26,0)');
  ctx.beginPath();
  ctx.moveTo(-15, -6); ctx.quadraticCurveTo(0, -30, 15, -6);
  ctx.quadraticCurveTo(19, 12, 12 + Math.sin(t * 5) * 4, 34);
  ctx.quadraticCurveTo(6, 20, 2 + Math.sin(t * 5 + 1.5) * 4, 36);
  ctx.quadraticCurveTo(-3, 18, -9 + Math.sin(t * 5 + 3) * 4, 32);
  ctx.quadraticCurveTo(-14, 12, -15, -6); ctx.closePath();
  ctx.fillStyle = bg; ctx.fill();
  ctx.strokeStyle = hot ? 'rgba(255,110,110,.5)' : 'rgba(167,139,250,.45)'; ctx.lineWidth = 1.2; ctx.stroke();

  for (const s of [-1, 1]) {                                       // tay vuốt dài
    const a = hot ? -.9 : -.35 + Math.sin(t * 2.4 + s) * .22;
    const ex = s * 16 + Math.cos(a) * s * 12, ey = 2 + Math.sin(a) * 12;
    capsule(ctx, s * 11, 0, ex, ey, 3, 'rgba(58,46,96,.9)');
    ctx.strokeStyle = '#cfc6ea'; ctx.lineWidth = 1.4;
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath(); ctx.moveTo(ex, ey);
      ctx.quadraticCurveTo(ex + s * 5, ey + 7 + i * 2, ex + s * (3 + i * 3), ey + 14); ctx.stroke();
    }
  }
  ctx.fillStyle = '#efe9dd';                                       // mặt nạ sứ
  ctx.beginPath();
  ctx.moveTo(-9, -14); ctx.quadraticCurveTo(0, -22, 9, -14);
  ctx.quadraticCurveTo(10, -2, 0, 4); ctx.quadraticCurveTo(-10, -2, -9, -14); ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#9a917f'; ctx.lineWidth = 1; ctx.stroke();
  ctx.strokeStyle = 'rgba(60,54,44,.85)'; ctx.lineWidth = 1;       // vết nứt
  ctx.beginPath(); ctx.moveTo(4, -20); ctx.lineTo(1, -12); ctx.lineTo(5, -6); ctx.lineTo(2, 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-7, -10); ctx.lineTo(-3, -7); ctx.stroke();
  const ec = hot ? '#ff5555' : '#b9a7ff';
  ctx.fillStyle = ec; ctx.shadowBlur = 14; ctx.shadowColor = ec;
  ctx.beginPath(); ctx.ellipse(-4, -12, 2.4, 1.7, .2, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(4.5, -12, 2.4, 1.7, -.2, 0, TAU); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(60,54,44,.7)'; ctx.lineWidth = 1.1;      // miệng khâu
  ctx.beginPath(); ctx.moveTo(-4, -3); ctx.lineTo(4, -3); ctx.stroke();
  for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.moveTo(i * 3, -5); ctx.lineTo(i * 3, -1); ctx.stroke(); }
  ctx.restore(); ctx.globalAlpha = 1;
}

/* ── Cốt Kiếm Sĩ: bộ xương mặc giáp rỉ, mũ trụ có chỏm, cờ trận rách sau lưng ── */
function drawSkeleton(ctx, e) {
  const t = e.animT, walk = e.state === 'walk' ? Math.sin(t * 8) : 0;
  shadowBlob(ctx, e.x, e.y + 2, 21);
  ctx.save(); ctx.translate(e.x, e.y); ctx.scale(e.face, 1);
  if (e.hurtT > 0) ctx.globalAlpha = .5 + Math.abs(Math.sin(e.hurtT * 40)) * .5;
  const BONE = '#ded7c4', BONE2 = '#a79e88', RUST = '#6b4a35', RUST2 = '#3f2b1f', FIRE = '#7dffb0';
  const HIP = -27, SHO = -47, HEAD = -58;

  ctx.save(); ctx.translate(-12, SHO - 4); ctx.rotate(-.3);        // cờ trận rách
  ctx.strokeStyle = '#2f2117'; ctx.lineWidth = 2.6;
  ctx.beginPath(); ctx.moveTo(0, 14); ctx.lineTo(-2, -26); ctx.stroke();
  ctx.fillStyle = 'rgba(120,40,40,.75)';
  ctx.beginPath(); ctx.moveTo(-2, -24);
  ctx.lineTo(-18 - Math.sin(t * 2.6) * 4, -20); ctx.lineTo(-13, -12);
  ctx.lineTo(-19 - Math.sin(t * 2.6 + 1) * 4, -6); ctx.lineTo(-2, -4); ctx.closePath(); ctx.fill();
  ctx.restore();

  capsule(ctx, -3, HIP, -3 + walk * 9, 0, 3.6, BONE2);
  capsule(ctx, 3, HIP, 3 - walk * 9, 0, 3.9, BONE);
  ctx.strokeStyle = BONE; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(0, HIP); ctx.lineTo(0, SHO); ctx.stroke();
  ctx.lineWidth = 2.5;
  for (let i = 0; i < 4; i++) {
    const y = SHO + 5 + i * 5;
    ctx.beginPath(); ctx.moveTo(-1, y); ctx.quadraticCurveTo(-8 - i, y + 3, -6 - i, y + 6); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(1, y); ctx.quadraticCurveTo(8 + i, y + 3, 6 + i, y + 6); ctx.stroke();
  }
  ctx.save(); ctx.rotate(-.5);                                     // cán giáo gãy xuyên ngực
  ctx.fillStyle = '#4a3524'; ctx.fillRect(-16, SHO + 8, 30, 3.4);
  ctx.fillStyle = '#8d9aa3';
  ctx.beginPath(); ctx.moveTo(14, SHO + 6); ctx.lineTo(24, SHO + 9.7); ctx.lineTo(14, SHO + 13); ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.fillStyle = RUST; ctx.beginPath();                            // giáp vai
  ctx.ellipse(-6, SHO + 1, 8, 6, .25, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(7, SHO + 1, 8.5, 6.4, -.25, 0, TAU); ctx.fill();
  ctx.strokeStyle = RUST2; ctx.lineWidth = 1.4; ctx.stroke();

  const shX = -13, shY = SHO + 13;                                  // khiên gỗ bọc sắt
  ctx.fillStyle = '#4a3524'; ctx.beginPath(); ctx.arc(shX, shY, 13, 0, TAU); ctx.fill();
  ctx.strokeStyle = RUST; ctx.lineWidth = 3; ctx.stroke();
  ctx.strokeStyle = '#8a6b47'; ctx.lineWidth = 1.4;
  for (let i = 0; i < 4; i++) { const a = i * Math.PI / 4; ctx.beginPath(); ctx.moveTo(shX - Math.cos(a) * 12, shY - Math.sin(a) * 12); ctx.lineTo(shX + Math.cos(a) * 12, shY + Math.sin(a) * 12); ctx.stroke(); }
  ctx.fillStyle = RUST2; ctx.beginPath(); ctx.arc(shX, shY, 4.4, 0, TAU); ctx.fill();

  let sa = -.4;
  if (e.state === 'wind') sa = lerp(-.4, -2.2, 1 - e.stateT / .5);
  if (e.state === 'swing') sa = lerp(-2.2, .9, 1 - e.stateT / .22);
  const hx = 6 + Math.cos(sa) * 13, hy = SHO + 8 + Math.sin(sa) * 13;
  capsule(ctx, 6, SHO + 4, hx, hy, 3.4, BONE);
  ctx.save(); ctx.translate(hx, hy); ctx.rotate(sa);
  ctx.fillStyle = '#2f2117'; ctx.fillRect(-10, -2.2, 12, 4.4);
  ctx.fillStyle = RUST; ctx.fillRect(1, -6, 3.4, 12);
  const bg2 = ctx.createLinearGradient(0, -3, 36, 3);
  bg2.addColorStop(0, '#9aa6ad'); bg2.addColorStop(.6, '#c3ccd2'); bg2.addColorStop(1, '#6a767c');
  ctx.beginPath(); ctx.moveTo(4, -3.4); ctx.lineTo(32, -2); ctx.lineTo(38, 0);
  ctx.lineTo(32, 2); ctx.lineTo(4, 3.4); ctx.closePath(); ctx.fillStyle = bg2; ctx.fill();
  ctx.fillStyle = 'rgba(120,80,50,.5)';                             // vết rỉ
  ctx.fillRect(12, -2, 5, 4); ctx.fillRect(24, -1.4, 4, 2.8);
  ctx.restore();

  ctx.fillStyle = BONE;                                             // sọ
  ctx.beginPath(); ctx.ellipse(1, HEAD, 8.6, 8, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-4, HEAD + 6); ctx.lineTo(7, HEAD + 6);
  ctx.lineTo(6, HEAD + 12); ctx.lineTo(-3, HEAD + 12); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = BONE2; ctx.lineWidth = 1;
  for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(-3 + i * 3.5, HEAD + 6); ctx.lineTo(-3 + i * 3.5, HEAD + 12); ctx.stroke(); }
  ctx.fillStyle = RUST;                                             // mũ trụ + chỏm lông
  ctx.beginPath();
  ctx.moveTo(-10, HEAD - 1); ctx.quadraticCurveTo(0, HEAD - 14, 10, HEAD - 1);
  ctx.lineTo(11, HEAD + 2); ctx.quadraticCurveTo(0, HEAD - 8, -11, HEAD + 2); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = RUST2; ctx.lineWidth = 1.3; ctx.stroke();
  ctx.fillStyle = '#7d2b2b';
  ctx.beginPath(); ctx.moveTo(-1, HEAD - 11);
  ctx.quadraticCurveTo(-6, HEAD - 22, -12 - Math.sin(t * 3) * 3, HEAD - 20);
  ctx.quadraticCurveTo(-6, HEAD - 16, 2, HEAD - 9); ctx.closePath(); ctx.fill();
  ctx.fillStyle = e.state === 'wind' ? '#c9ffe0' : FIRE;            // hồn lửa trong hốc mắt
  ctx.shadowBlur = 12; ctx.shadowColor = FIRE;
  ctx.beginPath(); ctx.ellipse(-2.5, HEAD, 2.6, 3, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(5, HEAD, 2.6, 3, 0, 0, TAU); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.restore(); ctx.globalAlpha = 1;
}

/* ── Tà Đạo Sĩ: đạo bào, mũ đạo, bùa vàng bay quanh, gương bát quái ── */
function drawMage(ctx, e) {
  const t = e.animT, bob = Math.sin(t * 2.4) * 4, casting = e.state === 'cast';
  shadowBlob(ctx, e.x, e.y + 2, 18, .22);
  ctx.save(); ctx.translate(e.x, e.y - 14 + bob); ctx.scale(e.face, 1);
  if (e.hurtT > 0) ctx.globalAlpha = .5 + Math.abs(Math.sin(e.hurtT * 40)) * .5;
  glowDot(ctx, 0, -22, 44, casting ? 'rgba(255,190,60,.3)' : 'rgba(232,121,249,.16)');

  for (let i = 0; i < 4; i++) {                                     // bùa giấy bay quanh
    const a = t * 1.5 + i * TAU / 4;
    const px = Math.cos(a) * 30, py = -26 + Math.sin(a) * 12;
    ctx.save(); ctx.translate(px, py); ctx.rotate(Math.sin(a * 2) * .5);
    ctx.fillStyle = '#e6c86a'; ctx.fillRect(-4, -9, 8, 18);
    ctx.strokeStyle = '#b8202a'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, -6); ctx.lineTo(0, 6); ctx.moveTo(-2.4, -3); ctx.lineTo(2.4, -3);
    ctx.moveTo(-2.4, 2); ctx.lineTo(2.4, 2); ctx.stroke();
    ctx.restore();
  }
  ctx.beginPath();                                                  // đạo bào
  ctx.moveTo(-14, -34); ctx.quadraticCurveTo(0, -48, 14, -34);
  ctx.quadraticCurveTo(19, -8, 16 + Math.sin(t * 3) * 3, 6);
  ctx.quadraticCurveTo(0, 0, -16 + Math.sin(t * 3 + 1) * 3, 6);
  ctx.quadraticCurveTo(-19, -8, -14, -34); ctx.closePath();
  const rg = ctx.createLinearGradient(0, -48, 0, 8);
  rg.addColorStop(0, '#2f2a55'); rg.addColorStop(.55, '#1b1636'); rg.addColorStop(1, '#0b0818');
  ctx.fillStyle = rg; ctx.fill();
  ctx.strokeStyle = '#e6c86a'; ctx.lineWidth = 1.8;                 // viền vàng đạo bào
  ctx.beginPath(); ctx.moveTo(-9, -38); ctx.lineTo(2, -34); ctx.lineTo(9, -8); ctx.stroke();
  ctx.strokeStyle = 'rgba(232,121,249,.35)'; ctx.lineWidth = 1.1;
  ctx.beginPath(); ctx.moveTo(-16, 4); ctx.quadraticCurveTo(0, -2, 16, 4); ctx.stroke();

  ctx.save(); ctx.translate(-1, -20); ctx.rotate(Math.sin(t) * .06); // gương bát quái trước ngực
  ctx.fillStyle = '#c9a227'; ctx.beginPath(); ctx.arc(0, 0, 7.4, 0, TAU); ctx.fill();
  ctx.fillStyle = '#efe4c4'; ctx.beginPath(); ctx.arc(0, 0, 5.4, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#2b2340'; ctx.lineWidth = 1;
  for (let i = 0; i < 8; i++) { const a = i * TAU / 8; ctx.beginPath(); ctx.moveTo(Math.cos(a) * 2.4, Math.sin(a) * 2.4); ctx.lineTo(Math.cos(a) * 5, Math.sin(a) * 5); ctx.stroke(); }
  ctx.restore();

  ctx.strokeStyle = '#5a3f26'; ctx.lineWidth = 3.2;                 // đào mộc kiếm
  ctx.save(); ctx.translate(14, -24); ctx.rotate(casting ? -1.15 : -.35);
  ctx.beginPath(); ctx.moveTo(-6, 0); ctx.lineTo(4, 0); ctx.stroke();
  ctx.fillStyle = '#8a5f38';
  ctx.beginPath(); ctx.moveTo(4, -3.4); ctx.lineTo(30, -2); ctx.lineTo(34, 0);
  ctx.lineTo(30, 2); ctx.lineTo(4, 3.4); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#e6c86a'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(8, 0); ctx.lineTo(28, 0); ctx.stroke();
  if (casting) { glowDot(ctx, 32, 0, 22, 'rgba(255,200,90,.7)'); }
  ctx.restore();

  ctx.fillStyle = '#0b0818';                                        // đầu trong bóng tối
  ctx.beginPath(); ctx.ellipse(1, -38, 8.4, 7.6, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#f0abfc'; ctx.shadowBlur = 12; ctx.shadowColor = '#e879f9';
  ctx.beginPath(); ctx.ellipse(-2, -38, 2.2, 2.9, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(5, -38, 2.2, 2.9, 0, 0, TAU); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#2b2340';                                        // mũ đạo sĩ + trâm
  ctx.beginPath();
  ctx.moveTo(-9, -44); ctx.lineTo(-6, -56); ctx.lineTo(8, -56); ctx.lineTo(11, -44); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#e6c86a'; ctx.lineWidth = 1.4; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-8, -50); ctx.lineTo(10, -50); ctx.stroke();
  ctx.fillStyle = '#e6c86a'; ctx.beginPath(); ctx.arc(1, -58, 2.4, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(190,180,220,.8)'; ctx.lineWidth = 1.6;    // râu dài
  ctx.beginPath(); ctx.moveTo(2, -33); ctx.quadraticCurveTo(4, -24, 1, -16); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(6, -33); ctx.quadraticCurveTo(9, -25, 6, -18); ctx.stroke();
  ctx.restore(); ctx.globalAlpha = 1;
}

/* ── Thạch Vệ: tượng hộ pháp bị phong ấn, mặt sư tử đá, bùa nứt trên trán ── */
function drawGolem(ctx, e) {
  const t = e.animT, walk = e.state === 'walk' ? Math.sin(t * 4.5) : 0;
  const sm = e.state === 'slam' ? clamp(1 - e.stateT / .55, 0, 1) : 0;
  shadowBlob(ctx, e.x, e.y + 2, 36);
  ctx.save(); ctx.translate(e.x, e.y); ctx.scale(e.face, 1);
  if (e.hurtT > 0) ctx.globalAlpha = .55 + Math.abs(Math.sin(e.hurtT * 40)) * .45;
  const S1 = '#5a5347', S2 = '#332e26', S3 = '#6e6657', SEAL = '#e6c86a', LAVA = '#ff8a3c';

  ctx.fillStyle = S2;                                               // chân trụ
  ctx.beginPath(); ctx.moveTo(-24, 0); ctx.lineTo(-18, -24); ctx.lineTo(-5, -22); ctx.lineTo(-7, 0); ctx.fill();
  ctx.beginPath(); ctx.moveTo(7, 0); ctx.lineTo(5 + walk * 4, -22); ctx.lineTo(19, -24); ctx.lineTo(24, 0); ctx.fill();
  ctx.beginPath();                                                  // thân đá tạc
  ctx.moveTo(-27, -22); ctx.lineTo(-23, -58); ctx.lineTo(-8, -68);
  ctx.lineTo(16, -66); ctx.lineTo(28, -52); ctx.lineTo(25, -20); ctx.closePath();
  const gg = ctx.createLinearGradient(-27, -68, 28, -20);
  gg.addColorStop(0, S3); gg.addColorStop(.55, S1); gg.addColorStop(1, S2);
  ctx.fillStyle = gg; ctx.fill();
  ctx.strokeStyle = '#191510'; ctx.lineWidth = 2.2; ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.14)'; ctx.lineWidth = 2;     // hoa văn xoắn chạm khắc
  for (const [cx, cy] of [[-12, -46], [10, -42]]) {
    ctx.beginPath();
    for (let a = 0; a < 5.2; a += .25) ctx.lineTo(cx + Math.cos(a * 1.6) * (2 + a * 1.5), cy + Math.sin(a * 1.6) * (2 + a * 1.5));
    ctx.stroke();
  }
  ctx.strokeStyle = LAVA; ctx.lineWidth = 2.2;                       // nứt phát sáng
  ctx.shadowBlur = 12; ctx.shadowColor = LAVA;
  ctx.beginPath(); ctx.moveTo(-16, -58); ctx.lineTo(-6, -44); ctx.lineTo(-12, -34); ctx.lineTo(1, -24); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(20, -60); ctx.lineTo(13, -47); ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(90,140,80,.5)';                              // rêu
  ctx.beginPath(); ctx.ellipse(-14, -64, 9, 3.4, -.2, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(12, -62, 7, 2.8, .15, 0, TAU); ctx.fill();

  ctx.fillStyle = S1;                                                // đầu sư tử đá
  ctx.beginPath();
  ctx.moveTo(-9, -68); ctx.lineTo(-6, -84); ctx.lineTo(12, -84); ctx.lineTo(16, -66); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#191510'; ctx.lineWidth = 1.7; ctx.stroke();
  ctx.strokeStyle = S3; ctx.lineWidth = 2.4;                         // bờm xoắn
  for (let i = 0; i < 5; i++) {
    const a = -2.5 + i * .5;
    ctx.beginPath(); ctx.arc(3 + Math.cos(a) * 13, -76 + Math.sin(a) * 12, 3.2, 0, TAU); ctx.stroke();
  }
  ctx.fillStyle = '#ffd166'; ctx.shadowBlur = 14; ctx.shadowColor = LAVA;
  ctx.beginPath(); ctx.arc(0, -76, 2.7, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(9, -76, 2.7, 0, TAU); ctx.fill(); ctx.shadowBlur = 0;
  ctx.fillStyle = '#efe6d4';                                          // nanh
  ctx.beginPath(); ctx.moveTo(1, -69); ctx.lineTo(3, -64); ctx.lineTo(5, -69); ctx.fill();
  ctx.beginPath(); ctx.moveTo(8, -69); ctx.lineTo(10, -64); ctx.lineTo(12, -69); ctx.fill();
  ctx.save(); ctx.translate(3, -87); ctx.rotate(Math.sin(t * 2) * .05);  // bùa phong ấn đã nứt
  ctx.fillStyle = SEAL; ctx.fillRect(-6, -8, 12, 16);
  ctx.strokeStyle = '#b8202a'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(0, -5); ctx.lineTo(0, 5); ctx.moveTo(-3, -1); ctx.lineTo(3, -1); ctx.stroke();
  ctx.strokeStyle = '#2a2118'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(-6, -3); ctx.lineTo(2, 1); ctx.lineTo(-2, 8); ctx.stroke();
  ctx.restore();

  const ay = -54 + sm * 42, ax = 27 + sm * 12;                        // nắm đấm đá
  ctx.fillStyle = S2;
  ctx.beginPath(); ctx.moveTo(21, -58); ctx.lineTo(ax, ay); ctx.lineTo(ax + 17, ay + 6); ctx.lineTo(27, -47); ctx.closePath(); ctx.fill();
  ctx.fillStyle = S1;
  ctx.beginPath(); ctx.arc(ax + 11, ay + 8, 14, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#191510'; ctx.lineWidth = 2; ctx.stroke();
  ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(ax + 2, ay + 4); ctx.lineTo(ax + 20, ay + 8); ctx.stroke();
  ctx.restore(); ctx.globalAlpha = 1;
}

/* ── Cung Thủ Ma: xạ thủ áo choàng rách, giương cung phát sáng ── */
function drawArcher(ctx, e) {
  const t = e.animT, walk = e.state === 'walk' ? Math.sin(t * 8) * .8 : 0;
  const draw = e.state === 'aim' ? clamp(1 - e.stateT / .8, 0, 1) : 0;
  shadowBlob(ctx, e.x, e.y + 2, 19);
  ctx.save(); ctx.translate(e.x, e.y); ctx.scale(e.face, 1);
  if (e.hurtT > 0) ctx.globalAlpha = .5 + Math.abs(Math.sin(e.hurtT * 40)) * .5;
  const CL = '#243d3a', CL2 = '#122220', LEATHER = '#4a3524', GLOW = '#7dffd4';
  const HIP = -28, SHO = -48, HEAD = -59;

  ctx.fillStyle = LEATHER;                                            // ống tên sau lưng
  ctx.save(); ctx.translate(-11, SHO + 6); ctx.rotate(.5);
  ctx.fillRect(-5, -12, 10, 24);
  ctx.strokeStyle = '#2a1d12'; ctx.lineWidth = 1.3; ctx.strokeRect(-5, -12, 10, 24);
  ctx.strokeStyle = '#cfe8df'; ctx.lineWidth = 1.4;
  for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.moveTo(i * 3, -12); ctx.lineTo(i * 3 - 1, -22); ctx.stroke(); }
  ctx.restore();

  capsule(ctx, -3, HIP, -3 + walk * 8, 0, 4.2, '#1a2b29');
  capsule(ctx, 3, HIP, 3 - walk * 8, 0, 4.4, CL2);
  ctx.beginPath();                                                    // áo choàng rách
  ctx.moveTo(-11, SHO); ctx.quadraticCurveTo(0, SHO - 5, 11, SHO);
  ctx.lineTo(13, HIP + 4);
  ctx.lineTo(7, HIP + 12); ctx.lineTo(2, HIP + 3); ctx.lineTo(-4, HIP + 13); ctx.lineTo(-13, HIP + 4);
  ctx.closePath();
  const cg = ctx.createLinearGradient(0, SHO, 0, HIP + 12);
  cg.addColorStop(0, CL); cg.addColorStop(1, CL2);
  ctx.fillStyle = cg; ctx.fill();
  ctx.strokeStyle = 'rgba(125,255,212,.28)'; ctx.lineWidth = 1.1; ctx.stroke();
  ctx.fillStyle = LEATHER; ctx.fillRect(-11, HIP - 4, 23, 4);         // đai da

  ctx.fillStyle = '#0a1614';                                           // mũ trùm
  ctx.beginPath();
  ctx.moveTo(-10, HEAD + 12); ctx.quadraticCurveTo(-12, HEAD - 10, 2, HEAD - 12);
  ctx.quadraticCurveTo(13, HEAD - 9, 11, HEAD + 5); ctx.lineTo(5, HEAD + 13); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(125,255,212,.3)'; ctx.lineWidth = 1.1; ctx.stroke();
  ctx.fillStyle = GLOW; ctx.shadowBlur = 12; ctx.shadowColor = GLOW;
  ctx.beginPath(); ctx.ellipse(4, HEAD + 2, 2.4, 1.7, -.15, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(9.4, HEAD + 2, 2, 1.5, -.15, 0, TAU); ctx.fill();
  ctx.shadowBlur = 0;

  const bx = 17, by = SHO + 6;                                         // cánh cung
  ctx.save(); ctx.translate(bx, by); ctx.rotate(e.state === 'aim' ? .05 : .45);
  ctx.strokeStyle = '#3f2f1c'; ctx.lineWidth = 3.4;
  ctx.beginPath(); ctx.moveTo(0, -26); ctx.quadraticCurveTo(11, 0, 0, 26); ctx.stroke();
  ctx.strokeStyle = '#c9a227'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(1, -22); ctx.quadraticCurveTo(9, 0, 1, 22); ctx.stroke();
  const pull = -draw * 15;                                             // dây cung kéo căng
  ctx.strokeStyle = 'rgba(230,240,238,.9)'; ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.moveTo(0, -26); ctx.lineTo(pull, 0); ctx.lineTo(0, 26); ctx.stroke();
  if (draw > 0) {
    glowDot(ctx, pull + 6, 0, 16 * draw, 'rgba(125,255,212,.7)');
    ctx.fillStyle = GLOW;
    ctx.beginPath(); ctx.moveTo(pull, -1.6); ctx.lineTo(28, -1.6); ctx.lineTo(34, 0);
    ctx.lineTo(28, 1.6); ctx.lineTo(pull, 1.6); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  capsule(ctx, 6, SHO + 4, bx - 2, by, 3.4, '#1a2b29');                 // tay giữ cung
  capsule(ctx, 4, SHO + 5, 4 + pull * .5 + 6, SHO + 8, 3.2, '#1a2b29'); // tay kéo dây
  if (e.state === 'aim') {                                             // tia ngắm cảnh báo
    ctx.save(); ctx.globalAlpha = .25 + draw * .5;
    ctx.strokeStyle = GLOW; ctx.lineWidth = 1.4; ctx.setLineDash([9, 8]);
    ctx.beginPath(); ctx.moveTo(bx + 20, by); ctx.lineTo(bx + 620, by + (e.aimDy || 0) * 620); ctx.stroke();
    ctx.setLineDash([]); ctx.restore();
  }
  ctx.restore(); ctx.globalAlpha = 1;
}

/* ═══ 8E. HIỂM HOẠ ĐỊA HÌNH — mỗi ải một loại, chỉ bật ở Ác Mộng ═══
   Trước đây cả ba loại bẫy đổ dồn vào mọi ải nên gần như không thể sống sót.
   Nay mỗi ải chỉ có đúng một loại, tăng dần độ phức tạp:
     ải 1 · bẫy chông   — bẫy tĩnh, học cách đọc vết nứt báo trước
     ải 2 · thiên thạch — bẫy động từ trên trời, phải di chuyển liên tục
     ải 3 · nham thạch  — bẫy toàn màn, ép leo cao và giữ nhịp             */
const HZ_INFO = {
  spike:  { key: 'spike',  ic: '⩗', name: 'BẪY CHÔNG',   sub: 'Địa Sát Trận',  col: '#9fe8c0',
            tip: 'Vết nứt sáng dưới đất = chông sắp trồi. Nhảy hoặc lướt qua.' },
  meteor: { key: 'meteor', ic: '☄', name: 'THIÊN THẠCH', sub: 'Hoả Vân Thạch', col: '#ff9a4a',
            tip: 'Vòng tròn đỏ nhấp nháy = điểm rơi. Rời khỏi vòng, tránh cả vũng lửa còn lại.' },
  lava:   { key: 'lava',   ic: '≈', name: 'NHAM THẠCH',  sub: 'Cửu U Hoả Hải', col: '#ff5a1f',
            tip: 'Nham thạch dâng theo chu kỳ. Nghe tiếng gầm là leo lên bệ đá ngay.' }
};

const LAVA_LOW = VH + 70, LAVA_HIGH = GROUND - 86;
const LAVA_CYCLE = { low: 12, rise: 3, high: 5.5, fall: 2.8 };
const LAVA_NEXT = { low: 'rise', rise: 'high', high: 'fall', fall: 'low' };
const HZ_GRACE = 3.2;                       // giây được yên thân khi vừa vào ải

class Hazards {
  constructor(G) {
    this.G = G;
    /* chỉ lấy đúng loại bẫy của ải hiện tại */
    this.kind = G.diff.hazard ? (G.level.hazard || null) : null;
    this.on = !!this.kind;
    this.grace = HZ_GRACE;
    this.lavaY = LAVA_LOW; this.lavaT = 0; this.phase = 'low'; this.burn = 0;
    this.warns = []; this.rocks = []; this.fires = []; this.spikes = [];
    this.metT = 4.5;
    this.embers = [];
    if (this.kind === 'spike') {
      for (let x = 300; x < G.level.w - 200; x += randInt(200, 300))
        this.spikes.push({ x, t: rand(0, 3.6) });
    }
    if (this.kind === 'meteor')
      this.embers = Array.from({ length: 26 }, () => ({ x: rand(0, 3000), y: rand(0, VH), s: rand(.3, 1) }));
    if (this.kind === 'lava') {
      this.bubbles = Array.from({ length: 30 }, () => ({ x: rand(0, 3000), p: rand(0, TAU), s: rand(.4, 1.4) }));
      this.embers = Array.from({ length: 40 }, () => ({ x: rand(0, 3000), y: rand(0, VH), s: rand(.3, 1) }));
    }
  }
  get info() { return HZ_INFO[this.kind] || null; }
  get lavaUp() { return this.kind === 'lava' && this.lavaY < GROUND; }

  /** Bật thủ công một loại bẫy (dùng cho lệnh cheat) */
  setKind(kind) {
    const G = this.G;
    const fake = { ...G, diff: { hazard: true }, level: { ...G.level, hazard: kind } };
    const hz = new Hazards(fake);
    hz.G = G; hz.grace = .4;
    return hz;
  }

  update(dt) {
    if (!this.on) return;
    if (this.grace > 0) { this.grace -= dt; return; }
    const G = this.G, h = G.hero;

    if (this.kind === 'lava') this.updateLava(dt, h, G);
    if (this.kind === 'meteor') this.updateMeteor(dt, h, G);
    if (this.kind === 'spike') this.updateSpike(dt, h, G);
  }

  /* ── ẢI III · biển nham thạch dâng theo chu kỳ ── */
  updateLava(dt, h, G) {
    this.lavaT += dt;
    const span = LAVA_CYCLE[this.phase], u = clamp(this.lavaT / span, 0, 1), sm = u * u * (3 - 2 * u);
    if (this.phase === 'rise') this.lavaY = lerp(LAVA_LOW, LAVA_HIGH, sm);
    else if (this.phase === 'fall') this.lavaY = lerp(LAVA_HIGH, LAVA_LOW, sm);
    else this.lavaY = this.phase === 'high' ? LAVA_HIGH : LAVA_LOW;
    if (this.lavaT >= span) {
      this.lavaT = 0; this.phase = LAVA_NEXT[this.phase];
      if (this.phase === 'rise') { G.banner('NHAM THẠCH DÂNG', 'LÊN CHỖ CAO NGAY'); Sfx.roar(); cam.kick(9); cam.bang('rgba(255,90,20,.28)', .7); }
      if (this.phase === 'fall') G.banner('NHAM THẠCH RÚT', 'MẶT ĐẤT AN TOÀN');
    }
    if (this.lavaUp) {
      for (let i = 0; i < 2; i++)
        FX.push({ k: 'smoke', x: cam.x + rand(-40, VW + 40), y: this.lavaY + rand(-4, 10),
          vx: rand(-12, 12), vy: rand(-58, -20), life: rand(.6, 1.2), max: 1.2, r: rand(8, 20), col: '#ff7a3c', grav: -14 });
    }
    /* bỏng khi chạm nham thạch */
    if (h && h.alive && h.y > this.lavaY + 2) {
      this.burn -= dt;
      spark(h.x + rand(-10, 10), h.y - 6, 1, '#ffb066', 120, { up: 90 });
      if (this.burn <= 0) {
        this.burn = .55;
        if (!CHEAT.god) { h.invT = 0; h.hurt(12, 0, G); }
        h.vy = -430; cam.kick(5);
        floatTxt(h.x, h.y - 76, 'BỎNG!', '#ff7a3c');
      }
    }
  }

  /* ── ẢI II · mưa thiên thạch, để lại vũng lửa ── */
  updateMeteor(dt, h, G) {
    this.metT -= dt;
    if (this.metT <= 0) {
      this.metT = rand(4.2, 7.2);
      const n = randInt(2, 3);
      for (let i = 0; i < n; i++)
        this.warns.push({ x: clamp((h ? h.x : 400) + rand(-380, 380), 70, G.level.w - 70), t: 1.35 });
      Sfx.tone(120, 300, .5, 'sine', .07);
    }
    for (let i = this.warns.length - 1; i >= 0; i--) {
      const w = this.warns[i]; w.t -= dt;
      if (w.t <= 0) { this.rocks.push({ x: w.x + rand(-8, 8), y: -70, vy: 480, r: 16 }); this.warns.splice(i, 1); }
    }
    for (let i = this.rocks.length - 1; i >= 0; i--) {
      const m = this.rocks[i];
      m.vy += 520 * dt; m.y += m.vy * dt;
      spark(m.x + rand(-6, 6), m.y - 10, 1, pick(['#ffb066', '#ff5a1f']), 60, { up: -60 });
      if (m.y >= GROUND) { this.boom(m.x, GROUND); this.rocks.splice(i, 1); }
    }
    /* vũng lửa còn lại sau va chạm */
    for (let i = this.fires.length - 1; i >= 0; i--) {
      const f = this.fires[i]; f.t -= dt;
      if (f.t <= 0) { this.fires.splice(i, 1); continue; }
      if (Math.random() < .5) spark(f.x + rand(-26, 26), f.y - 4, 1, '#ff9d3d', 90, { up: 110 });
      if (h && h.alive && !CHEAT.god && Math.abs(h.x - f.x) < 32 && h.y > f.y - 26 && h.y < f.y + 20) {
        f.hit = (f.hit || 0) - dt;
        if (f.hit <= 0) { f.hit = .6; h.hurt(8, sign(h.x - f.x || 1), G); }
      }
    }
  }

  /* ── ẢI I · bẫy chông trồi lên theo nhịp, có vết nứt báo trước ── */
  updateSpike(dt, h, G) {
    for (const s of this.spikes) {
      s.t += dt;
      const ph = s.t % 3.6;
      // 0 → 2.25 nằm im · 2.25 → 2.8 nứt cảnh báo · 2.8 → trồi lên rồi rút
      s.up = ph < 2.25 ? 0 : ph < 2.8 ? -((ph - 2.25) / .55) : clamp((ph - 2.8) / .14, 0, 1);
      if (s.up > .6 && h && h.alive && !CHEAT.god && h.invT <= 0 &&
          Math.abs(h.x - s.x) < 26 && h.y > GROUND - 34 && h.y <= GROUND + 4) {
        h.hurt(16, sign(h.x - s.x || 1), G);
        Sfx.hit();
      }
    }
  }

  boom(x, y) {
    const G = this.G, h = G.hero;
    Sfx.boom(); cam.kick(14); cam.bang('rgba(255,140,50,.22)', .5);
    ring(x, y, '#ff7a3c', 8, 110, .5, 7);
    shard(x, y, 14, '#4a3226');
    spark(x, y, 24, '#ffb066', 460);
    this.fires.push({ x, y, t: 2.8, hit: 0 });
    if (h && h.alive && !CHEAT.god && Math.hypot(h.x - x, h.y - 20 - y) < 82) h.hurt(22, sign(h.x - x || 1), G);
    for (const e of G.enemies) if (Math.hypot(e.x - x, e.y - y) < 96) e.hurt(40, sign(e.x - x || 1), G, false);
  }

  /* vẽ dưới chân nhân vật */
  drawUnder(ctx, t) {
    if (!this.on) return;
    for (const w of this.warns) {                        // vòng cảnh báo thiên thạch
      const u = 1 - w.t / 1.35, y = GROUND - 1;
      ctx.save(); ctx.globalAlpha = .35 + Math.abs(Math.sin(u * 22)) * .5;
      ctx.strokeStyle = '#ff4d4d'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(w.x, y, 40 - u * 16, 14 - u * 6, 0, 0, TAU); ctx.stroke();
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(w.x - 16, y); ctx.lineTo(w.x + 16, y);
      ctx.moveTo(w.x, y - 7); ctx.lineTo(w.x, y + 7); ctx.stroke();
      ctx.restore();
    }
    for (const s of this.spikes) {                       // bẫy chông
      const base = GROUND;
      if (s.up < 0) {                                    // nứt cảnh báo — càng gần càng sáng
        const a = Math.abs(s.up);
        ctx.save(); ctx.globalAlpha = .4 + a * .6;
        glowDot(ctx, s.x, base, 34 + a * 14, 'rgba(159,232,192,.3)');
        ctx.strokeStyle = '#9fe8c0'; ctx.lineWidth = 2;
        for (let i = -1; i <= 1; i++) {
          ctx.beginPath(); ctx.moveTo(s.x + i * 9 - 4, base); ctx.lineTo(s.x + i * 9 + 3, base + 7); ctx.stroke();
        }
        ctx.restore();
      } else if (s.up > 0) {
        const H = 26 * s.up;
        ctx.fillStyle = '#0f1219'; ctx.fillRect(s.x - 24, base - 2, 48, 6);
        for (let i = 0; i < 5; i++) {
          const bx = s.x - 19 + i * 9.5;
          const g = ctx.createLinearGradient(bx, base, bx, base - H);
          g.addColorStop(0, '#5b6472'); g.addColorStop(1, '#e6edf7');
          ctx.fillStyle = g;
          ctx.beginPath(); ctx.moveTo(bx - 4.4, base + 1); ctx.lineTo(bx, base - H); ctx.lineTo(bx + 4.4, base + 1); ctx.closePath(); ctx.fill();
        }
      }
    }
    for (const f of this.fires) {                        // vũng lửa
      const a = clamp(f.t / 2.8, 0, 1);
      ctx.save(); ctx.globalAlpha = a;
      glowDot(ctx, f.x, f.y - 6, 46, 'rgba(255,110,30,.55)');
      ctx.fillStyle = '#ff8a3c';
      for (let i = 0; i < 6; i++) {
        const bx = f.x - 26 + i * 10.4, hh = 12 + Math.abs(Math.sin(performance.now() / 130 + i)) * 16;
        ctx.beginPath(); ctx.moveTo(bx - 5, f.y); ctx.quadraticCurveTo(bx, f.y - hh, bx + 5, f.y); ctx.fill();
      }
      ctx.restore();
    }
  }

  /* vẽ đè lên nhân vật */
  drawOver(ctx, camX, t) {
    if (!this.on) return;
    for (const m of this.rocks) {                        // thiên thạch đang rơi
      glowDot(ctx, m.x, m.y, 46, 'rgba(255,120,30,.6)');
      ctx.save(); ctx.translate(m.x, m.y); ctx.rotate(t * 7);
      ctx.fillStyle = '#3a2a20';
      ctx.beginPath(); ctx.moveTo(-16, -9); ctx.lineTo(5, -17); ctx.lineTo(17, 2);
      ctx.lineTo(3, 16); ctx.lineTo(-14, 9); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#ff7a3c'; ctx.lineWidth = 2.2; ctx.stroke();
      ctx.restore();
      ctx.fillStyle = 'rgba(255,140,50,.4)';
      ctx.beginPath(); ctx.moveTo(m.x - 13, m.y); ctx.lineTo(m.x + 13, m.y); ctx.lineTo(m.x, m.y - 74); ctx.closePath(); ctx.fill();
    }
    if (this.kind !== 'lava' || this.lavaY > VH + 30) return;
    const y = this.lavaY;                                 // biển nham thạch
    const g = ctx.createLinearGradient(0, y - 8, 0, VH + 60);
    g.addColorStop(0, '#ffe08a'); g.addColorStop(.1, '#ff5a1f');
    g.addColorStop(.55, '#c2260a'); g.addColorStop(1, '#5e0d04');
    ctx.beginPath();
    ctx.moveTo(camX - 60, y + 10);
    for (let x = camX - 60; x <= camX + VW + 60; x += 14)
      ctx.lineTo(x, y + Math.sin(x * .028 + t * 2.4) * 4.5 + Math.sin(x * .009 - t * 1.5) * 3.5);
    ctx.lineTo(camX + VW + 60, VH + 140); ctx.lineTo(camX - 60, VH + 140);
    ctx.closePath(); ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = 'rgba(255,225,150,.85)'; ctx.lineWidth = 2.4;
    ctx.beginPath();
    for (let x = camX - 60; x <= camX + VW + 60; x += 14) {
      const yy = y + Math.sin(x * .028 + t * 2.4) * 4.5 + Math.sin(x * .009 - t * 1.5) * 3.5;
      x === camX - 60 ? ctx.moveTo(x, yy) : ctx.lineTo(x, yy);
    }
    ctx.stroke();
    for (const b of this.bubbles) {                       // bong bóng dung nham
      const bx = ((b.x - camX * .2) % 3000 + 3000) % 3000 - 60 + camX;
      if (bx < camX - 40 || bx > camX + VW + 40) continue;
      const r = 3 + Math.abs(Math.sin(t * b.s * 2 + b.p)) * 5;
      ctx.fillStyle = 'rgba(255,220,140,.55)';
      ctx.beginPath(); ctx.arc(bx, y + 14 + Math.sin(t * b.s + b.p) * 6, r, 0, TAU); ctx.fill();
    }
  }

  /* tàn lửa bay trên toàn màn (vẽ ở toạ độ màn hình) */
  drawEmbers(ctx, t) {
    if (!this.on) return;
    for (const e of this.embers) {
      const x = ((e.x - t * 26 * e.s) % 3000 + 3000) % 3000 % (VW + 60) - 30;
      const y = ((e.y - t * 46 * e.s) % VH + VH) % VH;
      ctx.fillStyle = 'rgba(255,' + (120 + e.s * 90 | 0) + ',60,' + (.25 + e.s * .45) + ')';
      ctx.beginPath(); ctx.arc(x, y, 1 + e.s * 1.8, 0, TAU); ctx.fill();
    }
  }
}

/* ═══ 9. VẬT LÝ CHUNG ═══ */
const GRAV = 2050;
function physics(e, dt, plats, worldW) {
  e.x = clamp(e.x + e.vx * dt, 18, worldW - 18);
  const prevY = e.y;
  e.vy += GRAV * dt;
  e.y += e.vy * dt;
  e.onGround = false;
  if (e.y >= GROUND) { e.y = GROUND; e.vy = 0; e.onGround = true; return; }
  if (e.vy > 0 && e.dropT <= 0) {
    for (const [px, py, pw] of plats) {
      if (e.x > px - 6 && e.x < px + pw + 6 && prevY <= py + 4 && e.y >= py) {
        e.y = py; e.vy = 0; e.onGround = true; return;
      }
    }
  }
}

/* ═══ 10. ĐẠN ═══ */
class Shot {
  constructor(x, y, vx, vy, o) {
    Object.assign(this, { x, y, vx, vy, age: 0, life: o.life ?? 3, dmg: o.dmg ?? 10,
      kind: o.kind ?? 'bolt', from: o.from ?? 'e', r: o.r ?? 9, grav: o.grav ?? 0,
      pierce: o.pierce ?? 0, dead: false });
  }
  update(dt) {
    this.age += dt; this.life -= dt;
    this.vy += this.grav * dt;
    this.x += this.vx * dt; this.y += this.vy * dt;
    if (this.life <= 0) this.dead = true;
    if (this.kind === 'fire' || this.kind === 'bolt')
      FX.push({ k: 'smoke', x: this.x, y: this.y, vx: rand(-14, 14), vy: rand(-14, 14),
        life: .22, max: .22, r: 5, col: this.from === 'p' ? '#67e8f9' : '#ff7a3c', grav: 0 });
    if (this.y > GROUND + 4 && this.kind !== 'shock') { this.dead = true; this.pop(); }
  }
  box() { return { x: this.x - this.r, y: this.y - this.r, w: this.r * 2, h: this.r * 2 }; }
  pop() {
    const c = this.from === 'p' ? '#a5f3fc' : this.kind === 'orb' ? '#f0abfc' : '#ffb066';
    spark(this.x, this.y, 9, c, 220); ring(this.x, this.y, c, 4, 26, .25, 3);
  }
}

/* ═══ 11. KIẾM SĨ ═══ */
const ATK_DMG = [22, 22, 38];
const atkDmg = i => Math.round(ATK_DMG[i] * CHEAT.dmgMul);
class Hero {
  constructor(x, diff) {
    const D = diff || DIFFS[1];
    this.x = x; this.y = GROUND; this.vx = 0; this.vy = 0;
    this.w = 30; this.h = 64; this.face = 1;
    this.maxHp = D.heroHp; this.hp = D.heroHp;
    this.maxMp = 100; this.mp = 100;
    this.energy = 0;
    this.onGround = true; this.jumps = 2; this.dropT = 0;
    this.animT = 0; this.hurtT = 0; this.invT = 0;
    this.atkT = 0; this.atkDur = .3; this.combo = 0; this.comboT = 0; this.hitOnce = null;
    this.dashT = 0; this.dashCd = 0; this.magicT = 0; this.magicCd = 0;
    this.ghost = []; this.alive = true; this.lv = 1;
    this.maxSh = 60; this.sh = 60;                 // khí thuẫn
    this.blocking = false; this.blockT = 0; this.shHitT = 0; this.brokeT = 0;
    this.stunT = 0; this.parryT = 0;
    this.up = { atk: 0, hp: 0, mp: 0, sh: 0, agi: 0, revive: 0 };
    this.spdMul = 1; this.atkMul = 1;
  }
  get box() { return { x: this.x - 15, y: this.y - this.h, w: 30, h: this.h }; }
  hitbox() {
    const reach = 58 + (this.combo === 2 ? 14 : 0);
    return { x: this.face > 0 ? this.x + 4 : this.x - 4 - reach, y: this.y - 60, w: reach, h: 56 };
  }
  update(dt, G) {
    this.animT += dt;
    this.hurtT = Math.max(0, this.hurtT - dt);
    this.invT = Math.max(0, this.invT - dt);
    this.atkT = Math.max(0, this.atkT - dt);
    this.dashCd = Math.max(0, this.dashCd - dt);
    this.magicCd = Math.max(0, this.magicCd - dt);
    this.magicT = Math.max(0, this.magicT - dt);
    this.dropT = Math.max(0, this.dropT - dt);
    this.comboT = Math.max(0, this.comboT - dt);
    this.blockT += dt; this.shHitT = Math.max(0, this.shHitT - dt);
    this.brokeT = Math.max(0, this.brokeT - dt);
    this.stunT = Math.max(0, this.stunT - dt);
    this.parryT = Math.max(0, this.parryT - dt);
    if (this.comboT === 0 && this.atkT === 0) this.combo = 0;
    if (this.shHitT <= 0 && this.brokeT <= 0)
      this.sh = Math.min(this.maxSh, this.sh + (this.blocking ? 8 : 26) * dt);
    this.mp = CHEAT.infMp ? this.maxMp : Math.min(this.maxMp, this.mp + 13 * (1 + this.up.mp * .3) * dt);
    if (CHEAT.god) this.invT = Math.max(this.invT, .2);
    /* GOD MODE giữ mọi thanh luôn đầy để khỏi phải dừng lại hồi phục khi test */
    if (CHEAT.godMode) {
      this.hp = this.maxHp; this.sh = this.maxSh; this.energy = 100;
      this.brokeT = 0; this.stunT = 0;
    }

    const P = Input.pad;
    const L = Input.down('KeyA', 'ArrowLeft') || P.left;
    const R = Input.down('KeyD', 'ArrowRight') || P.right;
    const jumpHit = Input.hit('KeyW', 'ArrowUp', 'Space') || P.jump === 2;
    const atkHit = Input.hit('KeyJ') || Input.mouse.fresh || P.atk === 2;
    const dashHit = Input.hit('ShiftLeft', 'ShiftRight') || P.dash === 2;
    const magHit = Input.hit('KeyL') || P.magic === 2;
    const ultHit = Input.hit('KeyE') || P.ult === 2;
    const downHold = Input.down('KeyS', 'ArrowDown');
    const wantBlock = (Input.down('KeyK') || Input.mouse.right || P.block) && this.brokeT <= 0 && this.stunT <= 0;
    if (wantBlock && !this.blocking) { this.blockT = 0; Sfx.tone(420, 700, .12, 'triangle', .1); }
    this.blocking = wantBlock && this.dashT <= 0 && this.atkT <= 0;

    if (this.stunT > 0) {                                 // đang choáng: mất điều khiển
      this.blocking = false;
      this.vx = approach(this.vx, 0, 1800 * dt);
      if (CHEAT.noclip) { this.y = clamp(this.y + this.vy * dt, 60, GROUND); }
      else { physics(this, dt, G.plats, G.level.w); if (this.onGround) this.jumps = 2; }
      if (Math.random() < .35) spark(this.x + rand(-14, 14), this.y - 74, 1, '#fde68a', 60, { up: 40 });
      return;
    }

    /* lướt */
    if (this.dashT > 0) {
      this.dashT -= dt; this.vy = 0; this.invT = Math.max(this.invT, .02);
      this.ghost.push({ x: this.x, y: this.y, f: this.face, t: .22 });
      if (this.dashT <= 0) this.vx *= .35;
    } else {
      const spd = 320 * this.spdMul * (this.blocking ? .42 : 1), acc = this.onGround ? 2600 : 1500;
      let want = 0; if (L) want -= 1; if (R) want += 1;
      if (want) { this.vx = approach(this.vx, want * spd, acc * dt); this.face = want; }
      else this.vx = approach(this.vx, 0, (this.onGround ? 3000 : 900) * dt);
      if (this.atkT > 0 && this.onGround) this.vx *= .82;
    }
    for (let i = this.ghost.length - 1; i >= 0; i--) { this.ghost[i].t -= dt; if (this.ghost[i].t <= 0) this.ghost.splice(i, 1); }

    if (jumpHit && downHold && this.onGround && this.y < GROUND - 1) {
      this.dropT = .2; this.vy = 60; this.onGround = false;   // rơi xuyên bệ
    } else if (jumpHit && this.jumps > 0) {
      this.vy = this.jumps === 2 ? -740 : -660;
      this.jumps--; this.onGround = false; Sfx.jump();
      puff(this.x, this.y, 5, '#9fb6d4', 10);
      if (this.jumps === 0) ring(this.x, this.y - 12, 'rgba(103,232,249,.8)', 4, 30, .3, 3);
    }

    if (dashHit && this.dashCd <= 0 && this.dashT <= 0) {
      this.dashT = .19; this.dashCd = .75 * (1 - this.up.agi * .12); this.vx = this.face * 900;
      Sfx.dash(); cam.kick(4);
      puff(this.x - this.face * 10, this.y - 26, 8, '#67e8f9', 12);
    }
    if (atkHit && this.atkT <= 0 && this.dashT <= 0 && !this.blocking) {
      this.combo = this.comboT > 0 ? (this.combo + 1) % 3 : 0;
      this.comboT = .55; this.atkDur = this.combo === 2 ? .38 : .3;
      this.atkT = this.atkDur; this.hitOnce = new Set(); Sfx.swing();
      if (this.combo === 2) { this.vx += this.face * 190; cam.kick(3); }
    }
    if (magHit && this.magicCd <= 0 && this.mp >= 24 && !this.blocking) {
      if (!CHEAT.infMp) this.mp -= 24; this.magicCd = .42; this.magicT = .2; Sfx.magic();
      const tx = Input.mouse.wx, ty = Input.mouse.wy;
      let ang = Math.atan2(ty - (this.y - 40), tx - this.x);
      if (!isFinite(ang) || (Input.mouse.wx === 0 && Input.mouse.wy === 0)) ang = this.face > 0 ? 0 : Math.PI;
      if (Math.cos(ang) * this.face < 0) this.face = -this.face;
      G.shots.push(new Shot(this.x + this.face * 20, this.y - 40, Math.cos(ang) * 760, Math.sin(ang) * 760,
        { kind: 'bolt', dmg: 34, from: 'p', r: 11, life: 1.4, pierce: 1 }));
      spark(this.x + this.face * 24, this.y - 40, 7, '#a5f3fc', 180);
    }
    if (ultHit && this.energy >= 100) G.ultimate();

    if (CHEAT.noclip) {                                  // bay xuyên địa hình
      this.vy = (Input.down('KeyW', 'ArrowUp') ? -420 : 0) + (Input.down('KeyS', 'ArrowDown') ? 420 : 0);
      this.x = clamp(this.x + this.vx * dt, 18, G.level.w - 18);
      this.y = clamp(this.y + this.vy * dt, 60, GROUND);
      this.onGround = true; this.jumps = 2;
    } else {
      physics(this, dt, G.plats, G.level.w);
      if (this.onGround) this.jumps = 2;
    }
  }
  gain(n) { this.energy = Math.min(100, this.energy + n); }
  /** Trả về 'parry' | 'block' | 'break' | null — dùng cho cả đòn cận chiến lẫn đạn */
  tryBlock(dmg, fromX, G) {
    if (!this.blocking || this.brokeT > 0) return null;
    if (Math.sign(fromX - this.x) !== this.face && Math.abs(fromX - this.x) > 6) return null;  // đánh sau lưng
    if (this.blockT < .22) {                                   // ĐỠ HOÀN HẢO
      this.parryT = .35; this.gain(14); this.sh = Math.min(this.maxSh, this.sh + 12);
      Sfx.tone(1200, 1800, .14, 'triangle', .2); Sfx.noise(.1, .2, 2000);
      cam.kick(6); cam.bang('rgba(200,245,255,.4)', .5);
      ring(this.x + this.face * 22, this.y - 34, '#eaffff', 6, 74, .3, 5);
      floatTxt(this.x, this.y - 84, 'HOÀN MỸ!', '#a5f3fc', true);
      G.hitStop = .08;
      return 'parry';
    }
    this.shHitT = 1.1;
    this.sh -= dmg;
    Sfx.tone(320, 180, .1, 'square', .14); Sfx.noise(.08, .18, 700);
    spark(this.x + this.face * 22, this.y - 34, 8, '#8fd8ff', 200);
    this.vx = -this.face * 90;
    if (this.sh <= 0) {                                        // VỠ KHIÊN
      this.sh = 0; this.brokeT = 1.4; this.blocking = false; this.stunT = .55;
      Sfx.boom(); cam.kick(12);
      ring(this.x, this.y - 34, '#ff6b6b', 6, 80, .4, 5);
      floatTxt(this.x, this.y - 84, 'VỠ KHIÊN!', '#ff8080', true);
      return 'break';
    }
    floatTxt(this.x + this.face * 26, this.y - 50, 'ĐỠ', '#8fd8ff');
    return 'block';
  }
  hurt(dmg, dir, G, fromX) {
    if (this.invT > 0 || !this.alive || CHEAT.god) return;
    dmg = Math.max(1, Math.round(dmg * (G.diff ? G.diff.dmgMul : 1)));
    const b = this.tryBlock(dmg, fromX != null ? fromX : this.x + this.face * 40, G);
    if (b === 'parry' || b === 'block') { this.invT = .18; return; }
    if (b === 'break') dmg = Math.round(dmg * .5);
    this.hp -= dmg; this.hurtT = .55; this.invT = .8;
    this.vx = dir * 260; this.vy = -220;
    this.gain(7); G.combo = 0; G.comboT = 0;
    Sfx.hurt(); cam.kick(12); cam.bang('rgba(255,60,60,.35)', .8);
    spark(this.x, this.y - 34, 14, '#ff6b6b', 300);
    floatTxt(this.x, this.y - 66, '-' + dmg, '#ff8080');
    if (this.hp <= 0) {
      if (this.up.revive > 0) {                          // Hồi Sinh Đan
        this.up.revive = 0; this.hp = Math.round(this.maxHp * .6); this.invT = 2.2; this.sh = this.maxSh;
        Sfx.win(); cam.bang('rgba(255,235,180,.7)', 1.1); cam.kick(18);
        ring(this.x, this.y - 34, '#fde68a', 8, 190, .8, 7);
        spark(this.x, this.y - 34, 40, '#fde68a', 500);
        floatTxt(this.x, this.y - 96, 'HỒI SINH!', '#fde68a', true);
        G.banner('HỒI SINH ĐAN', 'ĐỨNG DẬY ĐI, KIẾM SĨ');
      } else { this.hp = 0; this.alive = false; G.over(false); }
    }
  }
  draw(ctx) {
    for (const g of this.ghost) {
      ctx.globalAlpha = g.t / .22 * .35;
      ctx.save(); ctx.translate(g.x, g.y); ctx.scale(g.f, 1);
      ctx.fillStyle = '#67e8f9'; ctx.beginPath();
      ctx.moveTo(-10, -60); ctx.lineTo(10, -60); ctx.lineTo(8, 0); ctx.lineTo(-8, 0); ctx.closePath(); ctx.fill();
      ctx.restore(); ctx.globalAlpha = 1;
    }
    drawHero(ctx, this);
    if (this.blocking || this.parryT > 0) drawShield(ctx, this);
    if (this.stunT > 0) {                                   // sao xoay khi choáng
      for (let i = 0; i < 3; i++) {
        const a = this.animT * 6 + i * TAU / 3;
        const sx = this.x + Math.cos(a) * 15, sy = this.y - 78 + Math.sin(a) * 5;
        ctx.fillStyle = '#fde68a'; ctx.save(); ctx.translate(sx, sy); ctx.rotate(a);
        ctx.beginPath();
        for (let k = 0; k < 5; k++) {
          const aa = k * TAU / 5 - Math.PI / 2;
          ctx.lineTo(Math.cos(aa) * 5, Math.sin(aa) * 5);
          ctx.lineTo(Math.cos(aa + TAU / 10) * 2.2, Math.sin(aa + TAU / 10) * 2.2);
        }
        ctx.closePath(); ctx.fill(); ctx.restore();
      }
    }
  }
}

/* ═══ 12. QUÁI ═══ */
const EDEF = {
  slime:    { hp: 46,  w: 46, h: 38, spd: 76,  dmg: 9,  pts: 60,  name: 'Nhớt Độc' },
  wraith:   { hp: 40,  w: 46, h: 48, spd: 132, dmg: 12, pts: 90,  name: 'Ma Dơi' },
  skeleton: { hp: 92,  w: 38, h: 60, spd: 92,  dmg: 15, pts: 130, name: 'Cốt Kiếm Sĩ' },
  mage:     { hp: 66,  w: 40, h: 62, spd: 66,  dmg: 13, pts: 170, name: 'Pháp Sư Bóng Tối' },
  golem:    { hp: 230, w: 74, h: 78, spd: 48,  dmg: 22, pts: 300, name: 'Thạch Vệ' },
  archer:   { hp: 62,  w: 38, h: 62, spd: 78,  dmg: 16, pts: 180, name: 'Cung Thủ Ma' }
};

class Enemy {
  constructor(type, x, tier, diff) {
    const d = EDEF[type], D = diff || DIFFS[1];
    Object.assign(this, { type, x, y: GROUND, vx: 0, vy: 0, face: -1, onGround: false, dropT: 0,
      w: d.w, h: d.h, spd: d.spd * D.spdMul, dmg: d.dmg, pts: d.pts, def: d,
      maxHp: Math.round(d.hp * (1 + tier * .28) * D.hpMul), animT: rand(0, 9), hurtT: 0, stun: 0,
      state: 'walk', stateT: 0, cool: rand(.4, 1.6), charge: 0, dead: false, aimDy: 0,
      flying: type === 'wraith' || type === 'mage' });
    this.hp = this.maxHp;
    if (this.flying) { this.y = GROUND - rand(40, 130); this.baseY = this.y; }
  }
  get box() { return { x: this.x - this.w / 2, y: this.y - this.h, w: this.w, h: this.h }; }
  update(dt, G) {
    this.animT += dt;
    this.hurtT = Math.max(0, this.hurtT - dt);
    this.stun = Math.max(0, this.stun - dt);
    this.stateT = Math.max(0, this.stateT - dt);
    this.cool = Math.max(0, this.cool - dt);
    const p = G.hero, dx = p.x - this.x, adx = Math.abs(dx);
    if (this.stun <= 0 && this.state !== 'wind' && this.state !== 'swing') this.face = dx < 0 ? -1 : 1;

    if (this.stun > 0) { this.vx *= .9; }
    else switch (this.type) {
      case 'slime': {
        if (this.onGround) {
          this.vx *= .86;
          if (this.cool <= 0) { this.vy = -470; this.vx = this.face * 165; this.cool = rand(.75, 1.35); }
        }
        break;
      }
      case 'wraith': {
        const ty = p.y - 52 + Math.sin(this.animT * 2.2) * 16;
        if (this.state === 'dive') {
          if (this.stateT <= 0) { this.state = 'fly'; this.cool = rand(1.1, 2); }
        } else if (this.charge > 0) {
          this.charge -= dt; this.vx *= .84; this.vy *= .84;
          if (this.charge <= 0) {
            const a = Math.atan2(p.y - 34 - this.y, p.x - this.x);
            this.vx = Math.cos(a) * 620; this.vy = Math.sin(a) * 620;
            this.state = 'dive'; this.stateT = .45; Sfx.swing();
          }
        } else {
          this.vx = approach(this.vx, clamp(dx, -1, 1) * this.spd, 460 * dt);
          this.vy = approach(this.vy, clamp(ty - this.y, -90, 90), 500 * dt);
          if (adx < 250 && this.cool <= 0) { this.charge = .45; this.cool = 2.4; }
        }
        break;
      }
      case 'skeleton': {
        if (this.state === 'wind') { this.vx *= .8; if (this.stateT <= 0) { this.state = 'swing'; this.stateT = .22; this.hitOnce = false; } }
        else if (this.state === 'swing') {
          if (!this.hitOnce) {
            const hb = { x: this.face > 0 ? this.x : this.x - 56, y: this.y - 52, w: 56, h: 46 };
            if (aabb(hb, p.box)) { p.hurt(this.dmg, this.face, G, this.x); this.hitOnce = true; }
          }
          if (this.stateT <= 0) { this.state = 'walk'; this.cool = rand(.5, 1); }
        } else {
          this.vx = approach(this.vx, (adx > 46 ? this.face * this.spd : 0), 900 * dt);
          if (adx < 62 && this.cool <= 0 && Math.abs(p.y - this.y) < 60) { this.state = 'wind'; this.stateT = .5; }
        }
        break;
      }
      case 'mage': {
        const want = adx < 240 ? -this.face : (adx > 380 ? this.face : 0);
        this.vx = approach(this.vx, want * this.spd, 500 * dt);
        this.vy = approach(this.vy, Math.sin(this.animT * 1.6) * 30 + clamp(p.y - 130 - this.y, -60, 60), 300 * dt);
        if (this.state === 'cast') {
          this.vx *= .7;
          if (this.stateT <= 0) {
            this.state = 'fly'; this.cool = rand(1.8, 2.6);
            for (let i = -1; i <= 1; i++) {
              const a = Math.atan2(p.y - 34 - (this.y - 48), p.x - this.x) + i * .22;
              G.shots.push(new Shot(this.x + this.face * 14, this.y - 48, Math.cos(a) * 320, Math.sin(a) * 320,
                { kind: 'orb', dmg: this.dmg, r: 10, life: 3.4 }));
            }
            Sfx.magic();
          }
        } else if (this.cool <= 0 && adx < 520) { this.state = 'cast'; this.stateT = .7; }
        break;
      }
      case 'archer': {
        const want = adx < 250 ? -this.face : (adx > 470 ? this.face : 0);
        if (this.state === 'aim') {
          this.vx *= .8;
          if (this.stateT <= 0) {
            const a = Math.atan2(p.y - 34 - (this.y - 42), p.x - this.x);
            G.shots.push(new Shot(this.x + this.face * 20, this.y - 42, Math.cos(a) * 720, Math.sin(a) * 720,
              { kind: 'arrow', dmg: this.dmg, r: 8, life: 2.2 }));
            Sfx.noise(.1, .16, 1600); Sfx.tone(900, 400, .1, 'triangle', .08);
            this.state = 'walk'; this.cool = rand(1.5, 2.4);
          } else this.aimDy = Math.sin(Math.atan2(p.y - 34 - (this.y - 42), Math.max(60, adx)));
        } else {
          this.vx = approach(this.vx, want * this.spd, 800 * dt);
          if (this.cool <= 0 && adx < 620 && adx > 90) { this.state = 'aim'; this.stateT = .8; }
        }
        break;
      }
      case 'golem': {
        if (this.state === 'slam') {
          this.vx = 0;
          if (this.stateT <= 0) {
            this.state = 'walk'; this.cool = rand(1.6, 2.4);
            Sfx.boom(); cam.kick(15); ring(this.x, GROUND, '#ff7a3c', 8, 120, .45, 6);
            shard(this.x, GROUND, 12, '#4a4034');
            for (const s of [-1, 1]) G.shots.push(new Shot(this.x + s * 30, GROUND - 12, s * 300, 0,
              { kind: 'shock', dmg: 16, r: 16, life: 1.4 }));
          }
        } else {
          this.vx = approach(this.vx, (adx > 60 ? this.face * this.spd : 0), 600 * dt);
          if (adx < 110 && this.cool <= 0) { this.state = 'slam'; this.stateT = .55; }
        }
        break;
      }
    }

    if (this.flying) {
      this.x = clamp(this.x + this.vx * dt, 20, G.level.w - 20);
      this.y = clamp(this.y + this.vy * dt, 90, GROUND - 12);
      this.onGround = false;
    } else physics(this, dt, G.plats, G.level.w);
  }
  hurt(dmg, dir, G, crit) {
    this.hp -= dmg; this.hurtT = .3;
    this.vx += dir * (this.type === 'golem' ? 60 : 210);
    if (!this.flying && this.type !== 'golem') this.vy = Math.min(this.vy, -110);
    this.stun = this.type === 'golem' ? .06 : .16;
    floatTxt(this.x + rand(-8, 8), this.y - this.h - 6, String(dmg), crit ? '#fde68a' : '#fff', crit);
    spark(this.x, this.y - this.h * .55, crit ? 16 : 9, crit ? '#fde68a' : '#ffd9a0', crit ? 380 : 250);
    if (this.hp <= 0) this.kill(G);
  }
  kill(G) {
    if (this.dead) return;
    this.dead = true;
    const c = { slime: '#4ade80', wraith: '#a78bfa', skeleton: '#d9d3c2',
                mage: '#f0abfc', golem: '#ff7a3c', archer: '#7dffd4' }[this.type] || '#fff';
    spark(this.x, this.y - this.h * .5, 26, c, 420);
    shard(this.x, this.y - this.h * .5, 9, c);
    ring(this.x, this.y - this.h * .5, c, 6, 62, .4, 4);
    Sfx.crit(); cam.kick(6);
    G.onKill(this);
  }
  draw(ctx) {
    const F = { slime: drawSlime, wraith: drawWraith, skeleton: drawSkeleton,
                mage: drawMage, golem: drawGolem, archer: drawArcher }[this.type];
    if (F) F(ctx, this);
    if (this.hp < this.maxHp) {                       // thanh máu nhỏ
      const w = Math.max(30, this.w), x = this.x - w / 2, y = this.y - this.h - 14;
      ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(x - 1, y - 1, w + 2, 5);
      ctx.fillStyle = '#f0413f'; ctx.fillRect(x, y, w * (this.hp / this.maxHp), 3);
    }
  }
}

/* ═══ 13. BOSS — HẮC LONG VƯƠNG ═══ */
class Boss {
  constructor(x, mul, diff) {
    mul = mul || 1;
    this.x = x; this.y = GROUND; this.vx = 0; this.vy = 0;
    this.w = 130; this.h = 190; this.sc = 1; this.face = -1;
    this.maxHp = Math.round(2000 * mul); this.hp = this.maxHp; this.phase = 0;

  draw(ctx) {

    if (this.state === 'beam') {                          // tia sáng
      const h = 22 * clamp(this.beam / .3, 0, 1);

      g.addColorStop(0, 'rgba(232,121,249,0)'); g.addColorStop(.5, 'rgba(255,255,255,.95)');
      g.addColorStop(1, 'rgba(232,121,249,0)');
      ctx.fillStyle = g; ctx.fillRect(Math.min(x0, x1), this.beamY - h, Math.abs(x1 - x0), h * 2);

}

/* ═══ 14. VẬT PHẨM ═══ */
class Drop {
  constructor(x, y, kind) {
    Object.assign(this, { x, y, vx: rand(-90, 90), vy: -320, kind, t: 0, dead: false, onGround: false, dropT: 0 });
    if (kind === 'gold') this.val = randInt(8, 22);
  }
  update(dt, G) {
    this.t += dt;
    this.vy += GRAV * .55 * dt; this.x += this.vx * dt; this.y += this.vy * dt;
    if (this.y >= GROUND) { this.y = GROUND; this.vy *= -.35; this.vx *= .7; if (Math.abs(this.vy) < 40) this.vy = 0; }
    if (this.t > 14) this.dead = true;
    const p = G.hero;
    if (Math.hypot(p.x - this.x, p.y - 30 - this.y) < 40) {
      this.dead = true; Sfx.pickup();
      if (this.kind === 'hp') { p.hp = Math.min(p.maxHp, p.hp + 28); floatTxt(p.x, p.y - 70, '+28 HP', '#4ade80'); }
      else if (this.kind === 'gold') { G.addGold(this.val); floatTxt(p.x, p.y - 70, '+' + this.val + ' ⛁', '#fbbf24'); }
      else { p.mp = Math.min(p.maxMp, p.mp + 45); floatTxt(p.x, p.y - 70, '+45 MP', '#7dd3fc'); }
      ring(this.x, this.y - 10, { hp: '#4ade80', mp: '#38bdf8', gold: '#fbbf24' }[this.kind], 4, 44, .35, 3);
    }
  }
  draw(ctx) {
    const b = Math.sin(this.t * 4) * 4;
    if (this.kind === 'gold') {                      // đồng tiền cổ có lỗ vuông
      glowDot(ctx, this.x, this.y - 14 + b, 24, 'rgba(251,191,36,.5)');
      ctx.save(); ctx.translate(this.x, this.y - 14 + b);
      ctx.scale(Math.cos(this.t * 3.4) * .8 + .2 || .2, 1);
      ctx.fillStyle = '#e0b64a'; ctx.beginPath(); ctx.arc(0, 0, 8, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#96762a'; ctx.lineWidth = 1.4; ctx.stroke();
      ctx.fillStyle = '#7a5f1c'; ctx.fillRect(-2.6, -2.6, 5.2, 5.2);
      ctx.restore(); return;
    }
    const c = this.kind === 'hp' ? '#4ade80' : '#38bdf8';
    glowDot(ctx, this.x, this.y - 14 + b, 26, this.kind === 'hp' ? 'rgba(74,222,128,.5)' : 'rgba(56,189,248,.5)');
    ctx.save(); ctx.translate(this.x, this.y - 14 + b);
    ctx.fillStyle = '#101826'; ctx.strokeStyle = c; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, -11); ctx.lineTo(9, 0); ctx.lineTo(0, 11); ctx.lineTo(-9, 0); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = c;
    if (this.kind === 'hp') { ctx.fillRect(-5, -1.6, 10, 3.2); ctx.fillRect(-1.6, -5, 3.2, 10); }
    else { ctx.beginPath(); ctx.moveTo(1, -6); ctx.lineTo(-4, 1); ctx.lineTo(0, 1); ctx.lineTo(-1, 7); ctx.lineTo(4, -1); ctx.lineTo(0, -1); ctx.closePath(); ctx.fill(); }
    ctx.restore();
  }
}


/* ─────── js/08-cheat.js ─────── */
/* ══════════════════════════════════════════════════════════════
   08-cheat.js  —  Bảng lệnh cheat trong game và phím tắt F1–F8
   Nạp theo thứ tự trong index.html; các file dùng chung phạm vi toàn cục.
   ══════════════════════════════════════════════════════════════ */
/* ═══ 19. BẢNG CHEAT — console dựng hoàn toàn bằng DOM ═══ */
const CheatBox = {
  root: null, input: null, log: null, open_: false,

  build() {
    if (this.root) return;
    const stage = document.querySelector('#stage');
    const root = el('div'); root.id = 'cheatbox';

    /* ── thanh tiêu đề: tên bảng · trạng thái cheat đang bật · nút đóng ── */
    const head = el('div', 'cbhead');
    const title = el('span', 'cbtitle', '⌘ BẢNG LỆNH');
    const status = el('span', 'cbstatus');
    const tip = el('span', 'cbtip', 'Enter chạy · Tab gợi ý · ↑↓ lịch sử · Esc đóng');
    const close = el('button', 'cbx', '✕'); close.title = 'Đóng bảng lệnh (Esc)';
    close.addEventListener('click', () => this.open(false));
    head.append(title, status, tip, close);

    /* ── thân: nhật ký bên trái, danh sách lệnh bấm được bên phải ── */
    const body = el('div', 'cbbody');
    const log = el('div', 'cblog');
    const ref = el('div', 'cbref');
    for (const g of CHEAT_GROUPS) {
      const sec = el('div', 'cbgrp');
      sec.style.setProperty('--gc', g.col);
      sec.append(el('div', 'cbgn', g.name));
      const wrap = el('div', 'cbchips');
      for (const it of g.items) {
        const chip = el('button', 'cbchip');
        chip.append(el('b', null, it.c));
        if (it.arg) chip.append(el('i', null, it.arg));
        if (it.k) chip.append(el('u', null, it.k));
        chip.title = it.d;
        chip.dataset.cmd = it.c;
        chip.dataset.fill = it.fill || '';
        wrap.append(chip);
      }
      sec.append(wrap);
      ref.append(sec);
    }
    /* uỷ quyền sự kiện — một listener cho mọi chip */
    ref.addEventListener('click', e => {
      const c = e.target.closest('.cbchip'); if (!c) return;
      if (c.dataset.fill) { this.input.value = c.dataset.fill; this.input.focus(); }
      else { this.run(c.dataset.cmd); this.input.focus(); }
    });
    body.append(log, ref);

    /* ── dòng nhập ── */
    const row = el('div', 'cbrow');
    const caret = el('span', 'cbcaret', '❯');
    const inp = document.createElement('input');
    inp.type = 'text'; inp.spellcheck = false; inp.autocomplete = 'off';
    inp.placeholder = 'gõ lệnh, ví dụ:  god  ·  spawn golem 3  ·  diff 4';
    const ghost = el('span', 'cbghost');            // gợi ý hoàn thành lệnh
    row.append(caret, inp, ghost);
    root.append(head, body, row);
    stage.append(root);
    this.root = root; this.input = inp; this.log = log; this.status = status; this.ghost = ghost;

    inp.addEventListener('input', () => this.hintUpdate());
    inp.addEventListener('keydown', e => {
      e.stopPropagation();
      if (e.key === 'Enter') { const v = inp.value.trim(); inp.value = ''; this.hintUpdate(); if (v) this.run(v); }
      else if (e.key === 'Escape') this.open(false);
      else if (e.key === 'Tab') {                    // hoàn thành lệnh đang gõ dở
        e.preventDefault();
        const m = this.match(inp.value);
        if (m) { inp.value = m + ' '; this.hintUpdate(); }
      } else if (e.key === 'ArrowUp' && this.hist && this.hist.length) {
        e.preventDefault();
        this.hi = Math.max(0, (this.hi ?? this.hist.length) - 1); inp.value = this.hist[this.hi] || ''; this.hintUpdate();
      } else if (e.key === 'ArrowDown' && this.hist) {
        e.preventDefault();
        this.hi = Math.min(this.hist.length, (this.hi ?? 0) + 1); inp.value = this.hist[this.hi] || ''; this.hintUpdate();
      }
    });
    inp.addEventListener('keyup', e => e.stopPropagation());
    this.say('Sẵn sàng. Bấm thẳng vào lệnh bên phải, hoặc gõ rồi Enter.', '#8d99ad');
    this.statusUpdate();
  },

  /** tên lệnh đầu tiên khớp tiền tố đang gõ */
  match(v) {
    const s = (v || '').trim().toLowerCase();
    if (!s || s.includes(' ')) return null;
    return CHEAT_NAMES.find(n => n.startsWith(s) && n !== s) || null;
  },
  hintUpdate() {
    if (!this.ghost) return;
    const m = this.match(this.input.value);
    this.ghost.textContent = m ? m + '   ⇥' : '';
  },
  /** dải trạng thái: cheat nào đang bật.
      Hàm này bị gọi mỗi khung hình nên chỉ dựng lại DOM khi nội dung thật sự đổi. */
  statusUpdate() {
    if (!this.status) return;
    const on = [];
    if (CHEAT.god) on.push('BẤT TỬ');
    if (CHEAT.noclip) on.push('BAY');
    if (CHEAT.infMp) on.push('VÔ HẠN MP');
    if (CHEAT.dmgMul !== 1) on.push('DMG ×' + CHEAT.dmgMul);
    if (CHEAT.speed !== 1) on.push('TỐC ×' + CHEAT.speed);
    const key = on.join('|');
    if (key === this.statusKey) return;
    this.statusKey = key;
    this.status.replaceChildren();
    for (const t of on) this.status.append(el('i', null, t));
    this.status.classList.toggle('empty', !on.length);
  },

  open(on) {
    this.build();
    this.open_ = on === undefined ? !this.open_ : on;
    this.root.classList.toggle('on', this.open_);
    Input.lock = this.open_;
    this.statusUpdate();
    if (this.open_) { Input.held.clear(); this.input.focus(); } else this.input.blur();
  },

  say(msg, col, cls) {
    this.build();
    const n = el('div', cls || null, msg);
    if (col) n.style.color = col;
    this.log.append(n);
    while (this.log.children.length > 80) this.log.firstChild.remove();
    this.log.scrollTop = this.log.scrollHeight;
    return n;
  },
  ok(m) { this.say('✔ ' + m, '#67e8f9'); this.statusUpdate(); },
  no(m) { this.say('✘ ' + m, '#fb7185'); },

  run(line) {
    (this.hist ??= []).push(line); this.hi = this.hist.length;
    this.say('❯ ' + line, '#cbd5e1');
    const a = line.trim().split(/\s+/);
    const cmd = a[0].toLowerCase(), n = parseFloat(a[1]);
    const G = GAME, h = G.hero;
    const playing = G.state === 'play' || G.state === 'pause';

    switch (cmd) {
      case 'help': case '?':
        for (const g of CHEAT_GROUPS) {
          this.say('── ' + g.name + ' ──', g.col, 'cbh');
          for (const it of g.items)
            this.say('  ' + (it.c + (it.arg ? ' ' + it.arg : '')).padEnd(18) + it.d + (it.k ? '   [' + it.k + ']' : ''), '#9fadc2');
        }
        break;
      case 'god': case 'godmode': case 'gm': case 'batbai':
        toggleGodMode();
        this.ok('GOD MODE: ' + (CHEAT.godMode ? 'BẬT — bất tử, vô hạn MP, ULT đầy, sát thương ×' + GOD_DMG : 'TẮT'));
        break;
      case 'inv': case 'batu':
        CHEAT.god = !CHEAT.god; this.ok('Bất tử: ' + (CHEAT.god ? 'BẬT' : 'TẮT')); GAME.ui.cheatBadge(); break;
      case 'mp': case 'infmp':
        CHEAT.infMp = !CHEAT.infMp; this.ok('Nội lực vô hạn: ' + (CHEAT.infMp ? 'BẬT' : 'TẮT')); GAME.ui.cheatBadge(); break;
      case 'noclip': case 'bay':
        CHEAT.noclip = !CHEAT.noclip; this.ok('Bay xuyên địa hình: ' + (CHEAT.noclip ? 'BẬT' : 'TẮT')); GAME.ui.cheatBadge(); break;
      case 'heal': case 'hoi':
        if (!h) return this.no('Chưa vào ván.');
        h.hp = h.maxHp; h.mp = h.maxMp; floatTxt(h.x, h.y - 80, 'HỒI PHỤC', '#4ade80', true); this.ok('Hồi đầy HP và MP.'); break;
      case 'ult':
        if (!h) return this.no('Chưa vào ván.');
        h.energy = 100; this.ok('Tuyệt kỹ đã đầy.'); break;
      case 'kill': case 'diet':
        if (!playing) return this.no('Chỉ dùng khi đang chơi.');
        { const k = G.enemies.length; G.enemies.forEach(e => e.hurt(999999, 1, G, true)); G.spawns.length = 0; this.ok('Xoá sạch ' + k + ' quái.'); }
        break;
      case 'skip': case 'qua':
        if (!playing) return this.no('Chỉ dùng khi đang chơi.');
        G.enemies.forEach(e => e.dead = true); G.spawns.length = 0; G.boss = null;
        G.ui.boss(false); G.bossPending = false;
        if (G.levelIdx + 1 < LEVELS.length) { G.loadLevel(G.levelIdx + 1); this.ok('Sang ải ' + (G.levelIdx + 1) + '.'); }
        else { G.over(true); this.ok('Đã ở ải cuối — cho phá đảo luôn.'); }
        break;
      case 'lv': case 'ai':
        if (!(n >= 1 && n <= LEVELS.length)) return this.no('Dùng: lv 1..' + LEVELS.length);
        if (!h) G.newGame(G.diffIdx ?? 1);
        G.loadLevel(n - 1); this.ok('Nhảy tới ' + LEVELS[n - 1].name); break;
      case 'boss':
        if (!playing) return this.no('Chỉ dùng khi đang chơi.');
        if (G.boss) return this.no('Boss đang có mặt.');
        G.enemies.forEach(e => e.dead = true); G.spawns.length = 0;
        G.summonBoss(); this.ok('Đã triệu hồi Hắc Long Vương.'); break;
      case 'nuke':
        if (!G.boss) return this.no('Không có boss.');
        G.boss.invT = 0; G.boss.hurt(999999, 1, G, true); this.ok('Boss bay màu.'); break;
      case 'win':
        if (!playing) return this.no('Chỉ dùng khi đang chơi.');
        G.over(true); this.ok('Phá đảo (test).'); break;
      case 'spawn': {
        if (!playing) return this.no('Chỉ dùng khi đang chơi.');
        const type = (a[1] || '').toLowerCase();
        if (!EDEF[type]) return this.no('Loại hợp lệ: ' + Object.keys(EDEF).join(', '));
        const c = clamp(parseInt(a[2]) || 1, 1, 20);
        for (let i = 0; i < c; i++) G.spawnAt(h.x + rand(-380, 380), type, G.levelIdx, .2 + i * .1);
        this.ok('Sinh ' + c + ' × ' + EDEF[type].name); break;
      }
      case 'diff': case 'dokho':
        if (!(n >= 1 && n <= DIFFS.length)) return this.no('Dùng: diff 1..4 (1 dễ → 4 ác mộng)');
        G.diffIdx = n - 1; G.diff = DIFFS[n - 1]; NIGHTMARE = !!G.diff.hazard;
        if (h) { h.maxHp = G.diff.heroHp; h.hp = Math.min(h.hp, h.maxHp); }
        if (playing) {
          HAZARD_KIND = G.diff.hazard ? (G.level.hazard || null) : null;
          G.plats = (HAZARD_KIND === 'lava' && G.level.platN) ? G.level.platN : G.level.plat;
          G.hz = new Hazards(G);
        }
        Music.setTense(!!G.diff.hazard);
        G.ui.setDiff(G.diff); this.ok('Độ khó → ' + G.diff.name); break;
      case 'dmg':
        if (!(n > 0)) return this.no('Dùng: dmg 5   (nhân 5 lần sát thương kiếm)');
        CHEAT.dmgMul = clamp(n, .1, 999); this.ok('Sát thương ×' + CHEAT.dmgMul); GAME.ui.cheatBadge(); break;
      case 'speed': case 'toc':
        if (!(n > 0)) return this.no('Dùng: speed 0.5   (0.2 – 3)');
        CHEAT.speed = clamp(n, .2, 3); this.ok('Tốc độ game ×' + CHEAT.speed); GAME.ui.cheatBadge(); break;
      case 'score': case 'diem':
        if (!playing) return this.no('Chỉ dùng khi đang chơi.');
        G.score += Math.round(n || 1000); G.ui.setScore(G.score); this.ok('Điểm hiện tại: ' + G.score); break;
      /* ba lệnh dưới đây đổi hẳn loại bẫy đang chạy, để test từng loại ở bất kỳ ải nào */
      case 'lava': case 'nham': case 'meteor': case 'thienthach': case 'spike': case 'chong': {
        if (!playing) return this.no('Chỉ dùng khi đang chơi.');
        const kind = { lava: 'lava', nham: 'lava', meteor: 'meteor', thienthach: 'meteor', spike: 'spike', chong: 'spike' }[cmd];
        if (!G.hz) return this.no('Chưa vào ván.');
        if (G.hz.kind !== kind) { G.hz = G.hz.setKind(kind); HAZARD_KIND = kind; NIGHTMARE = true; }
        G.hz.grace = 0;
        if (kind === 'lava') { G.hz.phase = 'rise'; G.hz.lavaT = 0; }
        if (kind === 'meteor')
          for (let i = 0; i < 3; i++) G.hz.warns.push({ x: clamp(h.x + rand(-300, 300), 70, G.level.w - 70), t: 1.35 });
        this.ok(HZ_INFO[kind].ic + ' ' + HZ_INFO[kind].name + ' đang chạy.'); break;
      }
      case 'hazard': case 'bay_':
        if (!G.hz) return this.no('Chưa vào ván.');
        if (G.hz.on) { G.hz.on = false; HAZARD_KIND = null; NIGHTMARE = false; this.ok('Bẫy địa hình: TẮT'); }
        else {
          const kind = G.level.hazard || 'spike';
          G.hz = G.hz.setKind(kind); HAZARD_KIND = kind; NIGHTMARE = true;
          this.ok('Bẫy địa hình: BẬT · ' + HZ_INFO[kind].name + ' (bẫy mặc định của ải này)');
        }
        break;
      case 'gold': case 'vang':
        if (!playing && G.state !== 'shop') return this.no('Chỉ dùng khi đang chơi.');
        G.addGold(Math.round(n || 1000)); this.ok('Vàng hiện có: ' + G.gold); break;
      case 'shop': case 'nangcap':
        if (!G.hero) return this.no('Chưa vào ván.');
        G.shopCard(); this.ok('Mở bảng nâng cấp.'); break;
      case 'stun': case 'choang':
        if (!G.hero) return this.no('Chưa vào ván.');
        G.hero.stunT = 1.5; this.ok('Tự gây choáng 1.5s để test.'); break;
      case 'clear': case 'cls':
        this.log.replaceChildren(); break;
      case 'reset':
        CHEAT.god = CHEAT.noclip = CHEAT.infMp = CHEAT.godMode = false; CHEAT.speed = 1; CHEAT.dmgMul = 1;
        GAME.ui.cheatBadge(); GAME.ui.godBadge(); this.ok('Đã tắt hết cheat.'); break;
      default:
        this.no('Không có lệnh "' + cmd + '". Gõ  help.');
    }
  }
};

/* Bảng lệnh có nhóm — dùng chung cho cả `help`, danh sách bấm được và gợi ý gõ.
   `run` = chạy được ngay khi bấm · `fill` = chỉ điền vào ô nhập vì còn thiếu tham số. */
const CHEAT_GROUPS = [
  { name: 'NHÂN VẬT', col: '#4ade80', items: [
    { c: 'god',    k: 'G · F2', d: 'GOD MODE — bất tử + vô hạn MP + ULT đầy + sát thương ×' + GOD_DMG, run: 1 },
    { c: 'inv',           d: 'chỉ bất tử, không kèm gì khác', run: 1 },
    { c: 'heal',   k: 'F3', d: 'hồi đầy HP + MP',       run: 1 },
    { c: 'mp',            d: 'nội lực vô hạn',          run: 1 },
    { c: 'ult',    k: 'F4', d: 'nạp đầy tuyệt kỹ',      run: 1 },
    { c: 'noclip', k: 'F8', d: 'bay xuyên địa hình',    run: 1 },
    { c: 'stun',          d: 'tự gây choáng để xem hiệu ứng', run: 1 }
  ]},
  { name: 'MÀN CHƠI', col: '#67e8f9', items: [
    { c: 'kill',   k: 'F5', d: 'xoá sạch quái trên màn', run: 1 },
    { c: 'skip',   k: 'F6', d: 'qua ải hiện tại',        run: 1 },
    { c: 'lv',            d: 'nhảy tới ải 1–3',   arg: '1..3', fill: 'lv ' },
    { c: 'boss',   k: 'F7', d: 'triệu hồi Hắc Long Vương', run: 1 },
    { c: 'nuke',          d: 'hạ boss tức thì',          run: 1 },
    { c: 'win',           d: 'phá đảo luôn',             run: 1 },
    { c: 'spawn',         d: 'sinh quái',  arg: '<loại> [số]', fill: 'spawn ' }
  ]},
  { name: 'BẪY ĐỊA HÌNH', col: '#ff9a4a', items: [
    { c: 'spike',         d: 'bật bẫy chông (ải I)',      run: 1 },
    { c: 'meteor',        d: 'gọi 3 thiên thạch (ải II)', run: 1 },
    { c: 'lava',          d: 'kích nham thạch dâng (ải III)', run: 1 },
    { c: 'hazard',        d: 'bật/tắt bẫy ở mọi độ khó',  run: 1 }
  ]},
  { name: 'CHỈ SỐ', col: '#fbbf24', items: [
    { c: 'diff',          d: 'đổi độ khó',  arg: '1..4',  fill: 'diff ' },
    { c: 'dmg',           d: 'nhân sát thương kiếm', arg: '5', fill: 'dmg ' },
    { c: 'speed',         d: 'tốc độ game', arg: '0.2–3', fill: 'speed ' },
    { c: 'score',         d: 'cộng điểm',   arg: '5000',  fill: 'score ' },
    { c: 'gold',          d: 'cộng vàng',   arg: '2000',  fill: 'gold ' },
    { c: 'shop',          d: 'mở bảng nâng cấp',          run: 1 }
  ]},
  { name: 'BẢNG LỆNH', col: '#a78bfa', items: [
    { c: 'help',          d: 'in lại toàn bộ danh sách',  run: 1 },
    { c: 'reset',         d: 'tắt toàn bộ cheat',         run: 1 },
    { c: 'clear',         d: 'xoá nhật ký',               run: 1 }
  ]}
];
const CHEAT_NAMES = CHEAT_GROUPS.flatMap(g => g.items.map(i => i.c));

/* phím tắt F1–F8 */
addEventListener('keydown', e => {
  const F = { F1: 'toggle', F2: 'god', F3: 'heal', F4: 'ult', F5: 'kill', F6: 'skip', F7: 'boss', F8: 'noclip' }[e.code];
  if (!F) { if (e.code === 'Backquote' && !Input.lock) { e.preventDefault(); CheatBox.open(); } return; }
  e.preventDefault();
  if (F === 'toggle') CheatBox.open(); else CheatBox.run(F);
}, { passive: false });
