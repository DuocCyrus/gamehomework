/* ═══ 15. GIAO DIỆN — Ch.13 Document Object Model ═══
   Toàn bộ HUD được truy vấn, dựng mới và cập nhật bằng DOM API thuần. */
const $ = s => document.querySelector(s);
const el = (tag, cls, txt) => { const n = document.createElement(tag); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; };

const UPGRADES = [
  { id: 'atk', ic: '⚔', name: 'Kiếm Pháp', max: 5, cost: i => 120 + i * 95,
    desc: i => 'Sát thương kiếm +' + ((i + 1) * 15) + '%',
    apply: h => { h.up.atk++; h.atkMul = 1 + h.up.atk * .15; } },
  { id: 'hp', ic: '❤', name: 'Thể Phách', max: 5, cost: i => 110 + i * 85,
    desc: i => 'Máu tối đa +' + ((i + 1) * 25),
    apply: h => { h.up.hp++; h.maxHp += 25; h.hp += 25; } },
  { id: 'sh', ic: '◈', name: 'Khí Thuẫn', max: 5, cost: i => 130 + i * 95,
    desc: i => 'Khiên tối đa +' + ((i + 1) * 25),
    apply: h => { h.up.sh++; h.maxSh += 25; h.sh = h.maxSh; } },
  { id: 'mp', ic: '✦', name: 'Nội Lực', max: 5, cost: i => 100 + i * 78,
    desc: i => 'MP tối đa +' + ((i + 1) * 20) + ', hồi nhanh hơn',
    apply: h => { h.up.mp++; h.maxMp += 20; h.mp = h.maxMp; } },
  { id: 'agi', ic: '»', name: 'Thân Pháp', max: 5, cost: i => 110 + i * 80,
    desc: i => 'Tốc chạy +' + ((i + 1) * 8) + '%, hồi lướt nhanh hơn',
    apply: h => { h.up.agi++; h.spdMul = 1 + h.up.agi * .08; } },
  { id: 'revive', ic: '✚', name: 'Hồi Sinh Đan', max: 1, cost: () => 480,
    desc: () => 'Gục ngã một lần sẽ tự đứng dậy với 60% máu',
    apply: h => { h.up.revive = 1; } }
];

const SKILLS = [
  { ic: '⚔', key: 'J', name: 'Liên Trảm', desc: 'Chuỗi 3 nhát, nhát cuối hất tung' },
  { ic: '»', key: '⇧', name: 'Ảnh Bộ', desc: 'Lướt nhanh, miễn thương trong lúc lướt' },
  { ic: '✦', key: 'L', name: 'Băng Phù', desc: 'Bắn kiếm khí theo hướng chuột · 24 MP' },
  { ic: '★', key: 'E', name: 'Thiên Kiếm Trảm', desc: 'Chém toàn màn hình khi ULT đầy' },
  { ic: '◈', key: 'K', name: 'Khí Thuẫn', desc: 'Giữ để đỡ — bấm đúng lúc để phản đòn' }
];

class UI {
  constructor() {
    this.hpF = $('.bar.hp .fill'); this.hpG = $('.bar.hp .ghost'); this.hpT = $('#hpTxt');
    this.mpF = $('.bar.mp .fill'); this.mpT = $('#mpTxt');
    this.enB = $('.bar.en'); this.enF = $('.bar.en .fill'); this.enT = $('#enTxt');
    this.score = $('#score'); this.comboBox = $('#comboBox'); this.combo = $('#combo');
    this.levelName = $('#levelName'); this.dots = $('#waveDots');
    this.bossBar = $('#bossBar'); this.bossF = $('#bossBar .fill'); this.bossG = $('#bossBar .ghost');
    this.overlay = $('#overlay'); this.banner = $('#banner');
    this.skillEls = [];
    this.diffTag = el('div', 'difftag'); this.cheatTag = el('div', 'cheattag');
    $('.hud-top').prepend(this.diffTag);
    $('#hud').append(this.cheatTag);
    this.godTag = el('div', 'godtag');                       // huy hiệu GOD MODE
    this.godTag.append(el('b', null, '⛨'), el('span', null, 'GOD MODE'), el('u', null, 'G để tắt'));
    $('#hud').append(this.godTag);
    const shBar = el('div', 'bar sh');                       // thanh khí thuẫn
    shBar.append(el('i', 'fill'), el('b', null, 'KHIÊN'), el('span', null, '60/60'));
    $('.bars').insertBefore(shBar, $('.bar.en'));
    this.shF = shBar.querySelector('.fill'); this.shT = shBar.querySelector('span'); this.shB = shBar;
    const goldBox = el('div', 'stat gold');                  // ví vàng
    goldBox.append(el('small', null, 'VÀNG'), el('strong', null, '0'));
    $('.hud-right').insertBefore(goldBox, $('#comboBox'));
    this.goldEl = goldBox.querySelector('strong');
    const box = $('#skills');
    SKILLS.forEach(s => {                                  // dựng thanh kỹ năng bằng DOM
      const n = el('div', 'skill ready');
      n.append(el('span', 'ic', s.ic), el('span', 'key', s.key), el('i', 'cd'));
      n.title = s.name + ' — ' + s.desc;
      box.append(n); this.skillEls.push(n);
    });
  }
  setDiff(d) {
    this.diffTag.textContent = d.name;
    this.diffTag.style.setProperty('--dc', d.col);
  }
  godBadge() { this.godTag.classList.toggle('on', CHEAT.godMode); }
  cheatBadge() {
    const on = [];
    // khi GOD MODE bật thì đã có huy hiệu riêng — chỉ liệt kê cheat bật thêm bằng tay
    if (CHEAT.god && !CHEAT.godMode) on.push('BẤT TỬ');
    if (CHEAT.noclip) on.push('BAY');
    if (CHEAT.infMp && !CHEAT.godMode) on.push('VÔ HẠN MP');
    if (CHEAT.dmgMul !== 1 && !(CHEAT.godMode && CHEAT.dmgMul === GOD_DMG)) on.push('DMG ×' + CHEAT.dmgMul);
    if (CHEAT.speed !== 1) on.push('TỐC ×' + CHEAT.speed);
    this.cheatTag.textContent = on.length ? 'CHEAT · ' + on.join(' · ') : '';
    this.cheatTag.classList.toggle('on', on.length > 0);
    CheatBox.statusUpdate();          // đồng bộ dải trạng thái trong bảng lệnh
  }
  bars(h) {
    const hp = h.hp / h.maxHp * 100;
    this.hpF.style.width = hp + '%'; this.hpG.style.width = hp + '%';
    this.hpT.textContent = Math.ceil(h.hp) + '/' + h.maxHp;
    this.mpF.style.width = (h.mp / h.maxMp * 100) + '%';
    this.mpT.textContent = Math.ceil(h.mp) + '/' + h.maxMp;
    this.enF.style.width = h.energy + '%';
    this.enT.textContent = Math.floor(h.energy) + '%';
    this.enB.classList.toggle('full', h.energy >= 100);
    this.shF.style.width = (h.sh / h.maxSh * 100) + '%';
    this.shT.textContent = Math.ceil(h.sh) + '/' + h.maxSh;
    this.shB.classList.toggle('broke', h.brokeT > 0);
    this.shB.classList.toggle('up', h.blocking);
    this.skillEls[4].classList.toggle('locked', h.brokeT > 0);
    this.skillEls[1].querySelector('.cd').style.transform = 'scaleY(' + (h.dashCd / .75) + ')';
    this.skillEls[2].querySelector('.cd').style.transform = 'scaleY(' + Math.max(h.magicCd / .42, h.mp < 24 ? 1 : 0) + ')';
    this.skillEls[3].classList.toggle('locked', h.energy < 100);
  }
  setLevel(lv, waveCount, hasBoss) {
    this.levelName.textContent = lv.name;
    this.dots.replaceChildren();
    for (let i = 0; i < waveCount; i++) this.dots.append(el('i'));
    if (hasBoss) { const b = el('i'); b.style.width = '2.6em'; this.dots.append(b); }
  }
  setWave(i) {
    [...this.dots.children].forEach((d, k) => {
      d.classList.toggle('on', k < i); d.classList.toggle('cur', k === i);
    });
  }
  boss(show, hp, max) {
    this.bossBar.classList.toggle('hidden', !show);
    if (show) { const w = hp / max * 100 + '%'; this.bossF.style.width = w; this.bossG.style.width = w; }
  }
  phases(p) { [...$('#bossBar .phases').children].forEach((n, i) => n.classList.toggle('on', i <= p)); }
  setScore(v) { this.score.textContent = v.toLocaleString('vi-VN'); }
  setGold(v) { this.goldEl.textContent = v.toLocaleString('vi-VN'); }
  setCombo(c) {
    this.comboBox.classList.toggle('show', c >= 2);
    this.combo.textContent = 'x' + c;
  }
  flashBanner(t1, t2) {
    this.banner.querySelector('.t1').textContent = t1;
    this.banner.querySelector('.t2').textContent = t2 || '';
    this.banner.classList.remove('play'); void this.banner.offsetWidth; this.banner.classList.add('play');
  }
  show(html) { this.overlay.innerHTML = '<div class="card">' + html + '</div>'; this.overlay.classList.add('on');
    const b = this.overlay.querySelector('.btn'); if (b) b.focus(); }
  hide() { this.overlay.classList.remove('on'); this.overlay.replaceChildren(); }
}

/* ═══ 16. QUẢN LÝ GAME ═══ */
class Game extends EventTarget {                 // dùng CustomEvent — Ch.15
  constructor(canvas) {
    super();
    this.cv = canvas; this.ctx = canvas.getContext('2d');
    this.ui = new UI();
    this.state = 'menu';
    this.best = 0;
    this.bindUI();
    this.addEventListener('wave:clear', e => {
      if (!e.detail.last) this.ui.flashBanner('ĐỢT ' + (e.detail.next + 1), 'CHUẨN BỊ');
    });
    this.addEventListener('level:clear', () => Sfx.win());
  }

  /* ---------- luồng màn chơi ---------- */
  newGame(diffIdx) {
    if (diffIdx != null) this.diffIdx = diffIdx;
    this.diff = DIFFS[this.diffIdx ?? 1];
    NIGHTMARE = !!this.diff.hazard;
    this.score = 0; this.combo = 0; this.comboT = 0; this.kills = 0; this.time = 0;
    this.gold = 0; this.quakeT = 0; this.endT = null; this.crashed = false;
    this.levelIdx = 0;
    this.hero = new Hero(160, this.diff);
    this.ui.setGold(0);
    this.ui.setDiff(this.diff);
    this.ui.godBadge();               // GOD MODE giữ nguyên qua mỗi lần chơi lại
    this.loadLevel(0);
  }
  diffCard() {
    this.state = 'menu';
    /* Bốn chỉ số quan trọng nhất, quy về thang 5 vạch để so sánh bằng mắt */
    const METERS = [
      { k: 'MÁU QUÁI', v: d => d.hpMul / 2.2 },
      { k: 'SÁT THƯƠNG', v: d => d.dmgMul / 2 },
      { k: 'SỐ LƯỢNG', v: d => d.cntMul / 2 },
      { k: 'VẬT PHẨM', v: d => d.drop / .45 }
    ];
    const pips = f => { const n = Math.round(clamp(f, 0, 1) * 5); let s = ''; for (let i = 0; i < 5; i++) s += '<i' + (i < n ? ' class="on"' : '') + '></i>'; return s; };
    const list = DIFFS.map((d, i) => {
      const meters = METERS.map(m =>
        '<span class="dm"><small>' + m.k + '</small><span class="pips">' + pips(m.v(d)) + '</span></span>').join('');
      const hazards = d.hazard
        ? '<span class="dhz">' + LEVELS.map((L, k) => {
            const hz = HZ_INFO[L.hazard]; if (!hz) return '';
            return '<i style="--hc:' + hz.col + '">' + hz.ic + ' ẢI ' + (k + 1) + ' · ' + hz.name + '</i>';
          }).join('') + '</span>'
        : '';
      return '<button class="diffbtn" data-act="diff" data-i="' + i + '" style="--dc:' + d.col + '">' +
        '<span class="dnum">' + (i + 1) + '</span>' +
        '<span class="dn">' + d.name + '</span><span class="ds">' + d.sub + '</span>' +
        '<span class="dhp">MÁU KHỞI ĐẦU ' + d.heroHp + ' · ĐIỂM ×' + d.scoreMul + '</span>' +
        '<span class="dmeters">' + meters + '</span>' +
        '<span class="dd">' + d.desc + '</span>' + hazards + '</button>';
    }).join('');
    this.ui.show(
      '<div class="eyebrow">CHỌN ĐƯỜNG TU LUYỆN</div><h2>ĐỘ KHÓ</h2>' +
      '<p class="hint">Bấm số <kbd>1</kbd>–<kbd>4</kbd> để chọn nhanh. Vạch càng đầy thì quái càng mạnh — riêng VẬT PHẨM càng đầy càng có lợi cho bạn.</p>' +
      '<div class="difflist">' + list + '</div>' +
      '<div class="optrow">' +
      '<button class="opt god' + (CHEAT.godMode ? ' on' : '') + '" data-act="god">⛨ GOD MODE · ' +
      (CHEAT.godMode ? 'BẬT' : 'TẮT') + '</button>' +
      '<span class="opt flat">bật trước khi vào để test thẳng</span>' +
      '</div>' +
      '<div class="row"><button class="btn ghost" data-act="menu">QUAY LẠI</button></div>');
  }
  loadLevel(i) {
    this.levelIdx = i;
    this.level = LEVELS[i];
    HAZARD_KIND = this.diff.hazard ? (this.level.hazard || null) : null;
    // chỉ ải nham thạch mới cần bộ bệ đá cao — hai ải kia giữ địa hình gốc
    this.plats = (HAZARD_KIND === 'lava' && this.level.platN) ? this.level.platN : this.level.plat;
    this.enemies = []; this.shots = []; this.drops = []; this.spawns = [];
    this.boss = null; this.waveIdx = 0; this.waveT = 1.2; this.bossPending = !!this.level.boss;
    this.hero.x = 160; this.hero.y = GROUND; this.hero.vx = this.hero.vy = 0;
    this.hero.hp = Math.min(this.hero.maxHp, this.hero.hp + 30);
    this.hero.mp = this.hero.maxMp; this.hero.alive = true;
    this.hero.sh = this.hero.maxSh; this.hero.brokeT = 0; this.hero.stunT = 0; this.quakeT = 0;
    this.hz = new Hazards(this);
    cam.x = 0;
    this.ui.setLevel(this.level, this.level.waves.length, !!this.level.boss);
    this.ui.setWave(0); this.ui.boss(false);
    this.storyCard();
  }
  storyCard() {
    this.state = 'story';
    const L = this.level;
    const hz = this.diff.hazard ? HZ_INFO[L.hazard] : null;
    this.ui.show(
      '<div class="eyebrow">CHƯƠNG ' + (this.levelIdx + 1) + ' / ' + LEVELS.length + '</div>' +
      '<h2>' + L.name + '</h2>' +
      '<p class="lore">' + L.lore + '</p>' +
      (hz ? '<div class="hzcall" style="--hc:' + hz.col + '">' +
        '<b>' + hz.ic + '</b><span class="hzn">BẪY CỦA ẢI NÀY · ' + hz.name + '</span>' +
        '<span class="hzt">' + hz.tip + '</span>' +
        '<span class="hzg">Bẫy nghỉ ' + HZ_GRACE.toFixed(1).replace('.', ',') + ' giây đầu ải để bạn kịp định vị.</span></div>' : '') +
      '<div class="row"><button class="btn" data-act="go">VÀO ẢI</button></div>' +
      '<p class="hint">Nhấn <kbd>Enter</kbd> để vào ngay.</p>');
  }
  begin() {
    this.ui.hide(); this.state = 'play';
    Music.play(this.level.theme);              // mỗi ải một chủ đề nhạc riêng
    Music.setTense(!!this.diff.hazard);
    this.ui.flashBanner(this.level.name.split('—')[1].trim(), 'ĐỢT 1');
    this.spawnWave();
    // nhắc loại bẫy của ải này ngay sau banner mở màn
    const hz = this.hz && this.hz.info;
    if (hz) setTimeout(() => { if (this.state === 'play') this.ui.flashBanner(hz.ic + ' ' + hz.name, hz.sub); }, 2400);
  }
  spawnWave() {
    const w = this.level.waves[this.waveIdx];
    if (!w) return;
    this.ui.setWave(this.waveIdx);
    let slot = 0;
    for (const [type, n0] of w) {
      const n = Math.max(1, Math.round(n0 * this.diff.cntMul));
      for (let k = 0; k < n; k++) {
        const x = clamp(this.hero.x + (slot % 2 ? 1 : -1) * rand(340, 900) + rand(-60, 60), 90, this.level.w - 90);
        this.spawnAt(x, type, this.levelIdx, .35 + slot * .14);
        slot++;
      }
    }
  }
  spawnAt(x, type, tier, delay = .3) {
    this.spawns.push({ x: clamp(x, 80, this.level.w - 80), type, tier, t: delay, max: delay + .55 });
  }
  onKill(e) {
    this.kills++;
    this.combo++; this.comboT = 2.4;
    const mult = 1 + Math.floor(this.combo / 5) * .25;
    this.score += Math.round(e.pts * mult * this.diff.scoreMul);
    this.hero.gain(6);
    this.ui.setScore(this.score); this.ui.setCombo(this.combo);
    if (this.combo > 0 && this.combo % 5 === 0) floatTxt(this.hero.x, this.hero.y - 90, 'COMBO x' + this.combo, '#fbbf24', true);
    if (Math.random() < this.diff.drop) this.drops.push(new Drop(e.x, e.y - 20, Math.random() < .62 ? 'hp' : 'mp'));
    if (Math.random() < .45) this.drops.push(new Drop(e.x + rand(-14, 14), e.y - 20, 'gold'));
  }
  ultimate() {
    const h = this.hero;
    h.energy = 0; h.invT = 1.15;
    Sfx.ult(); cam.kick(26); cam.bang('rgba(230,245,255,.85)', 1.25);
    this.ui.flashBanner('THIÊN KIẾM TRẢM', '');
    for (let i = 0; i < 7; i++) ring(h.x + rand(-260, 260), rand(160, GROUND), '#a5f3fc', 4, rand(90, 220), .55, 5);
    spark(h.x, h.y - 40, 46, '#eaffff', 620);
    const targets = this.enemies.filter(e => Math.abs(e.x - h.x) < 620);
    for (const e of targets) e.hurt(Math.round(95 * h.atkMul), sign(e.x - h.x), this, true);
    if (this.boss && Math.abs(this.boss.x - h.x) < 700) this.boss.hurt(Math.round(150 * h.atkMul), sign(this.boss.x - h.x), this, true);
  }
  banner(a, b) { this.ui.flashBanner(a, b); }

  over(win) {
    if (this.state === 'win' || this.state === 'dead') return;
    this.state = win ? 'win' : 'dead';
    this.endT = win ? 1.9 : 1.1;      // đếm bằng vòng lặp game, không dùng setTimeout
    Music.setTense(false);
    if (win) {
      Music.play('victory');
      Sfx.win(); cam.bang('rgba(255,255,255,.9)', 1.4); cam.kick(26);
      const bx = this.boss ? this.boss.x : this.hero.x;
      for (let i = 0; i < 26; i++) ring(bx + rand(-140, 140), rand(180, GROUND), pick(['#fde68a', '#f0abfc', '#a5f3fc']), 4, rand(60, 200), .8, 5);
      this.score += 3000;
    } else { Sfx.lose(); Music.stop(); }
    this.best = Math.max(this.best, this.score);
  }

  /** Bộ đếm chạy mọi lúc, kể cả khi update() đã dừng — bảng kết thúc không thể bị mất */
  tickTimers(dt) {
    this.quakeT = Math.max(0, (this.quakeT || 0) - dt);
    if (this.quakeT > 0) cam.shake = Math.max(cam.shake, 11 * this.quakeT);
    if (this.state === 'win' || this.state === 'dead') {
      if (this.endT != null) {
        this.endT -= dt;
        if (this.endT <= 0) { this.endT = null; this.endCard(this.state === 'win'); }
      } else if (!this.ui.overlay.classList.contains('on')) {
        this.watchT = (this.watchT || 0) + dt;      // chốt chặn chống treo
        if (this.watchT > 1.5) { this.watchT = 0; this.endCard(this.state === 'win'); }
      }
    } else this.watchT = 0;
  }

  /** Bắt mọi ngoại lệ để vòng lặp không bao giờ chết */
  crash(err) {
    console.error('[HVK]', err);
    try { CheatBox.say('✘ LỖI: ' + (err && err.message), '#fb7185'); } catch (e) { /* bỏ qua */ }
    if (this.crashed) return;
    this.crashed = true;
    this.state = 'error';
    try {
      this.ui.show('<div class="eyebrow">SỰ CỐ</div><h2>ĐÃ BẮT ĐƯỢC LỖI</h2>' +
        '<p>Game không bị treo — vòng lặp vẫn chạy. Bạn có thể tiếp tục hoặc chơi lại.</p>' +
        '<p class="lore">' + String((err && err.message) || err).slice(0, 220) + '</p>' +
        '<div class="row"><button class="btn" data-act="resumeErr">TIẾP TỤC</button>' +
        '<button class="btn ghost" data-act="restart">CHƠI LẠI</button>' +
        '<button class="btn ghost" data-act="menu">MÀN HÌNH CHÍNH</button></div>');
    } catch (e) { /* bỏ qua */ }
  }
  endCard(win) {
    const m = Math.floor(this.time / 60), s = Math.floor(this.time % 60);
    this.ui.show(
      '<div class="eyebrow">' + (win ? 'PHÁ ĐẢO' : 'THẤT BẠI') + '</div>' +
      '<h1>' + (win ? 'HẮC LONG ĐÃ GỤC' : 'KIẾM SĨ NGÃ XUỐNG') + '</h1>' +
      '<p>' + (win
        ? 'Lõi Hắc Long vỡ tan thành tro. Rừng Tử Khí sáng trở lại lần đầu sau ba trăm năm.'
        : 'Bóng tối nuốt chửng ánh kiếm. Nhưng huyền thoại chưa kết thúc — hãy đứng dậy.') + '</p>' +
      '<div class="stats-grid">' +
      '<div><small>ĐIỂM</small><strong>' + this.score.toLocaleString('vi-VN') + '</strong></div>' +
      '<div><small>HẠ GỤC</small><strong>' + this.kills + '</strong></div>' +
      '<div><small>THỜI GIAN</small><strong>' + m + ':' + String(s).padStart(2, '0') + '</strong></div>' +
      '</div>' +
      '<div class="row"><button class="btn" data-act="restart">CHƠI LẠI · ' + this.diff.name + '</button>' +
      '<button class="btn ghost" data-act="again">ĐỔI ĐỘ KHÓ</button>' +
      '<button class="btn ghost" data-act="menu">MÀN HÌNH CHÍNH</button></div>');
  }
  menuCard() {
    this.state = 'menu';
    this.ui.boss(false);
    Music.play('menu'); Music.setTense(false);
    HAZARD_KIND = null; NIGHTMARE = false;
    const route = LEVELS.map((L, i) => {
      const hz = HZ_INFO[L.hazard];
      return '<div class="rt" style="--tc:' + THEMES[L.theme].accent + '">' +
        '<b>ẢI ' + ['I', 'II', 'III'][i] + '</b>' +
        '<span>' + L.name.split('—')[1].trim() + '</span>' +
        (hz ? '<i style="--hc:' + hz.col + '">' + hz.ic + ' ' + hz.name + '</i>' : '') +
        '</div>';
    }).join('');
    this.ui.show(
      '<div class="eyebrow">VƯỢT ẢI · DIỆT QUÁI · PHÁ ĐẢO</div>' +
      '<h1>HẮC VÂN KIẾM</h1>' +
      '<p>Ba ải. Năm loài quái. Một Hắc Long Vương. Kiếm sĩ cuối cùng của Vọng Lâm bước vào bóng tối với một thanh kiếm và không có đường lui.</p>' +
      '<div class="route">' + route + '</div>' +
      '<p class="hint">Bẫy trong ngoặc chỉ xuất hiện ở độ khó <b style="color:#f43f5e">ÁC MỘNG</b> — mỗi ải một loại.</p>' +

      `back` nhớ nơi vừa mở nó, để bấm QUAY LẠI khi đang tạm dừng không làm mất ván. */
  helpCard(back = 'menu') {

    if (back === 'menu') this.state = 'menu';
    const keyRow = (label, keys, desc) =>

    const hzRow = LEVELS.map((L, i) => {
      const hz = HZ_INFO[L.hazard]; if (!hz) return '';
      return '<div class="hzr" style="--hc:' + hz.col + '"><b>' + hz.ic + '</b>' +
        '<span class="hzn">ẢI ' + (i + 1) + ' · ' + hz.name + '</span>' +
        '<span class="hzt">' + hz.tip + '</span></div>';
    }).join('');
    this.ui.show(
      '<div class="eyebrow">SỔ TAY KIẾM SĨ</div><h2>HƯỚNG DẪN</h2>' +
      '<div class="helpgrid">' +
      '<section><h3>DI CHUYỂN</h3>' +
      keyRow('Chạy', ['A', 'D'], 'hoặc ← →') +
      keyRow('Nhảy đôi', ['W', 'Space'], 'nhấn hai lần để nhảy tiếp') +
      keyRow('Rơi xuyên bệ', ['S', 'Space'], 'giữ S rồi nhảy') +
      '</section>' +
      '<section><h3>CHIẾN ĐẤU</h3>' +
      keyRow('Liên trảm', ['J', 'Chuột'], '3 nhát, nhát cuối hất tung') +
      keyRow('Ảnh bộ', ['Shift'], 'lướt né, miễn thương khi lướt') +
      keyRow('Khí thuẫn', ['K', 'Chuột phải'], 'giữ để đỡ đòn phía trước') +
      keyRow('Băng phù', ['L'], 'bắn kiếm khí · 24 MP') +
      keyRow('Thiên Kiếm Trảm', ['E'], 'toàn màn hình khi ULT đầy') +
      '</section>' +
      '<section><h3>HỆ THỐNG</h3>' +
      keyRow('Tạm dừng', ['Esc'], 'mở lại bảng nghỉ tay') +
      keyRow('Tắt / bật âm', ['M'], 'toàn bộ âm thanh') +
      keyRow('Nhạc nền', ['N'], 'chỉ tắt nhạc, giữ tiếng đánh') +
      keyRow('GOD MODE', ['G', 'F2'], 'bất tử + vô hạn MP + ULT đầy + sát thương ×' + GOD_DMG) +
      keyRow('Bảng lệnh', ['`', 'F1'], 'danh sách cheat đầy đủ') +
      '</section>' +
      '<section><h3>ĐỠ ĐÒN</h3>' +
      '<p class="mini"><b>Đỡ thường</b> — chặn 100% sát thương từ phía trước, trừ vào thanh KHIÊN. Đánh sau lưng thì không đỡ được.</p>' +
      '<p class="mini"><b>Đỡ hoàn mỹ</b> — bấm đỡ trong 0,22 giây trước khi trúng đòn: không mất khiên, cộng ULT, bắn ngược đạn với 190% sát thương.</p>' +
      '<p class="mini"><b>Vỡ khiên</b> — hết khiên thì choáng 0,55 giây và cấm đỡ 1,4 giây.</p>' +
      '</section>' +
      '</div>' +
      '<div class="hzbox"><div class="hzhead">BẪY ĐỊA HÌNH · CHỈ Ở ÁC MỘNG</div>' + hzRow + '</div>' +
      '<div class="row">' +
      (back === 'pause'
        ? '<button class="btn" data-act="helpback">TRỞ LẠI VÁN</button>'
        : '<button class="btn" data-act="pickdiff">CHỌN ĐỘ KHÓ</button>' +
          '<button class="btn ghost" data-act="menu">QUAY LẠI</button>') +
      '</div>');
  }
  pause(on) {
    if (on && this.state === 'play') {
      this.state = 'pause';
      const hz = this.hz && this.hz.info;
      this.ui.show('<div class="eyebrow">TẠM DỪNG</div><h2>NGHỈ TAY</h2>' +
        '<p>' + this.level.name + ' · Đợt ' + (this.waveIdx + 1) + ' / ' + this.level.waves.length + '</p>' +
        (hz ? '<div class="hzcall" style="--hc:' + hz.col + '"><b>' + hz.ic + '</b>' +
          '<span class="hzn">' + hz.name + '</span><span class="hzt">' + hz.tip + '</span></div>' : '') +
        '<div class="row"><button class="btn" data-act="resume">TIẾP TỤC</button>' +
        '<button class="btn ghost" data-act="help">HƯỚNG DẪN</button>' +
        '<button class="btn danger" data-act="menu">BỎ CUỘC</button></div>' +
        '<div class="optrow">' +
        '<button class="opt god' + (CHEAT.godMode ? ' on' : '') + '" data-act="god">⛨ GOD MODE · ' +
        (CHEAT.godMode ? 'BẬT' : 'TẮT') + '</button>' +
        '<button class="opt" data-act="music">NHẠC NỀN · ' + (Music.enabled ? 'BẬT' : 'TẮT') + '</button>' +
        '<button class="opt" data-act="mute">' + (Sfx.muted ? 'BẬT ÂM' : 'TẮT ÂM') + '</button>' +
        '</div>');
      Music.fade(Music.enabled && !Sfx.muted ? .45 : 0, .3);
    } else if (!on && this.state === 'pause') {
      this.ui.hide(); this.state = 'play';
      Music.fade(Music.enabled && !Sfx.muted ? 1 : 0, .3);
    }
  }

  /* ---------- gắn sự kiện — Ch.15 ---------- */
  bindUI() {
    // uỷ quyền sự kiện: một listener cho mọi nút trong overlay
    this.ui.overlay.addEventListener('click', e => {
      const b = e.target.closest('[data-act]'); if (!b) return;
      Sfx.init();
      // trình duyệt chỉ cho phát âm sau thao tác đầu tiên — bật nhạc menu ngay tại đây
      if (!Music.name && this.state === 'menu') Music.play('menu');
      switch (b.dataset.act) {
        case 'pickdiff': this.diffCard(); break;
        case 'diff': this.newGame(+b.dataset.i); break;
        case 'cheats': this.ui.hide(); this.state = 'menu'; CheatBox.open(true); break;
        case 'start': this.newGame(); break;
        case 'go': this.begin(); break;
        case 'resume': this.pause(false); break;
        case 'restart': this.newGame(); break;
        case 'again': this.diffCard(); break;
        case 'menu': this.crashed = false; this.menuCard(); break;
        case 'resumeErr': this.crashed = false; this.ui.hide(); this.state = this.hero ? 'play' : 'menu'; if (!this.hero) this.menuCard(); break;
        case 'mute': toggleMute(); b.textContent = Sfx.muted ? 'BẬT ÂM' : 'TẮT ÂM'; break;
        case 'music': Music.setEnabled(!Music.enabled); b.textContent = 'NHẠC NỀN · ' + (Music.enabled ? 'BẬT' : 'TẮT'); break;
        case 'god':
          toggleGodMode();
          b.textContent = '⛨ GOD MODE · ' + (CHEAT.godMode ? 'BẬT' : 'TẮT');
          b.classList.toggle('on', CHEAT.godMode);
          break;
        case 'help': this.helpCard(this.state === 'pause' ? 'pause' : 'menu'); break;
        case 'helpback': this.state = 'play'; this.pause(true); break;
        case 'next': this.loadLevel(this.levelIdx + 1); break;
        case 'shop': this.shopCard(); break;
        case 'buy': {
          const u = UPGRADES[+b.dataset.i];
          const lv = u.id === 'revive' ? this.hero.up.revive : this.hero.up[u.id];
          const c = u.cost(lv);
          if (lv >= u.max || this.gold < c) { Sfx.hurt(); break; }
          this.gold -= c; u.apply(this.hero); this.ui.setGold(this.gold);
          Sfx.pickup(); this.shopCard();
          break;
        }
      }
    });
    addEventListener('keydown', e => {
      if (Input.lock) return;
      if (e.code === 'Escape') {
        if (this.state === 'dead' || this.state === 'win') { this.endT = null; this.endCard(this.state === 'win'); }
        else this.pause(this.state === 'play');
      }
      if (e.code === 'KeyM') toggleMute();
      if (e.code === 'KeyN') Music.setEnabled(!Music.enabled);
      if (e.code === 'KeyG') toggleGodMode();            // bật/tắt GOD MODE mọi lúc
      if (e.code === 'Enter' && (this.state === 'story')) this.begin();
      // chọn nhanh độ khó bằng phím số khi bảng độ khó đang mở
      if (/^Digit[1-4]$/.test(e.code) && this.ui.overlay.querySelector('.difflist')) {
        const i = +e.code.slice(5) - 1;
        if (i < DIFFS.length) { Sfx.init(); this.newGame(i); }
      }
    });
    document.addEventListener('visibilitychange', () => { if (document.hidden) this.pause(true); });

    const cv = this.cv;
    const toWorld = ev => {
      const r = cv.getBoundingClientRect();
      Input.mouse.x = (ev.clientX - r.left) * VW / r.width;
      Input.mouse.y = (ev.clientY - r.top) * VH / r.height;
      Input.mouse.wx = Input.mouse.x + cam.x; Input.mouse.wy = Input.mouse.y;
    };
    cv.addEventListener('mousemove', toWorld);
    cv.addEventListener('mousedown', ev => {
      ev.preventDefault(); Sfx.init(); toWorld(ev);
      if (ev.button === 2) { Input.mouse.right = true; return; }       // chuột phải = đỡ
      Input.mouse.down = true; Input.mouse.fresh = true;
      if (this.state === 'dead' || this.state === 'win') { this.endT = null; this.endCard(this.state === 'win'); }
    });
    addEventListener('mouseup', ev => { if (ev.button === 2) Input.mouse.right = false; else Input.mouse.down = false; });
    cv.addEventListener('contextmenu', ev => ev.preventDefault());

    // điều khiển cảm ứng
    const hasTouch = matchMedia('(pointer:coarse)').matches;
    if (hasTouch) $('#touch').classList.add('on');
    const map = { tl: 'left', tr: 'right', tj: 'jump', ta: 'atk', td: 'dash', tm: 'magic', tu: 'ult', tb: 'block' };
    for (const [id, key] of Object.entries(map)) {
      const n = document.getElementById(id);
      n.addEventListener('pointerdown', ev => { ev.preventDefault(); Sfx.init(); Input.pad[key] = 2; n.setPointerCapture(ev.pointerId); });
      n.addEventListener('pointerup', () => { Input.pad[key] = 0; });
      n.addEventListener('pointercancel', () => { Input.pad[key] = 0; });
      n.addEventListener('pointerleave', () => { Input.pad[key] = 0; });
    }
  }

  /* ---------- cập nhật ---------- */
  update(dt) {
    if (this.state !== 'play') return;
    this.time += dt;
    const h = this.hero;
    h.update(dt, this);

    this.comboT = Math.max(0, this.comboT - dt);
    if (this.comboT === 0 && this.combo) { this.combo = 0; this.ui.setCombo(0); }

    for (let i = this.spawns.length - 1; i >= 0; i--) {
      const s = this.spawns[i]; s.t -= dt;
      if (s.t <= -.55) {
        this.enemies.push(new Enemy(s.type, s.x, s.tier, this.diff));
        ring(s.x, GROUND, THEMES[this.level.theme].accent, 6, 70, .4, 4);
        spark(s.x, GROUND - 20, 14, THEMES[this.level.theme].accent, 260);
        this.spawns.splice(i, 1);
      }
    }
    for (const e of this.enemies) e.update(dt, this);
    if (this.boss) { this.boss.update(dt, this); this.ui.boss(true, this.boss.hp, this.boss.maxHp); }
    for (const s of this.shots) s.update(dt);
    for (const d of this.drops) d.update(dt, this);

    this.resolveCombat();

    this.enemies = this.enemies.filter(e => !e.dead);
    this.shots = this.shots.filter(s => !s.dead);
    this.drops = this.drops.filter(d => !d.dead);

    // tiến độ đợt
    if (this.state === 'play' && !this.enemies.length && !this.spawns.length) {
      this.waveT -= dt;
      if (this.waveT <= 0) {
        this.waveT = 1.35;
        if (this.bossPending && this.waveIdx >= this.level.waves.length - 1 && !this.boss) {
          this.ui.setWave(this.level.waves.length);
          this.summonBoss();
        } else if (this.waveIdx < this.level.waves.length - 1) {
          this.waveIdx++;
          this.dispatchEvent(new CustomEvent('wave:clear', { detail: { next: this.waveIdx, last: false } }));
          this.spawnWave();
        } else if (!this.level.boss) {
          this.dispatchEvent(new CustomEvent('level:clear', { detail: { level: this.levelIdx } }));
          this.nextLevel();
        }
      }
    }
    if (this.hz) this.hz.update(dt);
    cam.follow(h, this.level.w, dt);
    stepFX(dt);
    this.ui.bars(h);
  }
  summonBoss() {
    this.bossPending = false;
    Music.play('boss');
    this.boss = new Boss(clamp(this.hero.x + 520, 300, this.level.w - 200), this.diff.bossMul, this.diff);
    this.boss.face = this.boss.x > this.hero.x ? -1 : 1;
    Sfx.roar(); cam.kick(22); cam.bang('rgba(225,29,72,.4)', 1);
    this.ui.boss(true, this.boss.hp, this.boss.maxHp); this.ui.phases(0);
    this.banner('HẮC LONG VƯƠNG', 'CHỦ NHÂN CỦA ĐIỆN HẮC ÁM');
    ring(this.boss.x, GROUND, '#e11d48', 10, 300, .9, 9);
  }
  addGold(n) { this.gold += n; this.ui.setGold(this.gold); }

  shopCard() {
    this.state = 'shop';
    const h = this.hero;
    const rows = UPGRADES.map((u, i) => {
      const lv = u.id === 'revive' ? h.up.revive : h.up[u.id];
      const maxed = lv >= u.max;
      const cost = maxed ? 0 : u.cost(lv);
      const can = !maxed && this.gold >= cost;
      const pips = Array.from({ length: u.max }, (_, k) => '<i class="' + (k < lv ? 'on' : '') + '"></i>').join('');
      return '<button class="upbtn' + (can ? '' : ' off') + '"' + (can ? ' data-act="buy" data-i="' + i + '"' : '') + '>' +
        '<span class="ui">' + u.ic + '</span>' +
        '<span class="un">' + u.name + '</span>' +
        '<span class="up-pips">' + pips + '</span>' +
        '<span class="ud">' + (maxed ? 'Đã đạt tối đa' : u.desc(lv)) + '</span>' +
        '<span class="uc">' + (maxed ? '—' : cost + ' ⛁') + '</span></button>';
    }).join('');
    this.ui.show(
      '<div class="eyebrow">LUYỆN CÔNG · CÒN <b class="gold">' + this.gold.toLocaleString('vi-VN') + ' ⛁</b></div>' +
      '<h2>NÂNG CẤP</h2><p>Vàng nhặt được và tiền thưởng vượt ải dùng để tăng sức mạnh. Chọn thứ hợp lối đánh của bạn.</p>' +
      '<div class="uplist">' + rows + '</div>' +
      '<div class="row"><button class="btn" data-act="next">' +
      (this.levelIdx + 1 < LEVELS.length ? 'VÀO ẢI TIẾP THEO' : 'TIẾP TỤC') + '</button></div>');
  }

  nextLevel() {
    if (this.levelIdx + 1 >= LEVELS.length) { this.over(true); return; }
    this.state = 'clear';
    const bonus = Math.round((150 + this.kills * 7 + this.score / 22) * this.diff.scoreMul);
    this.addGold(bonus);
    this.lastBonus = bonus;
    this.ui.show(
      '<div class="eyebrow">VƯỢT ẢI THÀNH CÔNG</div><h2>' + this.level.name + '</h2>' +
      '<p>Kiếm sĩ tiến sâu hơn. Máu hồi 30 điểm, nội lực và khí thuẫn đầy lại.</p>' +
      '<div class="stats-grid"><div><small>ĐIỂM</small><strong>' + this.score.toLocaleString('vi-VN') + '</strong></div>' +
      '<div><small>HẠ GỤC</small><strong>' + this.kills + '</strong></div>' +
      '<div><small>THƯỞNG</small><strong class="gold">+' + bonus + ' ⛁</strong></div></div>' +
      '<div class="row"><button class="btn" data-act="shop">LUYỆN CÔNG</button></div>');
  }

  resolveCombat() {
    const h = this.hero;
    // đòn chém của người chơi
    if (h.atkT > 0 && h.atkT > h.atkDur * .25) {
      const hb = h.hitbox(), dmg = Math.round(atkDmg(h.combo) * h.atkMul), crit = h.combo === 2;
      for (const e of this.enemies) {
        if (e.dead || h.hitOnce.has(e)) continue;
        if (aabb(hb, e.box)) {
          h.hitOnce.add(e); e.hurt(dmg, h.face, this, crit);
          h.gain(4); this.combo++; this.comboT = 2.4; this.ui.setCombo(this.combo);
          Sfx.hit(); cam.kick(crit ? 8 : 4);
          this.hitStop = crit ? .07 : .035;
        }
      }
      if (this.boss && !this.boss.dead && !h.hitOnce.has(this.boss) && aabb(hb, this.boss.box)) {
        h.hitOnce.add(this.boss); this.boss.hurt(dmg, h.face, this, crit);
        h.gain(4); Sfx.hit(); cam.kick(crit ? 8 : 4); this.hitStop = crit ? .07 : .035;
      }
    }
    // đạn
    for (const s of this.shots) {
      if (s.dead) continue;
      const b = s.box();
      if (s.from === 'p') {
        for (const e of this.enemies) {
          if (e.dead) continue;
          if (aabb(b, e.box)) {
            e.hurt(s.dmg, sign(s.vx || 1), this, false); s.pop(); Sfx.hit();
            h.gain(3); this.combo++; this.comboT = 2.4; this.ui.setCombo(this.combo);
            if (s.pierce > 0) s.pierce--; else { s.dead = true; break; }
          }
        }
        if (this.boss && !this.boss.dead && !s.dead && aabb(b, this.boss.box)) {
          this.boss.hurt(s.dmg, sign(s.vx || 1), this, false); s.pop(); s.dead = true; Sfx.hit(); h.gain(3);
        }
      } else if (aabb(b, h.box) && h.invT <= 0) {
        const perfect = h.blocking && h.blockT < .22 && h.brokeT <= 0 &&
                        (Math.sign(s.x - h.x) === h.face || Math.abs(s.x - h.x) < 6);
        h.hurt(s.dmg, sign(s.vx || 1), this, s.x);
        if (perfect && h.parryT > 0) {                 // ĐỠ HOÀN HẢO → bắn ngược lại
          s.from = 'p'; s.vx = -s.vx * 1.4; s.vy = -s.vy * 1.1;
          s.dmg = Math.round(s.dmg * 1.9); s.life = Math.max(s.life, 1.8); s.age = 0;
          spark(s.x, s.y, 12, '#eaffff', 320);
        } else { s.pop(); s.dead = true; }
      }
    }
    // va chạm thân quái
    for (const e of this.enemies) {
      if (e.dead || h.invT > 0) continue;
      if (e.type === 'skeleton' && e.state !== 'swing') continue;
      if (aabb(e.box, h.box)) h.hurt(e.dmg, sign(h.x - e.x || 1), this, e.x);
    }
  }

  /* ---------- vẽ ---------- */
  render() {
    const ctx = this.ctx, th = this.level ? this.level.theme : 'palace';
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, VW, VH);
    drawBackground(ctx, th, cam.x, performance.now() / 1000);
    if (!this.level) return;

    drawGround(ctx, th, cam.x - cam.sx, this.level.w);

    ctx.save();
    ctx.translate(-Math.round(cam.x) + cam.sx, cam.sy);

    for (const p of this.plats) drawPlatform(ctx, th, p);
    if (this.hz) this.hz.drawUnder(ctx, performance.now() / 1000);
    for (const d of this.drops) d.draw(ctx);
    for (const s of this.spawns) {                        // vòng triệu hồi
      const u = clamp(1 - Math.max(0, s.t) / Math.max(.001, s.max), 0, 1);
      const acc = THEMES[th].accent;
      ctx.save(); ctx.translate(s.x, GROUND); ctx.rotate(u * 6);
      ctx.globalAlpha = .35 + u * .5; ctx.strokeStyle = acc; ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.ellipse(0, 0, 34 * u, 12 * u, 0, 0, TAU); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(0, 0, 22 * u, 8 * u, 0, 0, TAU); ctx.stroke();
      for (let i = 0; i < 6; i++) {
        const a = i * TAU / 6;
        ctx.beginPath(); ctx.moveTo(Math.cos(a) * 22 * u, Math.sin(a) * 8 * u);
        ctx.lineTo(Math.cos(a) * 34 * u, Math.sin(a) * 12 * u); ctx.stroke();
      }
      ctx.restore(); ctx.globalAlpha = 1;
      glowDot(ctx, s.x, GROUND - 16 * u, 40 * u, 'rgba(255,255,255,.22)');
    }
    for (const e of this.enemies) e.draw(ctx);
    if (this.boss) this.boss.draw(ctx);
    for (const s of this.shots) drawShot(ctx, s);
    if (this.hero && this.hero.alive) this.hero.draw(ctx);
    drawFX(ctx);
    if (this.hz) this.hz.drawOver(ctx, cam.x - cam.sx, performance.now() / 1000);
    ctx.restore();

    // lớp phủ: sương, vignette, chớp sáng
    ctx.fillStyle = THEMES[th].fog; ctx.fillRect(0, 0, VW, VH);
    const tint = hzTint();
    if (tint) { ctx.fillStyle = tint.veil; ctx.fillRect(0, 0, VW, VH); if (this.hz) this.hz.drawEmbers(ctx, performance.now() / 1000); }
    const vg = ctx.createRadialGradient(VW / 2, VH / 2, VH * .42, VW / 2, VH / 2, VH * 1.05);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.72)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, VW, VH);
    if (cam.flash > 0) { ctx.globalAlpha = clamp(cam.flash, 0, 1) * .8; ctx.fillStyle = cam.flashCol; ctx.fillRect(0, 0, VW, VH); ctx.globalAlpha = 1; }
    if (this.hero && this.hero.hp / this.hero.maxHp < .3 && this.state === 'play') {
      ctx.globalAlpha = .18 + Math.sin(performance.now() / 260) * .1;
      const rg = ctx.createRadialGradient(VW / 2, VH / 2, VH * .3, VW / 2, VH / 2, VH);
      rg.addColorStop(0, 'rgba(0,0,0,0)'); rg.addColorStop(1, '#ff2d2d');
      ctx.fillStyle = rg; ctx.fillRect(0, 0, VW, VH); ctx.globalAlpha = 1;
    }
  }
}

/* ═══ 17. ẢNH ĐẠI DIỆN TRONG HUD (canvas riêng) ═══ */
function drawPortrait() {
  const c = $('#pfp'), x = c.getContext('2d');
  const P = HERO_PAL;
  x.clearRect(0, 0, 132, 132);
  const g = x.createRadialGradient(64, 44, 6, 66, 74, 92);
  g.addColorStop(0, '#1a2b45'); g.addColorStop(1, '#05080f');
  x.fillStyle = g; x.fillRect(0, 0, 132, 132);
  x.save(); x.translate(48, 104); x.scale(2.1, 2.1);
  const HD = -22;
  x.fillStyle = P.robe2;                                  // vai áo
  x.beginPath(); x.moveTo(-16, HD + 26); x.quadraticCurveTo(0, HD + 16, 17, HD + 26);
  x.lineTo(20, HD + 42); x.lineTo(-20, HD + 42); x.closePath(); x.fill();
  x.strokeStyle = P.trim; x.lineWidth = 2.4;
  x.beginPath(); x.moveTo(-8, HD + 18); x.lineTo(4, HD + 22); x.lineTo(11, HD + 40); x.stroke();
  x.fillStyle = P.hair;
  x.beginPath(); x.ellipse(-2, HD + 1, 9.6, 10.2, 0, 0, TAU); x.fill();
  x.fillStyle = P.skin;
  x.beginPath();
  x.moveTo(-5, HD - 8); x.quadraticCurveTo(7, HD - 9.5, 8.6, HD - 1);
  x.quadraticCurveTo(10.4, HD + 1.6, 7.4, HD + 3.4);
  x.quadraticCurveTo(8.6, HD + 6.4, 4.6, HD + 8.6);
  x.quadraticCurveTo(-1, HD + 11, -5, HD + 6); x.closePath(); x.fill();
  x.fillStyle = P.hair;
  x.beginPath(); x.moveTo(-7, HD - 2); x.quadraticCurveTo(-6, HD - 12, 3, HD - 11);
  x.quadraticCurveTo(9, HD - 10, 8.8, HD - 3.6); x.quadraticCurveTo(5, HD - 7.4, 0, HD - 6);
  x.quadraticCurveTo(-3, HD - 4.4, -4, HD + 1); x.closePath(); x.fill();
  x.strokeStyle = '#2b2016'; x.lineWidth = 1.7;
  x.beginPath(); x.moveTo(1.4, HD - 3.4); x.lineTo(7, HD - 2); x.stroke();
  x.fillStyle = '#141821';
  x.beginPath(); x.moveTo(2.4, HD + .4); x.quadraticCurveTo(5, HD - 1.4, 7.4, HD + .6);
  x.quadraticCurveTo(5, HD + 2, 2.4, HD + .4); x.closePath(); x.fill();
  x.fillStyle = '#8fe9ff'; x.shadowBlur = 8; x.shadowColor = '#67e8f9';
  x.beginPath(); x.arc(5.4, HD + .4, 1.2, 0, TAU); x.fill(); x.shadowBlur = 0;
  x.fillStyle = P.hair;                                    // búi tóc + trâm
  x.beginPath(); x.ellipse(-1, HD - 12, 6.2, 5.2, -.2, 0, TAU); x.fill();
  x.strokeStyle = P.gold; x.lineWidth = 2.2;
  x.beginPath(); x.moveTo(-8, HD - 14); x.lineTo(6, HD - 10); x.stroke();
  x.fillStyle = P.gold; x.beginPath(); x.arc(6.6, HD - 9.8, 2.2, 0, TAU); x.fill();
  x.strokeStyle = '#c0392b'; x.lineWidth = 2.8;            // khăn trán + dải bay
  x.beginPath(); x.moveTo(-8, HD - 5); x.quadraticCurveTo(0, HD - 8, 8.6, HD - 4.4); x.stroke();
  x.lineWidth = 2.2;
  x.beginPath(); x.moveTo(-8, HD - 4); x.quadraticCurveTo(-18, HD + 2, -24, HD + 14); x.stroke();
  x.restore();
}

/* ═══ 18. KHỞI ĐỘNG + VÒNG LẶP ═══ */
addEventListener('error', e => { try { GAME.crash(e.error || new Error(e.message)); } catch (x) { /* bỏ qua */ } });
addEventListener('unhandledrejection', e => { try { GAME.crash(e.reason || new Error('promise thất bại')); } catch (x) { /* bỏ qua */ } });
loadSheets();
drawPortrait();
const GAME = new Game($('#game'));
GAME.level = LEVELS[0]; GAME.plats = LEVELS[0].plat;
GAME.enemies = []; GAME.shots = []; GAME.drops = []; GAME.spawns = [];
GAME.score = 0; GAME.combo = 0; GAME.comboT = 0; GAME.kills = 0; GAME.time = 0; GAME.hitStop = 0;
GAME.diffIdx = 1; GAME.diff = DIFFS[1];
GAME.gold = 0; GAME.quakeT = 0; GAME.endT = null; GAME.crashed = false;
GAME.ui.setGold(0);
GAME.ui.setDiff(GAME.diff); GAME.ui.cheatBadge(); GAME.ui.godBadge();
GAME.menuCard();

let last = performance.now(), acc = 0;
function frame(now) {
  try {
    let dt = (now - last) / 1000; last = now;
    if (!isFinite(dt) || dt < 0) dt = 0;
    if (dt > .1) dt = .1;
    if (GAME.hitStop > 0) { GAME.hitStop -= dt; dt *= .18; }   // khựng hình khi đánh trúng
    dt *= CHEAT.speed;
    acc = Math.min(acc + dt, .25);
    let guard = 0;
    while (acc >= 1 / 120 && guard++ < 8) { GAME.update(1 / 120); Input.endFrame(); acc -= 1 / 120; }
    if (GAME.state !== 'play') { stepFX(dt); Input.endFrame(); }
    GAME.tickTimers(dt);
    GAME.render();
    GAME.ui.cheatBadge();
  } catch (err) {
    GAME.crash(err);          // bắt lỗi nhưng KHÔNG dừng vòng lặp
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

  </script>
